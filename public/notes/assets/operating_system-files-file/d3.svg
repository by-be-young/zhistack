<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" viewBox="0 0 860 540"><defs><lineargradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"></stop><stop offset="100%" stop-color="#eef2f7"></stop></lineargradient><lineargradient id="gProc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#60a5fa"></stop><stop offset="100%" stop-color="#3b82f6"></stop></lineargradient><lineargradient id="gOFT" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbbf24"></stop><stop offset="100%" stop-color="#f59e0b"></stop></lineargradient><lineargradient id="gInode" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34d399"></stop><stop offset="100%" stop-color="#10b981"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><fedropshadow dx="0" dy="3" flood-color="#1e293b" flood-opacity=".18" stddeviation="4"></fedropshadow></filter><marker id="ah" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="4"><path d="M0 0 9 4 0 8z" fill="#64748b"></path></marker></defs><rect fill="url(#bg)" height="540" rx="16" width="860"></rect><text fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle" x="430" y="46">系统文件打开表（Open File Table）</text><text fill="#64748b" font-size="14" text-anchor="middle" x="430" y="74">内核全局唯一 · 记录每次 open 的「偏移量 / 模式 / 引用计数」· 指向 inode</text><g><rect fill="#fff" filter="url(#shadow)" height="360" rx="14" stroke="#dbeafe" stroke-width="2" width="200" x="40" y="120"></rect><rect fill="url(#gProc)" height="40" rx="14" width="200" x="40" y="120"></rect><rect fill="url(#gProc)" height="14" width="200" x="40" y="146"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="140" y="146">进程文件描述符表</text><text fill="#94a3b8" font-size="11" text-anchor="middle" x="140" y="178">（进程级）</text><text fill="#1e40af" font-size="12" font-weight="700" x="70" y="208">进程 A</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="156" x="62" y="218"></rect><text fill="#1e3a8a" font-size="12" x="76" y="240">fd 3</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="156" x="62" y="258"></rect><text fill="#1e3a8a" font-size="12" x="76" y="280">fd 4 (dup)</text><text fill="#1e40af" font-size="12" font-weight="700" x="70" y="338">进程 B</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="156" x="62" y="348"></rect><text fill="#1e3a8a" font-size="12" x="76" y="370">fd 3</text></g><g><rect fill="#fff" filter="url(#shadow)" height="360" rx="14" stroke="#fef3c7" stroke-width="2" width="220" x="330" y="120"></rect><rect fill="url(#gOFT)" height="40" rx="14" width="220" x="330" y="120"></rect><rect fill="url(#gOFT)" height="14" width="220" x="330" y="146"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="440" y="146">系统打开文件表</text><text fill="#94a3b8" font-size="11" text-anchor="middle" x="440" y="178">（系统全局唯一）</text><rect fill="#fffbeb" height="76" rx="9" stroke="#fcd34d" width="184" x="348" y="195"></rect><text fill="#92400e" font-size="12" font-weight="700" x="362" y="214">表项 0</text><text fill="#78350f" font-size="11" x="362" y="234">offset = 120</text><text fill="#78350f" font-size="11" x="362" y="251">mode = O_RDONLY</text><text fill="#b45309" font-size="11" x="362" y="268">refcount = 2</text><rect fill="#fffbeb" height="76" rx="9" stroke="#fcd34d" width="184" x="348" y="290"></rect><text fill="#92400e" font-size="12" font-weight="700" x="362" y="309">表项 1</text><text fill="#78350f" font-size="11" x="362" y="329">offset = 0</text><text fill="#78350f" font-size="11" x="362" y="346">mode = O_RDONLY</text><text fill="#b45309" font-size="11" x="362" y="363">refcount = 1</text></g><g><rect fill="#fff" filter="url(#shadow)" height="360" rx="14" stroke="#d1fae5" stroke-width="2" width="180" x="640" y="120"></rect><rect fill="url(#gInode)" height="40" rx="14" width="180" x="640" y="120"></rect><rect fill="url(#gInode)" height="14" width="180" x="640" y="146"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="730" y="146">inode 表</text><text fill="#94a3b8" font-size="11" text-anchor="middle" x="730" y="178">（系统级）</text><rect fill="#ecfdf5" height="120" rx="9" stroke="#6ee7b7" width="144" x="658" y="220"></rect><text fill="#065f46" font-size="13" font-weight="700" text-anchor="middle" x="730" y="250">inode</text><text fill="#065f46" font-size="13" font-weight="700" text-anchor="middle" x="730" y="250"></text><text fill="#047857" font-size="11" text-anchor="middle" x="730" y="278">fileA.txt</text><text fill="#047857" font-size="11" text-anchor="middle" x="730" y="300">元数据 + 数据块指针</text><text fill="#047857" font-size="11" text-anchor="middle" x="730" y="322">磁盘上唯一</text></g><g fill="none" marker-end="url(#ah)" stroke="#64748b" stroke-width="2"><path d="M218 235c62 0 72-2 128-2"></path><path d="M218 275c62 0 82-30 128-30"></path><path d="M218 365c72 0 82-37 128-37"></path></g><g fill="none" marker-end="url(#ah)" stroke="#64748b" stroke-width="2"><path d="M532 233c68 0 68 37 124 42"></path><path d="M532 328c68 0 78-38 124-38"></path></g><text fill="#3b82f6" font-size="11" text-anchor="middle" x="278" y="430">同进程 dup</text><text fill="#3b82f6" font-size="11" text-anchor="middle" x="278" y="446">→ 共享同一表项</text><text fill="#10b981" font-size="11" text-anchor="middle" x="592" y="430">不同 open</text><text fill="#10b981" font-size="11" text-anchor="middle" x="592" y="446">→ 各自表项</text><text fill="#10b981" font-size="11" text-anchor="middle" x="592" y="462">但指向同一 inode</text><rect fill="#0f172a" height="30" rx="9" width="780" x="40" y="500"></rect><text fill="#e2e8f0" font-size="12.5" text-anchor="middle" x="430" y="520">dup 共享表项（偏移量同步）；独立 open 各有表项（偏移量独立），最终都指向同一个 inode</text></svg>