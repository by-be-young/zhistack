<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 880 460"><defs><lineargradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fafbff"></stop><stop offset="1" stop-color="#eef1f8"></stop></lineargradient><lineargradient id="gOpen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f9df7"></stop><stop offset="1" stop-color="#2b6dd3"></stop></lineargradient><lineargradient id="gRead" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#5ec8a4"></stop><stop offset="1" stop-color="#2f9c7a"></stop></lineargradient><lineargradient id="gWrite" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f3a35c"></stop><stop offset="1" stop-color="#d97a2c"></stop></lineargradient><lineargradient id="gSeek" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#b58af0"></stop><stop offset="1" stop-color="#7e4dc7"></stop></lineargradient><lineargradient id="gClose" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f0788a"></stop><stop offset="1" stop-color="#c64259"></stop></lineargradient><lineargradient id="gKernel" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="1" stop-color="#f1f4fb"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><fegaussianblur in="SourceAlpha" stddeviation="2"></fegaussianblur><feoffset dx="0" dy="2" result="off"></feoffset><fecomponenttransfer><fefunca slope=".18" type="linear"></fefunca></fecomponenttransfer><femerge><femergenode></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter><marker id="arr" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#5b6478"></path></marker></defs><rect fill="url(#bg)" height="460" width="880"></rect><text fill="#2b3556" font-size="20" font-weight="700" text-anchor="middle" x="440" y="36">文件系统调用 · 操作逻辑</text><text fill="#6a7390" font-size="12" text-anchor="middle" x="440" y="56">open → read / write / lseek → close</text><g filter="url(#shadow)"><rect fill="#fff" height="320" rx="14" stroke="#dfe4f0" width="170" x="40" y="90"></rect></g><text fill="#2b3556" font-size="13" font-weight="700" text-anchor="middle" x="125" y="115">用户进程</text><text fill="#8a92a8" font-size="11" text-anchor="middle" x="125" y="132">User Space</text><g fill="#fff" font-size="13" font-weight="600"><g><rect fill="url(#gOpen)" height="36" rx="18" width="130" x="60" y="150"></rect><text text-anchor="middle" x="125" y="173">open()</text></g><g><rect fill="url(#gRead)" height="36" rx="18" width="130" x="60" y="196"></rect><text text-anchor="middle" x="125" y="219">read()</text></g><g><rect fill="url(#gWrite)" height="36" rx="18" width="130" x="60" y="242"></rect><text text-anchor="middle" x="125" y="265">write()</text></g><g><rect fill="url(#gSeek)" height="36" rx="18" width="130" x="60" y="288"></rect><text text-anchor="middle" x="125" y="311">lseek()</text></g><g><rect fill="url(#gClose)" height="36" rx="18" width="130" x="60" y="334"></rect><text text-anchor="middle" x="125" y="357">close()</text></g></g><g filter="url(#shadow)"><rect fill="url(#gKernel)" height="320" rx="14" stroke="#dfe4f0" width="430" x="260" y="90"></rect></g><text fill="#2b3556" font-size="13" font-weight="700" text-anchor="middle" x="475" y="115">内核</text><text fill="#8a92a8" font-size="11" text-anchor="middle" x="475" y="132">Kernel Space</text><g><line marker-end="url(#arr)" stroke="#5b6478" stroke-width="1.5" x1="195" x2="270" y1="168" y2="168"></line><rect fill="#eaf2fe" height="36" rx="8" stroke="#bcd3f5" width="405" x="275" y="150"></rect><circle cx="293" cy="168" fill="url(#gOpen)" r="6"></circle><text fill="#2b3556" font-size="12" x="308" y="172">检查权限 → 加载 inode → 建表项 → 返回<tspan font-weight="700">fd</tspan></text></g><g><line marker-end="url(#arr)" stroke="#5b6478" stroke-width="1.5" x1="195" x2="270" y1="214" y2="214"></line><rect fill="#e8f6ef" height="36" rx="8" stroke="#bfe1d0" width="405" x="275" y="196"></rect><circle cx="293" cy="214" fill="url(#gRead)" r="6"></circle><text fill="#2b3556" font-size="12" x="308" y="218">页缓存命中? → 命中即拷回；未命中则读盘 +<tspan font-weight="700">预读</tspan></text></g><g><line marker-end="url(#arr)" stroke="#5b6478" stroke-width="1.5" x1="195" x2="270" y1="260" y2="260"></line><rect fill="#fdf0e2" height="36" rx="8" stroke="#f3cfa5" width="405" x="275" y="242"></rect><circle cx="293" cy="260" fill="url(#gWrite)" r="6"></circle><text fill="#2b3556" font-size="12" x="308" y="264">写入页缓存（置脏）→<tspan font-weight="700">延迟写</tspan>，必要时 fsync 刷盘</text></g><g><line marker-end="url(#arr)" stroke="#5b6478" stroke-width="1.5" x1="195" x2="270" y1="306" y2="306"></line><rect fill="#f1ebfb" height="36" rx="8" stroke="#d6c4f0" width="405" x="275" y="288"></rect><circle cx="293" cy="306" fill="url(#gSeek)" r="6"></circle><text fill="#2b3556" font-size="12" x="308" y="310">移动偏移量（不读写）→ 支持<tspan font-weight="700">随机访问</tspan></text></g><g><line marker-end="url(#arr)" stroke="#5b6478" stroke-width="1.5" x1="195" x2="270" y1="352" y2="352"></line><rect fill="#fde7eb" height="36" rx="8" stroke="#f3bcc5" width="405" x="275" y="334"></rect><circle cx="293" cy="352" fill="url(#gClose)" r="6"></circle><text fill="#2b3556" font-size="12" x="308" y="356">引用计数 -1 → 归零则释放表项与 inode 缓存</text></g><g filter="url(#shadow)"><rect fill="#fff" height="320" rx="14" stroke="#dfe4f0" width="130" x="710" y="90"></rect></g><text fill="#2b3556" font-size="13" font-weight="700" text-anchor="middle" x="775" y="115">磁盘</text><text fill="#8a92a8" font-size="11" text-anchor="middle" x="775" y="132">Storage</text><g transform="translate(775,260)"><ellipse cx="0" cy="-40" fill="#cfd6e6" rx="42" ry="10"></ellipse><path d="M-42-40V40a42 10 0 0084 0V-40z" fill="#e3e8f3" stroke="#cfd6e6"></path><ellipse cx="0" cy="-40" fill="#f4f6fc" rx="42" ry="10" stroke="#cfd6e6"></ellipse><ellipse cx="0" cy="0" fill="none" rx="42" ry="10" stroke="#cfd6e6" stroke-dasharray="2 3"></ellipse><ellipse cx="0" cy="40" fill="none" rx="42" ry="10" stroke="#cfd6e6" stroke-dasharray="2 3"></ellipse></g><g fill="none" stroke="#9ea7be" stroke-dasharray="4 4"><path d="M680 214c20 0 20 16 40 16" marker-end="url(#arr)"></path><path d="M720 290c-20 0-20-30-40-30" marker-end="url(#arr)"></path></g><text fill="#8a92a8" font-size="10" x="700" y="206">读盘</text><text fill="#8a92a8" font-size="10" x="700" y="302">刷盘</text><g fill="#6a7390" font-size="11"><rect fill="#dfe4f0" height=".5" width="800" x="40" y="430"></rect><text x="40" y="450">每次操作均经由内核维护的<tspan fill="#2b3556" font-weight="700">文件描述符表 / 系统打开文件表 / inode 表</tspan>协同完成。</text></g></svg>