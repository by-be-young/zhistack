<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460"><rect fill="none" height="460" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" x="400" y="34">inode 表（inode table）</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="400" y="58">存储文件系统中所有 inode 的唯一容器，按 inode 编号索引</text><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="155" y="92">文件 / 目录</text><g fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold"><rect fill="#3498db" height="44" rx="6" width="190" x="60" y="110"></rect><text text-anchor="middle" x="155" y="138">/etc (inode 1)</text><rect fill="#e74c3c" height="44" rx="6" width="190" x="60" y="180"></rect><text text-anchor="middle" x="155" y="208">a.txt (inode 2)</text><rect fill="#27ae60" height="44" rx="6" width="190" x="60" y="250"></rect><text text-anchor="middle" x="155" y="278">link (inode 3)</text><rect fill="#9b59b6" height="44" rx="6" width="190" x="60" y="320"></rect><text text-anchor="middle" x="155" y="348">app (inode 4)</text></g><g marker-end="url(#arrow)" stroke="#34495e" stroke-width="2"><line x1="250" x2="380" y1="132" y2="132"></line><line x1="250" x2="380" y1="202" y2="202"></line><line x1="250" x2="380" y1="272" y2="272"></line><line x1="250" x2="380" y1="342" y2="342"></line></g><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="315" y="100">凭 inode 编号查找</text><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3"><path d="M0 0 8 3 0 6z" fill="#34495e"></path></marker></defs><rect fill="#ecf0f1" height="320" rx="8" stroke="#34495e" stroke-width="2" width="370" x="380" y="100"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="565" y="92">inode 表</text><g fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold"><text text-anchor="middle" x="430" y="125">编号</text><text text-anchor="middle" x="615" y="125">inode（元数据 + 数据块指针）</text></g><line stroke="#bdc3c7" stroke-width="1" x1="390" x2="740" y1="132" y2="132"></line><g fill="#2c3e50" font-family="Arial, sans-serif" font-size="12"><rect fill="#3498db" height="50" rx="4" width="50" x="395" y="142"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="420" y="172">1</text><rect fill="#d6eaf8" height="50" rx="4" width="285" x="455" y="142"></rect><text x="465" y="165">目录 / drwxr-xr-x / root</text><text fill="#7f8c8d" x="465" y="183">块: [100,101,102]</text><rect fill="#e74c3c" height="50" rx="4" width="50" x="395" y="212"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="420" y="242">2</text><rect fill="#fadbd8" height="50" rx="4" width="285" x="455" y="212"></rect><text x="465" y="235">文件 / -rw-r--r-- / user</text><text fill="#7f8c8d" x="465" y="253">块: [200,201]</text><rect fill="#27ae60" height="50" rx="4" width="50" x="395" y="282"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="420" y="312">3</text><rect fill="#d5f5e3" height="50" rx="4" width="285" x="455" y="282"></rect><text x="465" y="305">符号链接 / lrwxrwxrwx / user</text><text fill="#7f8c8d" x="465" y="323">路径: "/etc/abc"</text><rect fill="#9b59b6" height="50" rx="4" width="50" x="395" y="352"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="420" y="382">4</text><rect fill="#ebdef0" height="50" rx="4" width="285" x="455" y="352"></rect><text x="465" y="375">文件 / -rwxr-xr-x / user</text><text fill="#7f8c8d" x="465" y="393">块: [300,301,302,303]</text></g><text fill="#34495e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" x="400" y="440">每个文件/目录都有唯一编号，文件系统凭编号在表中定位对应 inode；多个进程打开同一文件共享同一个 inode</text></svg>