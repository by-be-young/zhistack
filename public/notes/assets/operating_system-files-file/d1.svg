<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">inode (索引节点) 结构</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="400" y="55">存储文件元数据，不包括文件名和实际内容</text><rect fill="#ecf0f1" height="480" rx="10" stroke="#34495e" stroke-width="2" width="250" x="100" y="80"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="225" y="105">inode</text><g fill="#2c3e50" font-family="Arial, sans-serif" font-size="12"><rect fill="#3498db" height="30" rx="5" width="210" x="120" y="120"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="140">文件类型</text><rect fill="#e74c3c" height="30" rx="5" width="210" x="120" y="160"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="180">权限</text><rect fill="#f39c12" height="30" rx="5" width="210" x="120" y="200"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="220">所有者</text><rect fill="#27ae60" height="30" rx="5" width="210" x="120" y="240"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="260">大小</text><rect fill="#9b59b6" height="30" rx="5" width="210" x="120" y="280"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="300">时间戳</text><rect fill="#1abc9c" height="30" rx="5" width="210" x="120" y="320"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="340">链接计数</text><rect fill="#95a5a6" height="180" rx="5" width="210" x="120" y="360"></rect><text fill="#fff" font-weight="bold" text-anchor="middle" x="225" y="380">数据块指针</text></g><g fill="#2c3e50" font-family="Arial, sans-serif" font-size="11"><rect fill="#ecf0f1" height="30" rx="3" stroke="#3498db" stroke-width="1" width="380" x="380" y="120"></rect><text font-weight="bold" x="390" y="140">普通文件、目录、链接文件等</text><rect fill="#ecf0f1" height="30" rx="3" stroke="#e74c3c" stroke-width="1" width="380" x="380" y="160"></rect><text font-weight="bold" x="390" y="180">用户、组、其他用户的读、写、执行权限 (rwxrwxrwx)</text><rect fill="#ecf0f1" height="30" rx="3" stroke="#f39c12" stroke-width="1" width="380" x="380" y="200"></rect><text font-weight="bold" x="390" y="220">文件所有者和组的 UID/GID</text><rect fill="#ecf0f1" height="30" rx="3" stroke="#27ae60" stroke-width="1" width="380" x="380" y="240"></rect><text font-weight="bold" x="390" y="260">文件大小（字节数）</text><rect fill="#ecf0f1" height="30" rx="3" stroke="#9b59b6" stroke-width="1" width="380" x="380" y="280"></rect><text font-weight="bold" x="390" y="300">创建时间、修改时间、访问时间</text><rect fill="#ecf0f1" height="30" rx="3" stroke="#1abc9c" stroke-width="1" width="380" x="380" y="320"></rect><text font-weight="bold" x="390" y="340">硬链接数量，为0时文件被删除</text><rect fill="#ecf0f1" height="180" rx="3" stroke="#95a5a6" stroke-width="1" width="380" x="380" y="360"></rect><text font-weight="bold" x="390" y="380">指向存储文件内容的磁盘块：</text><rect fill="#bdc3c7" height="25" rx="3" width="340" x="400" y="390"></rect><text font-weight="bold" x="410" y="407">• 直接指针：直接指向数据块</text><rect fill="#bdc3c7" height="25" rx="3" width="340" x="400" y="420"></rect><text font-weight="bold" x="410" y="437">• 间接指针：指向包含数据块地址的块</text><rect fill="#bdc3c7" height="25" rx="3" width="340" x="400" y="450"></rect><text font-weight="bold" x="410" y="467">• 二级间接指针：指向间接指针块</text><rect fill="#bdc3c7" height="25" rx="3" width="340" x="400" y="480"></rect><text font-weight="bold" x="410" y="497">• 三级间接指针：指向二级间接指针块</text><text fill="#7f8c8d" font-style="italic" text-anchor="middle" x="570" y="525">(支持大文件存储)</text></g><g opacity=".6" stroke="#34495e" stroke-width="1"><line x1="350" x2="380" y1="135" y2="135"></line><line x1="350" x2="380" y1="175" y2="175"></line><line x1="350" x2="380" y1="215" y2="215"></line><line x1="350" x2="380" y1="255" y2="255"></line><line x1="350" x2="380" y1="295" y2="295"></line><line x1="350" x2="380" y1="335" y2="335"></line><line x1="350" x2="380" y1="450" y2="450"></line></g><rect fill="#34495e" height="25" rx="5" width="700" x="50" y="570"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="400" y="587">inode 是 UNIX/Linux 文件系统的核心概念，每个文件都有唯一的 inode 编号</text></svg>