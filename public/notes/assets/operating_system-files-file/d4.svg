<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'PingFang SC', Arial, sans-serif" viewBox="0 0 860 520"><defs><lineargradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"></stop><stop offset="100%" stop-color="#eef2f7"></stop></lineargradient><lineargradient id="gProc" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#818cf8"></stop><stop offset="100%" stop-color="#6366f1"></stop></lineargradient><lineargradient id="gFd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#60a5fa"></stop><stop offset="100%" stop-color="#3b82f6"></stop></lineargradient><lineargradient id="gOFT" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbbf24"></stop><stop offset="100%" stop-color="#f59e0b"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><fedropshadow dx="0" dy="3" flood-color="#1e293b" flood-opacity=".18" stddeviation="4"></fedropshadow></filter><marker id="ah" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="4"><path d="M0 0 9 4 0 8z" fill="#64748b"></path></marker></defs><rect fill="url(#bg)" height="520" rx="16" width="860"></rect><text fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle" x="430" y="46">文件描述符表（File Descriptor Table）</text><text fill="#64748b" font-size="14" text-anchor="middle" x="430" y="74">进程私有 · 把整数 fd 映射到「系统打开文件表」表项</text><rect fill="#fff" filter="url(#shadow)" height="370" rx="16" stroke="#e0e7ff" stroke-width="2" width="430" x="40" y="110"></rect><rect fill="url(#gProc)" height="40" rx="16" width="430" x="40" y="110"></rect><rect fill="url(#gProc)" height="14" width="430" x="40" y="136"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="255" y="137">进程（每个进程一张表）</text><text fill="#94a3b8" font-size="11" x="70" y="178">fd 0/1/2 默认指向 标准输入/输出/错误</text><g fill="#1e3a8a" font-size="12" font-weight="700"><text text-anchor="middle" x="120" y="206">fd</text><text text-anchor="middle" x="320" y="206">指向系统文件表项</text></g><line stroke="#cbd5e1" x1="70" x2="440" y1="214" y2="214"></line><g font-size="13"><rect fill="url(#gFd)" height="34" rx="7" width="100" x="70" y="222"></rect><text fill="#fff" font-weight="700" text-anchor="middle" x="120" y="244">0</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="250" x="190" y="222"></rect><text fill="#1e3a8a" x="205" y="244">stdin → 表项 5</text><rect fill="url(#gFd)" height="34" rx="7" width="100" x="70" y="264"></rect><text fill="#fff" font-weight="700" text-anchor="middle" x="120" y="286">1</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="250" x="190" y="264"></rect><text fill="#1e3a8a" x="205" y="286">stdout → 表项 6</text><rect fill="url(#gFd)" height="34" rx="7" width="100" x="70" y="306"></rect><text fill="#fff" font-weight="700" text-anchor="middle" x="120" y="328">2</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="250" x="190" y="306"></rect><text fill="#1e3a8a" x="205" y="328">stderr → 表项 7</text><rect fill="#2563eb" height="34" rx="7" width="100" x="70" y="348"></rect><text fill="#fff" font-weight="700" text-anchor="middle" x="120" y="370">3</text><rect fill="#dbeafe" height="34" rx="7" stroke="#93c5fd" stroke-width="2" width="250" x="190" y="348"></rect><text fill="#1e3a8a" font-weight="700" x="205" y="370">open() 返回 → 表项 9</text><rect fill="url(#gFd)" height="34" rx="7" width="100" x="70" y="390"></rect><text fill="#fff" font-weight="700" text-anchor="middle" x="120" y="412">4</text><rect fill="#eff6ff" height="34" rx="7" stroke="#bfdbfe" width="250" x="190" y="390"></rect><text fill="#1e3a8a" x="205" y="412">→ 表项 10</text></g><text fill="#6366f1" font-size="11" text-anchor="middle" x="255" y="452">fd 是进程范围内的最小可用非负整数</text><rect fill="#fff" filter="url(#shadow)" height="290" rx="14" stroke="#fef3c7" stroke-width="2" width="220" x="600" y="150"></rect><rect fill="url(#gOFT)" height="38" rx="14" width="220" x="600" y="150"></rect><rect fill="url(#gOFT)" height="14" width="220" x="600" y="174"></rect><text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="710" y="175">系统打开文件表</text><text fill="#94a3b8" font-size="11" text-anchor="middle" x="710" y="206">（全局共享）</text><g fill="#78350f" font-size="12"><rect fill="#fffbeb" height="30" rx="6" stroke="#fcd34d" width="180" x="620" y="222"></rect><text x="634" y="242">表项 5 · stdin</text><rect fill="#fffbeb" height="30" rx="6" stroke="#fcd34d" width="180" x="620" y="262"></rect><text x="634" y="282">表项 6 · stdout</text><rect fill="#fffbeb" height="30" rx="6" stroke="#fcd34d" width="180" x="620" y="302"></rect><text x="634" y="322">表项 7 · stderr</text><rect fill="#fef3c7" height="30" rx="6" stroke="#f59e0b" stroke-width="2" width="180" x="620" y="342"></rect><text font-weight="700" x="634" y="362">表项 9 · file.txt</text><rect fill="#fffbeb" height="30" rx="6" stroke="#fcd34d" width="180" x="620" y="382"></rect><text x="634" y="402">表项 10 · …</text></g><g fill="none" marker-end="url(#ah)" stroke="#94a3b8" stroke-width="1.6"><path d="M440 239c80 0 1e2-2 176-2"></path><path d="M440 281c80 0 1e2-4 176-4"></path><path d="M440 323c80 0 1e2-6 176-6"></path></g><g fill="none" marker-end="url(#ah)" stroke="#2563eb" stroke-width="2.2"><path d="M440 365c85 0 1e2-8 176-8"></path></g><rect fill="#0f172a" height="28" rx="9" width="780" x="40" y="488"></rect><text fill="#e2e8f0" font-size="12.5" text-anchor="middle" x="430" y="507">fd 只是进程内的整数索引，真正的偏移量与 inode 信息保存在它指向的系统文件表项中</text></svg>