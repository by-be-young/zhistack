<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, sans-serif" font-size="13" viewBox="0 0 880 520"><defs><marker id="arr7" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker></defs><text class="title" text-anchor="middle" x="440" y="26">CPU 特权级边界：Ring 0 (内核态) ↔ Ring 3 (用户态)</text><g transform="translate(230,250)"><circle cx="0" cy="0" fill="#ffebee" r="200" stroke="#c62828"></circle><circle cx="0" cy="0" fill="#ffcdd2" r="150" stroke="#c62828"></circle><circle cx="0" cy="0" fill="#ef9a9a" r="100" stroke="#b71c1c"></circle><circle cx="0" cy="0" fill="#e53935" r="50" stroke="#b71c1c"></circle><text font-weight="bold" text-anchor="middle" x="0" y="-180">Ring 3</text><text class="small" text-anchor="middle" x="0" y="-160">用户态</text><text font-weight="bold" text-anchor="middle" x="0" y="-130">Ring 2</text><text font-weight="bold" text-anchor="middle" x="0" y="-80">Ring 1</text><text fill="#fff" font-weight="bold" text-anchor="middle" x="0" y="-30">Ring 0</text><text class="small" fill="#fff" text-anchor="middle" x="0" y="-12">内核态</text><text class="small" fill="#fff" text-anchor="middle" x="0" y="6">最高权限</text><text class="small" text-anchor="middle" x="0" y="40">权限：内 高 → 外 低</text><text class="small" text-anchor="middle" x="0" y="60">Linux/Windows 仅使用</text><text class="small" text-anchor="middle" x="0" y="78">Ring 0 与 Ring 3</text></g><g transform="translate(480,60)"><rect fill="#e3f2fd" height="200" rx="6" stroke="#1565c0" width="380" x="0" y="0"></rect><text font-weight="bold" text-anchor="middle" x="190" y="22">用户态 (Ring 3) — 受限</text><text class="ok" x="10" y="46">✓ 执行普通指令 (ALU, MOV, JMP)</text><text class="ok" x="10" y="66">✓ 访问自己的用户空间 (代码/数据/堆栈)</text><text class="ok" x="10" y="86">✓ 调用库函数 (printf, malloc)</text><text class="no" x="10" y="106">✗ 执行特权指令 (HLT, CLI, LGDT)</text><text class="no" x="10" y="126">✗ 直接访问 I/O 端口、设备寄存器</text><text class="no" x="10" y="146">✗ 修改页表、IDT、控制寄存器 (CR0..3)</text><text class="no" x="10" y="166">✗ 访问内核空间内存</text><text class="small" x="10" y="186">→ 需要服务时必须通过 “系统调用” 陷入内核</text></g><g transform="translate(480,265)"><rect fill="#fff3e0" height="200" rx="6" stroke="#ef6c00" width="380" x="0" y="0"></rect><text font-weight="bold" text-anchor="middle" x="190" y="22">内核态 (Ring 0) — 全权限</text><text class="ok" x="10" y="46">✓ 执行所有指令，含特权指令</text><text class="ok" x="10" y="66">✓ 直接读写任意物理/虚拟内存</text><text class="ok" x="10" y="86">✓ 操作硬件、中断、I/O、DMA</text><text class="ok" x="10" y="106">✓ 修改页表、调度进程、管理资源</text><text class="small" fill="#c62828" x="10" y="146">⚠ 错误后果严重 → 整机崩溃 / 安全风险</text><text class="small" x="10" y="166">→ 内核代码、设备驱动、中断处理在此</text><text class="small" x="10" y="186">→ 完成服务后通过 iret/sysret 返回用户态</text></g><g transform="translate(0,470)"><rect fill="#f5f5f5" height="40" rx="4" stroke="#bbb" width="840" x="20" y="0"></rect><text font-weight="bold" x="40" y="24">穿越边界：</text><text class="small" x="140" y="24">系统调用 (int 0x80 / syscall / svc) · 硬件中断 · 异常 / 陷阱</text><text class="small" fill="#c62828" x="560" y="24">用户态 → 内核态：自动切换栈、保存上下文、跳转 ISR</text></g><path d="M260 70q120-10 220 30" fill="none" marker-end="url(#arr7)" stroke="#1565c0" stroke-width="1.5"></path><text class="small" fill="#1565c0" x="380" y="58">用户进程在 Ring 3 运行</text><path d="M480 380q-1e2 40-220 0" fill="none" marker-end="url(#arr7)" stroke="#ef6c00" stroke-width="1.5"></path><text class="small" fill="#ef6c00" x="320" y="438">系统调用陷入 Ring 0</text></svg>