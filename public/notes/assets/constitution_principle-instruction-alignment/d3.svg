<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200"><g transform="translate(10, 10)"><text fill="#333" font-family="monospace" font-size="14" x="0" y="2">32位整数: 0x12345678</text><g transform="translate(0, 25)"><text fill="#666" font-family="monospace" font-size="12" x="0" y="12">字节分解:</text><rect fill="#e3f2fd" height="25" stroke="#1976d2" width="40" x="80" y="0"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="100" y="17">0x12</text><rect fill="#f3e5f5" height="25" stroke="#7b1fa2" width="40" x="120" y="0"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="140" y="17">0x34</text><rect fill="#fff3e0" height="25" stroke="#f57c00" width="40" x="160" y="0"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="180" y="17">0x56</text><rect fill="#f1f8e9" height="25" stroke="#689f38" width="40" x="200" y="0"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="220" y="17">0x78</text><text fill="#1976d2" font-size="10" text-anchor="middle" x="100" y="-5">高位字节</text><text fill="#689f38" font-size="10" text-anchor="middle" x="220" y="-5">低位字节</text></g><g transform="translate(0, 80)"><text fill="#666" font-family="monospace" font-size="12" x="0" y="0">内存存储:</text><g transform="translate(80, 0)"><text fill="#999" font-family="monospace" font-size="10" text-anchor="end" x="-10" y="17">0x1000:</text><text fill="#999" font-family="monospace" font-size="10" text-anchor="end" x="-10" y="42">0x1001:</text><text fill="#999" font-family="monospace" font-size="10" text-anchor="end" x="-10" y="67">0x1002:</text><text fill="#999" font-family="monospace" font-size="10" text-anchor="end" x="-10" y="92">0x1003:</text><rect fill="#e3f2fd" height="20" stroke="#1976d2" width="40" x="0" y="5"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="20" y="18">0x12</text><rect fill="#f3e5f5" height="20" stroke="#7b1fa2" width="40" x="0" y="30"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="20" y="43">0x34</text><rect fill="#fff3e0" height="20" stroke="#f57c00" width="40" x="0" y="55"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="20" y="68">0x56</text><rect fill="#f1f8e9" height="20" stroke="#689f38" width="40" x="0" y="80"></rect><text font-family="monospace" font-size="11" text-anchor="middle" x="20" y="93">0x78</text><text fill="#999" font-size="10" x="55" y="18">← 低地址</text><text fill="#999" font-size="10" x="55" y="93">← 高地址</text></g></g><g fill="none" stroke="#999" stroke-dasharray="2,2" stroke-width="1"><path d="M1e2 50V85"></path><path d="M140 50l-30 60"></path><path d="M180 50l-70 85"></path><path d="M220 50 110 160"></path></g><g transform="translate(250, 90)"><rect fill="#fffde7" height="60" rx="5" stroke="#f9a825" width="180" x="0" y="0"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="90" y="20">大端序特征</text><text fill="#666" font-size="10" x="10" y="35">• 高位字节 → 低地址</text><text fill="#666" font-size="10" x="10" y="50">• 低位字节 → 高地址</text></g></g></svg>