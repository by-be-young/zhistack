<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 900 460"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#555"></path></marker><marker id="arrowBlock" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker><marker id="arrowPass" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#27ae60"></path></marker></defs><g><rect fill="#f5faff" height="420" rx="14" stroke="#2f6fb2" stroke-width="1.5" width="420" x="20" y="20"></rect><text fill="#1e4b7a" font-size="20" font-weight="700" text-anchor="middle" x="230" y="52">可屏蔽中断 (Maskable)</text><text fill="#5c7891" font-size="13" text-anchor="middle" x="230" y="74">通过 INTR 引脚 · 可被屏蔽字关闭</text><rect fill="#fff" height="36" rx="6" stroke="#7aa4cf" width="120" x="45" y="100"></rect><text fill="#333" font-size="13" text-anchor="middle" x="105" y="123">键盘 / 鼠标</text><rect fill="#fff" height="36" rx="6" stroke="#7aa4cf" width="120" x="45" y="145"></rect><text fill="#333" font-size="13" text-anchor="middle" x="105" y="168">定时器</text><rect fill="#fff" height="36" rx="6" stroke="#7aa4cf" width="120" x="45" y="190"></rect><text fill="#333" font-size="13" text-anchor="middle" x="105" y="213">串口 / USB</text><text fill="#5c7891" font-size="11" text-anchor="middle" x="105" y="248">（常规外设事件）</text><rect fill="#fff4d6" height="90" rx="8" stroke="#d19a1e" width="90" x="205" y="120"></rect><text fill="#7a5a10" font-size="13" font-weight="600" text-anchor="middle" x="250" y="150">屏蔽字</text><text fill="#7a5a10" font-size="12" text-anchor="middle" x="250" y="170">IMR / IF</text><text fill="#7a5a10" font-size="11" text-anchor="middle" x="250" y="192">可打开/关闭</text><line marker-end="url(#arrow)" stroke="#555" stroke-width="1.4" x1="165" x2="205" y1="118" y2="140"></line><line marker-end="url(#arrow)" stroke="#555" stroke-width="1.4" x1="165" x2="205" y1="163" y2="165"></line><line marker-end="url(#arrow)" stroke="#555" stroke-width="1.4" x1="165" x2="205" y1="208" y2="190"></line><rect fill="#e6f2ff" height="50" rx="6" stroke="#2f6fb2" width="80" x="335" y="140"></rect><text fill="#1e4b7a" font-size="13" font-weight="700" text-anchor="middle" x="375" y="163">INTR</text><text fill="#1e4b7a" font-size="11" text-anchor="middle" x="375" y="180">CPU 引脚</text><line marker-end="url(#arrowPass)" stroke="#27ae60" stroke-width="1.8" x1="295" x2="335" y1="150" y2="150"></line><text fill="#27ae60" font-size="11" text-anchor="middle" x="325" y="135">IF=1 允许</text><line stroke="#c0392b" stroke-dasharray="5,3" stroke-width="1.8" x1="295" x2="330" y1="180" y2="180"></line><line stroke="#c0392b" stroke-width="2" x1="322" x2="336" y1="172" y2="188"></line><line stroke="#c0392b" stroke-width="2" x1="336" x2="322" y1="172" y2="188"></line><text fill="#c0392b" font-size="11" text-anchor="middle" x="325" y="205">IF=0 屏蔽</text><g transform="translate(40,270)"><text fill="#1e4b7a" font-size="13" font-weight="700" x="0" y="0">特点</text><text fill="#333" font-size="12" x="0" y="24">• 优先级较低，用于<tspan font-weight="600">非紧急</tspan>事件</text><text fill="#333" font-size="12" x="0" y="46">• CPU 可通过<tspan font-weight="600">CLI / STI</tspan>关/开中断</text><text fill="#333" font-size="12" x="0" y="68">• 屏蔽字（IMR）可<tspan font-weight="600">动态调整</tspan>优先级</text><text fill="#333" font-size="12" x="0" y="90">• 一般由<tspan font-weight="600">中断控制器 8259A</tspan>管理</text><text fill="#333" font-size="12" x="0" y="112">• 举例：串口、USB、时钟中断</text><text fill="#7a5a10" font-size="12" x="0" y="140">→ 可延迟响应，允许系统调度</text></g></g><g><rect fill="#fff5f5" height="420" rx="14" stroke="#b23a3a" stroke-width="1.5" width="420" x="460" y="20"></rect><text fill="#7a1e1e" font-size="20" font-weight="700" text-anchor="middle" x="670" y="52">不可屏蔽中断 (NMI)</text><text fill="#8a5c5c" font-size="13" text-anchor="middle" x="670" y="74">通过 NMI 引脚 · 无法被屏蔽字关闭</text><rect fill="#fff" height="36" rx="6" stroke="#cf7a7a" width="140" x="485" y="100"></rect><text fill="#333" font-size="13" text-anchor="middle" x="555" y="123">电源失效</text><rect fill="#fff" height="36" rx="6" stroke="#cf7a7a" width="140" x="485" y="145"></rect><text fill="#333" font-size="13" text-anchor="middle" x="555" y="168">内存校验错误</text><rect fill="#fff" height="36" rx="6" stroke="#cf7a7a" width="140" x="485" y="190"></rect><text fill="#333" font-size="13" text-anchor="middle" x="555" y="213">硬件严重故障</text><text fill="#8a5c5c" font-size="11" text-anchor="middle" x="555" y="248">（关键 / 紧急事件）</text><rect fill="#f0f0f0" height="90" rx="8" stroke="#888" stroke-dasharray="4,3" width="90" x="650" y="120"></rect><text fill="#888" font-size="12" text-anchor="middle" x="695" y="155">无屏蔽</text><text fill="#888" font-size="12" text-anchor="middle" x="695" y="175">开关</text><text fill="#888" font-size="11" text-anchor="middle" x="695" y="197">直连</text><rect fill="#ffe6e6" height="50" rx="6" stroke="#b23a3a" width="80" x="775" y="140"></rect><text fill="#7a1e1e" font-size="13" font-weight="700" text-anchor="middle" x="815" y="163">NMI</text><text fill="#7a1e1e" font-size="11" text-anchor="middle" x="815" y="180">CPU 引脚</text><line marker-end="url(#arrowBlock)" stroke="#c0392b" stroke-width="2" x1="625" x2="775" y1="118" y2="150"></line><line marker-end="url(#arrowBlock)" stroke="#c0392b" stroke-width="2" x1="625" x2="775" y1="163" y2="165"></line><line marker-end="url(#arrowBlock)" stroke="#c0392b" stroke-width="2" x1="625" x2="775" y1="208" y2="180"></line><text fill="#c0392b" font-size="11" font-weight="600" text-anchor="middle" x="700" y="240">CPU 必须立即响应</text><g transform="translate(480,270)"><text fill="#7a1e1e" font-size="13" font-weight="700" x="0" y="0">特点</text><text fill="#333" font-size="12" x="0" y="24">•<tspan font-weight="600">最高优先级</tspan>，用于紧急/致命事件</text><text fill="#333" font-size="12" x="0" y="46">• 不受 IF 标志和屏蔽字控制</text><text fill="#333" font-size="12" x="0" y="68">• 可<tspan font-weight="600">打断其他中断服务程序</tspan></text><text fill="#333" font-size="12" x="0" y="90">• 强制打断当前任务，无法延迟</text><text fill="#333" font-size="12" x="0" y="112">• 举例：断电、奇偶校验错、看门狗超时</text><text fill="#7a1e1e" font-size="12" x="0" y="140">→ 保障系统可靠性与安全性</text></g></g></svg>