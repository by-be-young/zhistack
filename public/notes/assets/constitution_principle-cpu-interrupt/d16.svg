<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580"><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#333" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#1565c0" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">CPU自陷机制流程</text><text fill="#1976d2" font-size="16" font-weight="bold" x="50" y="50">用户态 (User Mode)</text><text fill="#f57c00" font-size="16" font-weight="bold" x="50" y="320">内核态 (Kernel Mode)</text><line stroke="#666" stroke-dasharray="5,5" stroke-width="2" x1="0" x2="800" y1="300" y2="300"></line><rect fill="#2196f3" height="60" opacity=".8" rx="5" width="140" x="100" y="80"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="170" y="105">用户程序执行</text><text fill="#fff" font-size="11" text-anchor="middle" x="170" y="125">正常指令流</text><g transform="translate(300, 60)"><rect fill="#ff9800" height="100" opacity=".9" rx="10" width="180" x="0" y="0"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="90" y="20">自陷触发条件</text><circle cx="30" cy="45" fill="#fff" r="3"></circle><text fill="#fff" font-size="10" x="40" y="49">异常 (除零、越界)</text><circle cx="30" cy="65" fill="#fff" r="3"></circle><text fill="#fff" font-size="10" x="40" y="69">系统调用 (syscall)</text><circle cx="30" cy="85" fill="#fff" r="3"></circle><text fill="#fff" font-size="10" x="40" y="89">调试断点</text></g><path d="M240 110q40 0 60 0" fill="none" marker-end="url(#arrowhead)" stroke="#d32f2f" stroke-width="3"></path><text fill="#d32f2f" font-size="10" font-weight="bold" x="270" y="100">触发</text><g transform="translate(550, 80)"><rect fill="#9c27b0" height="80" opacity=".8" rx="5" width="120" x="0" y="0"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="60" y="20">CPU检测</text><text fill="#fff" font-size="10" text-anchor="middle" x="60" y="40">保存状态:</text><text fill="#fff" font-size="9" text-anchor="middle" x="60" y="55">• PC (程序计数器)</text><text fill="#fff" font-size="9" text-anchor="middle" x="60" y="70">• 寄存器状态</text></g><path d="M480 110q40 0 70 0" fill="none" marker-end="url(#arrowhead)" stroke="#7b1fa2" stroke-width="3"></path><path d="M610 160q0 40 0 150" fill="none" marker-end="url(#arrowhead)" stroke="#4caf50" stroke-width="4"></path><text fill="#4caf50" font-size="11" font-weight="bold" x="625" y="200">切换到内核态</text><g transform="translate(480, 350)"><rect fill="#4caf50" height="80" opacity=".8" rx="10" width="200" x="0" y="0"></rect><text fill="#fff" font-size="13" font-weight="bold" text-anchor="middle" x="100" y="25">操作系统处理</text><text fill="#fff" font-size="10" text-anchor="middle" x="100" y="45">• 异常处理程序</text><text fill="#fff" font-size="10" text-anchor="middle" x="100" y="60">• 系统调用服务</text><text fill="#fff" font-size="10" text-anchor="middle" x="100" y="75">• 调试器介入</text></g><g transform="translate(100, 480)"><rect fill="#f44336" height="50" opacity=".8" rx="5" width="140" x="0" y="0"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="70" y="20">不可恢复</text><text fill="#fff" font-size="10" text-anchor="middle" x="70" y="35">终止程序</text></g><g transform="translate(300, 480)"><rect fill="#4caf50" height="50" opacity=".8" rx="5" width="140" x="0" y="0"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="70" y="20">可恢复</text><text fill="#fff" font-size="10" text-anchor="middle" x="70" y="35">恢复执行</text></g><path d="M530 430q-130 20-360 50" fill="none" marker-end="url(#arrowhead)" stroke="#666" stroke-width="2"></path><path d="M550 430q-1e2 20-180 50" fill="none" marker-end="url(#arrowhead)" stroke="#666" stroke-width="2"></path><path d="M370 480q0-230 0-290" fill="none" marker-end="url(#arrowhead)" stroke="#2196f3" stroke-dasharray="8,4" stroke-width="3"></path><text fill="#2196f3" font-size="10" font-weight="bold" x="385" y="290">恢复用户态</text><text fill="#2196f3" font-size="9" x="385" y="315">继续执行</text><g transform="translate(50, 200)"><rect fill="#fff" height="80" rx="8" stroke="#ddd" stroke-width="1" width="200" x="0" y="0"></rect><text fill="#333" font-size="12" font-weight="bold" text-anchor="middle" x="100" y="20">陷阱指令</text><text fill="#666" font-size="10" text-anchor="middle" x="100" y="40">程序主动发起的指令</text><text fill="#666" font-size="10" text-anchor="middle" x="100" y="55">如: x86的syscall指令</text><text fill="#666" font-size="10" text-anchor="middle" x="100" y="70">用于系统调用和调试</text></g><circle cx="170" cy="70" fill="#fff" r="12" stroke="#2196f3" stroke-width="2"></circle><text fill="#2196f3" font-size="11" font-weight="bold" text-anchor="middle" x="170" y="76">1</text><circle cx="390" cy="45" fill="#fff" r="12" stroke="#ff9800" stroke-width="2"></circle><text fill="#ff9800" font-size="11" font-weight="bold" text-anchor="middle" x="390" y="51">2</text><circle cx="610" cy="70" fill="#fff" r="12" stroke="#9c27b0" stroke-width="2"></circle><text fill="#9c27b0" font-size="11" font-weight="bold" text-anchor="middle" x="610" y="76">3</text><circle cx="720" cy="390" fill="#fff" r="12" stroke="#4caf50" stroke-width="2"></circle><text fill="#4caf50" font-size="11" font-weight="bold" text-anchor="middle" x="720" y="396">4</text><circle cx="170" cy="460" fill="#fff" r="12" stroke="#f44336" stroke-width="2"></circle><text fill="#f44336" font-size="11" font-weight="bold" text-anchor="middle" x="170" y="466">5a</text><circle cx="370" cy="460" fill="#fff" r="12" stroke="#4caf50" stroke-width="2"></circle><text fill="#4caf50" font-size="11" font-weight="bold" text-anchor="middle" x="370" y="466">5b</text></svg>