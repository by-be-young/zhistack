<svg xmlns="http://www.w3.org/2000/svg" font-family="'PingFang SC', 'Helvetica Neue', Arial, sans-serif" height="480" viewBox="0 0 760 480" width="760"><rect fill="none" height="480" rx="8" width="760"></rect><defs><lineargradient id="priorityGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e74c3c"></stop><stop offset="50%" stop-color="#f39c12"></stop><stop offset="100%" stop-color="#3498db"></stop></lineargradient></defs><text fill="#555" font-size="13" font-weight="bold" x="50" y="36">优先级</text><text fill="#888" font-size="11" x="50" y="52">（高 → 低）</text><rect fill="url(#priorityGrad)" height="310" opacity=".85" rx="4" width="18" x="58" y="65"></rect><polygon fill="#e74c3c" points="67,58 61,70 73,70"></polygon><polygon fill="#3498db" points="67,382 61,370 73,370"></polygon><text fill="#e74c3c" font-size="12" font-weight="bold" x="84" y="82">高优先级</text><text fill="#f39c12" font-size="12" font-weight="bold" x="84" y="226">中优先级</text><text fill="#3498db" font-size="12" font-weight="bold" x="84" y="378">低优先级</text><line stroke="#e0e0e0" stroke-dasharray="4,3" stroke-width="1" x1="160" x2="160" y1="30" y2="450"></line><text fill="#555" font-size="13" font-weight="bold" text-anchor="middle" x="310" y="36">中断源</text><rect fill="#fde8e8" height="52" rx="8" stroke="#e74c3c" stroke-width="1.8" width="220" x="200" y="55"></rect><text fill="#c0392b" font-size="13" font-weight="bold" x="260" y="76">中断 A</text><text fill="#e74c3c" font-size="11" x="260" y="95">NMI · 硬件故障</text><rect fill="#e74c3c" height="18" rx="9" width="40" x="370" y="62"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="390" y="75">P = 1</text><rect fill="#fef3e2" height="52" rx="8" stroke="#f39c12" stroke-width="1.8" width="220" x="200" y="125"></rect><text fill="#b7770d" font-size="13" font-weight="bold" x="260" y="146">中断 B</text><text fill="#f39c12" font-size="11" x="260" y="165">时钟定时器</text><rect fill="#f39c12" height="18" rx="9" width="40" x="370" y="132"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="390" y="145">P = 2</text><rect fill="#eaf6ff" height="52" rx="8" stroke="#2980b9" stroke-width="1.8" width="220" x="200" y="195"></rect><text fill="#1a5276" font-size="13" font-weight="bold" x="260" y="216">中断 C</text><text fill="#2980b9" font-size="11" x="260" y="235">磁盘 I/O</text><rect fill="#2980b9" height="18" rx="9" width="40" x="370" y="202"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="390" y="215">P = 3</text><rect fill="#eafaf1" height="52" rx="8" stroke="#27ae60" stroke-width="1.8" width="220" x="200" y="265"></rect><text fill="#1d6a39" font-size="13" font-weight="bold" x="260" y="286">中断 D</text><text fill="#27ae60" font-size="11" x="260" y="305">键盘 / 鼠标</text><rect fill="#27ae60" height="18" rx="9" width="40" x="370" y="272"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="390" y="285">P = 4</text><line stroke="#e0e0e0" stroke-dasharray="4,3" stroke-width="1" x1="455" x2="455" y1="30" y2="450"></line><text fill="#555" font-size="13" font-weight="bold" text-anchor="middle" x="600" y="36">中断嵌套示例</text><text fill="#888" font-size="11" x="480" y="56">时间轴 →</text><line stroke="#bbb" stroke-width="1.5" x1="480" x2="740" y1="430" y2="430"></line><polygon fill="#bbb" points="740,430 732,426 732,434"></polygon><text fill="#999" font-size="10" x="742" y="434">t</text><rect fill="#dfe6e9" height="22" rx="4" stroke="#b2bec3" stroke-width="1" width="240" x="488" y="390"></rect><text fill="#636e72" font-size="11" text-anchor="middle" x="610" y="405">主程序</text><rect fill="#eafaf1" height="22" rx="4" stroke="#27ae60" stroke-width="1.5" width="170" x="548" y="360"></rect><text fill="#1d6a39" font-size="11" text-anchor="middle" x="633" y="375">D 的中断服务程序</text><rect fill="#eaf6ff" height="22" rx="4" stroke="#2980b9" stroke-width="1.5" width="110" x="578" y="330"></rect><text fill="#1a5276" font-size="11" text-anchor="middle" x="633" y="345">C 的中断服务程序</text><rect fill="#fef3e2" height="22" rx="4" stroke="#f39c12" stroke-width="1.5" width="60" x="603" y="300"></rect><text fill="#b7770d" font-size="11" text-anchor="middle" x="633" y="315">B 的 ISR</text><line marker-end="url(#arrowGreen)" stroke="#27ae60" stroke-width="1.5" x1="548" x2="548" y1="390" y2="382"></line><line marker-end="url(#arrowBlue)" stroke="#2980b9" stroke-width="1.5" x1="578" x2="578" y1="360" y2="352"></line><line marker-end="url(#arrowOrange)" stroke="#f39c12" stroke-width="1.5" x1="603" x2="603" y1="330" y2="322"></line><line stroke="#f39c12" stroke-dasharray="3,2" stroke-width="1.2" x1="663" x2="663" y1="300" y2="330"></line><polygon fill="#f39c12" points="663,330 660,323 666,323"></polygon><line stroke="#2980b9" stroke-dasharray="3,2" stroke-width="1.2" x1="688" x2="688" y1="330" y2="360"></line><polygon fill="#2980b9" points="688,360 685,353 691,353"></polygon><line stroke="#27ae60" stroke-dasharray="3,2" stroke-width="1.2" x1="718" x2="718" y1="360" y2="390"></line><polygon fill="#27ae60" points="718,390 715,383 721,383"></polygon><defs><marker id="arrowGreen" markerHeight="6" markerWidth="6" orient="auto" refX="3" refY="3"><path d="M0 0 6 3 0 6z" fill="#27ae60"></path></marker><marker id="arrowBlue" markerHeight="6" markerWidth="6" orient="auto" refX="3" refY="3"><path d="M0 0 6 3 0 6z" fill="#2980b9"></path></marker><marker id="arrowOrange" markerHeight="6" markerWidth="6" orient="auto" refX="3" refY="3"><path d="M0 0 6 3 0 6z" fill="#f39c12"></path></marker></defs><text fill="#555" font-size="11" font-weight="bold" x="480" y="250">说明：</text><line stroke="#555" stroke-width="1.5" x1="480" x2="510" y1="265" y2="265"></line><polygon fill="#555" points="510,265 505,262 505,268"></polygon><text fill="#555" font-size="10" x="515" y="269">高优先级中断打断低优先级 ISR</text><line stroke="#888" stroke-dasharray="3,2" stroke-width="1.2" x1="480" x2="510" y1="282" y2="282"></line><polygon fill="#888" points="510,282 505,279 505,285"></polygon><text fill="#555" font-size="10" x="515" y="286">ISR 执行完后返回被中断处</text><rect fill="#f8f9fa" height="165" rx="8" stroke="#dee2e6" stroke-width="1.2" width="270" x="468" y="68"></rect><text fill="#2c3e50" font-size="12" font-weight="bold" text-anchor="middle" x="603" y="90">优先级规则</text><line stroke="#dee2e6" stroke-width="1" x1="478" x2="728" y1="97" y2="97"></line><text fill="#444" font-size="11" x="482" y="116">① 同时请求：优先响应高优先级</text><text fill="#444" font-size="11" x="482" y="138">② 执行 ISR 时（IF = 0 时）：高优先级可抢占</text><text fill="#444" font-size="11" x="482" y="160">低优先级不可抢占</text><text fill="#444" font-size="11" x="482" y="182">③ 屏蔽字：决定哪些中断可响应</text><text fill="#444" font-size="11" x="482" y="204">④ NMI：不受屏蔽字控制，</text><text fill="#444" font-size="11" x="482" y="222">始终具有最高优先级</text><text fill="#aaa" font-size="10" text-anchor="middle" x="380" y="465">P 值越小 → 优先级越高；嵌套层数取决于系统设计</text></svg>