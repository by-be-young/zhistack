<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Arial, sans-serif" viewBox="0 0 900 480"><rect fill="#f8f9fa" height="480" rx="12" width="900"></rect><rect fill="#2c3e50" height="50" rx="8" width="860" x="20" y="15"></rect><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="47">突发（Burst）总线传输事务</text><rect fill="#ffeaa7" height="175" rx="8" stroke="#fdcb6e" stroke-width="2" width="860" x="20" y="80"></rect><text fill="#d35400" font-size="14" font-weight="bold" x="40" y="106">❌ 普通传输方式（非突发）</text><text fill="#d35400" font-size="12" x="600" y="106">每次传输都需要重新发送地址，浪费总线带宽</text><text fill="#555" font-size="12" x="40" y="135">时钟周期:</text><rect fill="#e17055" height="30" rx="3" stroke="#c0392b" stroke-width="1.5" width="70" x="110" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="145" y="138">ADDR1</text><rect fill="#74b9ff" height="30" rx="3" stroke="#0984e3" stroke-width="1.5" width="70" x="180" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="215" y="138">DATA1</text><rect fill="#e17055" height="30" rx="3" stroke="#c0392b" stroke-width="1.5" width="70" x="270" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="305" y="138">ADDR2</text><rect fill="#74b9ff" height="30" rx="3" stroke="#0984e3" stroke-width="1.5" width="70" x="340" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="375" y="138">DATA2</text><rect fill="#e17055" height="30" rx="3" stroke="#c0392b" stroke-width="1.5" width="70" x="430" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="465" y="138">ADDR3</text><rect fill="#74b9ff" height="30" rx="3" stroke="#0984e3" stroke-width="1.5" width="70" x="500" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="535" y="138">DATA3</text><rect fill="#e17055" height="30" rx="3" stroke="#c0392b" stroke-width="1.5" width="70" x="590" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="625" y="138">ADDR4</text><rect fill="#74b9ff" height="30" rx="3" stroke="#0984e3" stroke-width="1.5" width="70" x="660" y="118"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="695" y="138">DATA4</text><text fill="#666" font-size="10" text-anchor="middle" x="145" y="162">T1</text><text fill="#666" font-size="10" text-anchor="middle" x="215" y="162">T2</text><text fill="#666" font-size="10" text-anchor="middle" x="305" y="162">T3</text><text fill="#666" font-size="10" text-anchor="middle" x="375" y="162">T4</text><text fill="#666" font-size="10" text-anchor="middle" x="465" y="162">T5</text><text fill="#666" font-size="10" text-anchor="middle" x="535" y="162">T6</text><text fill="#666" font-size="10" text-anchor="middle" x="625" y="162">T7</text><text fill="#666" font-size="10" text-anchor="middle" x="695" y="162">T8</text><line stroke="#c0392b" stroke-width="1.5" x1="110" x2="249" y1="172" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="110" x2="110" y1="168" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="249" x2="249" y1="168" y2="172"></line><text fill="#c0392b" font-size="10" text-anchor="middle" x="180" y="184">事务 ①</text><line stroke="#c0392b" stroke-width="1.5" x1="270" x2="409" y1="172" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="270" x2="270" y1="168" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="409" x2="409" y1="168" y2="172"></line><text fill="#c0392b" font-size="10" text-anchor="middle" x="340" y="184">事务 ②</text><line stroke="#c0392b" stroke-width="1.5" x1="430" x2="569" y1="172" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="430" x2="430" y1="168" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="569" x2="569" y1="168" y2="172"></line><text fill="#c0392b" font-size="10" text-anchor="middle" x="500" y="184">事务 ③</text><line stroke="#c0392b" stroke-width="1.5" x1="590" x2="729" y1="172" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="590" x2="590" y1="168" y2="172"></line><line stroke="#c0392b" stroke-width="1.5" x1="729" x2="729" y1="168" y2="172"></line><text fill="#c0392b" font-size="10" text-anchor="middle" x="660" y="184">事务 ④</text><rect fill="#fab1a0" height="48" rx="5" width="820" x="40" y="193"></rect><text fill="#922b21" font-size="13" font-weight="bold" text-anchor="middle" x="450" y="213">总耗时：8 个时钟周期</text><text fill="#922b21" font-size="11" text-anchor="middle" x="450" y="230">每传输 1 个数据 = 1 个地址周期 + 1 个数据周期，总线利用率仅 50%</text><rect fill="#d5f5e3" height="190" rx="8" stroke="#27ae60" stroke-width="2" width="860" x="20" y="270"></rect><text fill="#1a5276" font-size="14" font-weight="bold" x="40" y="296">✅ 突发传输方式（Burst）</text><text fill="#1a5276" font-size="12" x="600" y="296">仅发送一次起始地址，后续地址自动递增</text><text fill="#555" font-size="12" x="40" y="330">时钟周期:</text><rect fill="#e17055" height="30" rx="3" stroke="#c0392b" stroke-width="2" width="70" x="110" y="313"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="145" y="333">ADDR1</text><rect fill="#00b894" height="30" rx="3" stroke="#00695c" stroke-width="2" width="70" x="190" y="313"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="225" y="333">DATA1</text><rect fill="#00b894" height="30" rx="3" stroke="#00695c" stroke-width="2" width="70" x="270" y="313"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="305" y="333">DATA2</text><rect fill="#00b894" height="30" rx="3" stroke="#00695c" stroke-width="2" width="70" x="350" y="313"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="385" y="333">DATA3</text><rect fill="#00b894" height="30" rx="3" stroke="#00695c" stroke-width="2" width="70" x="430" y="313"></rect><text fill="#fff" font-size="12" font-weight="bold" text-anchor="middle" x="465" y="333">DATA4</text><rect fill="#dfe6e9" height="30" rx="3" stroke="#b2bec3" stroke-dasharray="9,3" stroke-width="1" width="70" x="520" y="313"></rect><text fill="#aaa" font-size="12" text-anchor="middle" x="555" y="333">空闲</text><text fill="#666" font-size="10" text-anchor="middle" x="145" y="357">T1</text><text fill="#666" font-size="10" text-anchor="middle" x="225" y="357">T2</text><text fill="#666" font-size="10" text-anchor="middle" x="305" y="357">T3</text><text fill="#666" font-size="10" text-anchor="middle" x="385" y="357">T4</text><text fill="#666" font-size="10" text-anchor="middle" x="465" y="357">T5</text><line marker-end="url(#arrowYellow)" stroke="#f39c12" stroke-width="1.5" x1="190" x2="263" y1="302" y2="302"></line><line marker-end="url(#arrowYellow)" stroke="#f39c12" stroke-width="1.5" x1="270" x2="343" y1="302" y2="302"></line><line marker-end="url(#arrowYellow)" stroke="#f39c12" stroke-width="1.5" x1="350" x2="423" y1="302" y2="302"></line><text fill="#d68910" font-size="10" text-anchor="middle" x="307" y="298">地址自动递增（无需占用总线）</text><line stroke="#27ae60" stroke-width="2" x1="110" x2="499" y1="362" y2="362"></line><line stroke="#27ae60" stroke-width="2" x1="110" x2="110" y1="357" y2="362"></line><line stroke="#27ae60" stroke-width="2" x1="499" x2="499" y1="357" y2="362"></line><text fill="#1e8449" font-size="12" font-weight="bold" text-anchor="middle" x="305" y="376">一次完整的突发总线事务</text><rect fill="#a9dfbf" height="60" rx="5" width="820" x="40" y="385"></rect><text fill="#1a5276" font-size="13" font-weight="bold" text-anchor="middle" x="450" y="406">总耗时：5 个时钟周期（1 次地址 + 4 次连续数据）</text><text fill="#196f3d" font-size="11" text-anchor="middle" x="450" y="423">总线利用率：4/5 = 80%，相比普通方式节省 3 个地址周期</text><text fill="#196f3d" font-size="11" text-anchor="middle" x="450" y="438">突发长度越大，总线利用率越高，传输效率越好</text><defs><marker id="arrowYellow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#f39c12"></path></marker></defs></svg>