<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" viewBox="0 0 900 600"><rect fill="#f8f9fa" height="600" rx="12" width="900"></rect><text fill="#1a1a2e" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="36">总线通信指标图解</text><rect fill="#e8f4fd" height="120" rx="8" stroke="#3498db" stroke-width="1.5" width="840" x="30" y="55"></rect><text fill="#2980b9" font-size="13" font-weight="bold" x="46" y="76">① 时钟频率（Clock Frequency）</text><text fill="#555" font-size="11" x="46" y="96">时钟信号（100MHz → 周期 T = 10ns）</text><g fill="none" stroke="#e74c3c" stroke-width="2"><polyline points="60,150 60,110 100,110 100,150 140,150 140,110 180,110 180,150 220,150 220,110 260,110 260,150 300,150 300,110 340,110 340,150 380,150 380,110 420,110 420,150"></polyline></g><line stroke="#3498db" stroke-width="1.5" x1="60" x2="140" y1="160" y2="160"></line><line stroke="#3498db" stroke-width="1.5" x1="60" x2="60" y1="156" y2="164"></line><line stroke="#3498db" stroke-width="1.5" x1="140" x2="140" y1="156" y2="164"></line><text fill="#2980b9" font-size="11" text-anchor="middle" x="100" y="172">T = 10 ns</text><text fill="#555" font-size="12" x="460" y="120">每个脉冲上升 / 下降 = 1 个时钟周期</text><text fill="#555" font-size="12" x="460" y="140">时钟频率 = 1 / T　（单位：Hz）</text><rect fill="#fef9e7" height="150" rx="8" stroke="#f39c12" stroke-width="1.5" width="840" x="30" y="190"></rect><text fill="#d68910" font-size="13" font-weight="bold" x="46" y="212">② 总线传输周期（Bus Transfer Cycle）</text><text fill="#555" font-size="11" x="46" y="230">一次完整数据传输 = 多个时钟周期（示例：N = 4）</text><g fill="none" stroke="#888" stroke-width="1.5"><polyline points="60,275 60,250 95,250 95,275 130,275 130,250 165,250 165,275 200,275 200,250 235,250 235,275 270,275 270,250 305,250 305,275 340,275"></polyline></g><g stroke="#bbb" stroke-dasharray="3,3" stroke-width="1"><line x1="130" x2="130" y1="245" y2="306"></line><line x1="200" x2="200" y1="245" y2="306"></line><line x1="270" x2="270" y1="245" y2="306"></line></g><g font-size="11" text-anchor="middle"><rect fill="#a9cce3" height="26" rx="4" stroke="#2980b9" stroke-width="1" width="70" x="60" y="280"></rect><text fill="#154360" x="95" y="297">申请</text><rect fill="#a9dfbf" height="26" rx="4" stroke="#1e8449" stroke-width="1" width="70" x="130" y="280"></rect><text fill="#145a32" x="165" y="297">寻址</text><rect fill="#f9e79f" height="26" rx="4" stroke="#d4ac0d" stroke-width="1" width="70" x="200" y="280"></rect><text fill="#7d6608" x="235" y="297">传输数据</text><rect fill="#f5cba7" height="26" rx="4" stroke="#ca6f1e" stroke-width="1" width="70" x="270" y="280"></rect><text fill="#784212" x="305" y="297">结束</text></g><g fill="#999" font-size="10" text-anchor="middle"><text x="95" y="317">T</text><text x="165" y="317">T</text><text x="235" y="317">T</text><text x="305" y="317">T</text></g><line stroke="#f39c12" stroke-width="1.5" x1="60" x2="340" y1="326" y2="326"></line><line stroke="#f39c12" stroke-width="1.5" x1="60" x2="60" y1="321" y2="331"></line><line stroke="#f39c12" stroke-width="1.5" x1="340" x2="340" y1="321" y2="331"></line><text fill="#d68910" font-size="11" text-anchor="middle" x="200" y="336">总线传输周期 = N × T（N = 4）</text><text fill="#555" font-size="12" x="460" y="238">包含四个阶段：</text><text fill="#555" font-size="11" x="460" y="256">🔹 申请 — 设备请求总线使用权</text><text fill="#555" font-size="11" x="460" y="274">🔹 寻址 — 指定目标地址</text><text fill="#555" font-size="11" x="460" y="292">🔹 传输 — 实际数据传送</text><text fill="#555" font-size="11" x="460" y="310">🔹 结束 — 释放总线</text><rect fill="#f4ecf7" height="230" rx="8" stroke="#8e44ad" stroke-width="1.5" width="840" x="30" y="355"></rect><text fill="#7d3c98" font-size="13" font-weight="bold" x="46" y="376">③ 总线工作频率（Bus Operating Frequency）</text><text fill="#555" font-size="12" font-weight="bold" x="46" y="395">SDR（单倍数据率）</text><g fill="none" stroke="#3498db" stroke-width="2"><polyline points="80,422 80,405 130,405 130,422 180,422 180,405 230,405 230,422 280,422"></polyline></g><circle cx="80" cy="405" fill="#e74c3c" r="4"></circle><circle cx="130" cy="405" fill="#e74c3c" r="4"></circle><circle cx="180" cy="405" fill="#e74c3c" r="4"></circle><circle cx="230" cy="405" fill="#e74c3c" r="4"></circle><text fill="#555" font-size="11" x="295" y="417">每周期 1 次传输 → 工作频率 = 时钟频率</text><text fill="#555" font-size="12" font-weight="bold" x="46" y="443">DDR（双倍数据率）</text><g fill="none" stroke="#27ae60" stroke-width="2"><polyline points="80,470 80,453 130,453 130,470 180,470 180,453 230,453 230,470 280,470"></polyline></g><circle cx="80" cy="453" fill="#e74c3c" r="4"></circle><circle cx="130" cy="470" fill="#e67e22" r="4"></circle><circle cx="130" cy="453" fill="#e74c3c" r="4"></circle><circle cx="180" cy="470" fill="#e67e22" r="4"></circle><circle cx="180" cy="453" fill="#e74c3c" r="4"></circle><circle cx="230" cy="470" fill="#e67e22" r="4"></circle><circle cx="230" cy="453" fill="#e74c3c" r="4"></circle><text fill="#555" font-size="11" x="295" y="458">上升沿 + 下降沿各 1 次</text><text fill="#555" font-size="11" x="295" y="474">→ 工作频率 = 2 × 时钟频率</text><text fill="#555" font-size="12" font-weight="bold" x="46" y="493">QDR（四倍数据率）</text><g fill="none" stroke="#8e44ad" stroke-width="2"><polyline points="80,520 80,503 130,503 130,520 180,520 180,503 230,503 230,520 280,520"></polyline></g><circle cx="80" cy="503" fill="#e74c3c" r="4"></circle><circle cx="105" cy="520" fill="#e67e22" r="4"></circle><circle cx="130" cy="503" fill="#e74c3c" r="4"></circle><circle cx="155" cy="520" fill="#e67e22" r="4"></circle><circle cx="180" cy="503" fill="#e74c3c" r="4"></circle><circle cx="205" cy="520" fill="#e67e22" r="4"></circle><circle cx="230" cy="503" fill="#e74c3c" r="4"></circle><circle cx="255" cy="520" fill="#e67e22" r="4"></circle><text fill="#555" font-size="11" x="295" y="508">每周期传 4 次</text><text fill="#555" font-size="11" x="295" y="524">→ 工作频率 = 4 × 时钟频率</text><circle cx="600" cy="412" fill="#e74c3c" r="5"></circle><text fill="#555" font-size="11" x="612" y="416">上升沿采样</text><circle cx="700" cy="412" fill="#e67e22" r="5"></circle><text fill="#555" font-size="11" x="712" y="416">下降沿采样</text><rect fill="#d2b4de" height="34" rx="6" stroke="#7d3c98" stroke-width="1" width="808" x="46" y="538"></rect><text fill="#4a235a" font-size="13" text-anchor="middle" x="450" y="560">通用公式：工作频率 = 时钟频率 / N　（N = 总线传输周期所含时钟周期数）</text></svg>