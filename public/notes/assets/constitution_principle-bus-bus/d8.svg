<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, Arial, sans-serif" viewBox="0 0 900 470"><rect fill="#f8f9fa" height="470" rx="12" width="900"></rect><rect fill="#2c3e50" height="50" rx="8" width="860" x="20" y="15"></rect><text fill="#fff" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="47">总线事务（Bus Transaction）</text><rect fill="#74b9ff" height="80" rx="8" stroke="#0984e3" stroke-width="2" width="180" x="60" y="90"></rect><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="150" y="122">主设备 Master</text><text fill="#fff" font-size="11" text-anchor="middle" x="150" y="145">发起事务 · 发出地址/数据</text><text fill="#fff" font-size="11" text-anchor="middle" x="150" y="161">控制读写信号</text><rect fill="#00b894" height="80" rx="8" stroke="#00695c" stroke-width="2" width="180" x="660" y="90"></rect><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="750" y="122">从设备 Slave</text><text fill="#fff" font-size="11" text-anchor="middle" x="750" y="145">识别地址 · 响应读写</text><text fill="#fff" font-size="11" text-anchor="middle" x="750" y="161">交换数据 · 发确认</text><rect fill="#e17055" height="22" rx="4" stroke="#c0392b" stroke-width="1.5" width="360" x="270" y="100"></rect><text fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" x="450" y="116">地址总线</text><rect fill="#fdcb6e" height="22" rx="4" stroke="#e1a800" stroke-width="1.5" width="360" x="270" y="129"></rect><text fill="#7d5a00" font-size="11" font-weight="bold" text-anchor="middle" x="450" y="145">数据总线</text><rect fill="none" height="0" width="360" x="270" y="158"></rect><line stroke="#636e72" stroke-width="2" x1="240" x2="270" y1="130" y2="130"></line><line stroke="#636e72" stroke-width="2" x1="630" x2="660" y1="130" y2="130"></line><rect fill="#fff" height="255" rx="8" stroke="#dfe6e9" stroke-width="2" width="860" x="20" y="195"></rect><text fill="#2c3e50" font-size="15" font-weight="bold" x="40" y="222">总线事务的五个阶段</text><rect fill="#dfe9ff" height="110" rx="8" stroke="#0984e3" stroke-width="1.5" width="150" x="40" y="245"></rect><circle cx="65" cy="270" fill="#0984e3" r="13"></circle><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="65" y="275">1</text><text fill="#0984e3" font-size="14" font-weight="bold" text-anchor="middle" x="115" y="285">请求</text><text fill="#555" font-size="10" text-anchor="middle" x="115" y="303">Request</text><text fill="#555" font-size="10" text-anchor="middle" x="115" y="325">主设备发出</text><text fill="#555" font-size="10" text-anchor="middle" x="115" y="339">总线传输请求</text><rect fill="#ffeaa7" height="110" rx="8" stroke="#e1a800" stroke-width="1.5" width="150" x="206" y="245"></rect><circle cx="231" cy="270" fill="#e1a800" r="13"></circle><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="231" y="275">2</text><text fill="#d68910" font-size="14" font-weight="bold" text-anchor="middle" x="281" y="285">仲裁</text><text fill="#555" font-size="10" text-anchor="middle" x="281" y="303">Arbitration</text><text fill="#555" font-size="10" text-anchor="middle" x="281" y="325">多设备竞争时</text><text fill="#555" font-size="10" text-anchor="middle" x="281" y="339">按优先级裁决</text><rect fill="#ffe0d6" height="110" rx="8" stroke="#c0392b" stroke-width="1.5" width="150" x="372" y="245"></rect><circle cx="397" cy="270" fill="#c0392b" r="13"></circle><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="397" y="275">3</text><text fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle" x="447" y="285">寻址</text><text fill="#555" font-size="10" text-anchor="middle" x="447" y="303">Addressing</text><text fill="#555" font-size="10" text-anchor="middle" x="447" y="325">放出目标地址</text><text fill="#555" font-size="10" text-anchor="middle" x="447" y="339">指定从设备</text><rect fill="#d5f5e3" height="110" rx="8" stroke="#00695c" stroke-width="1.5" width="150" x="538" y="245"></rect><circle cx="563" cy="270" fill="#00695c" r="13"></circle><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="563" y="275">4</text><text fill="#1e8449" font-size="14" font-weight="bold" text-anchor="middle" x="613" y="285">传输</text><text fill="#555" font-size="10" text-anchor="middle" x="613" y="303">Transfer</text><text fill="#555" font-size="10" text-anchor="middle" x="613" y="325">读/写数据</text><text fill="#555" font-size="10" text-anchor="middle" x="613" y="339">交换发生</text><rect fill="#e8e0f5" height="110" rx="8" stroke="#6c5ce7" stroke-width="1.5" width="150" x="704" y="245"></rect><circle cx="729" cy="270" fill="#6c5ce7" r="13"></circle><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="729" y="275">5</text><text fill="#5b4bc4" font-size="14" font-weight="bold" text-anchor="middle" x="779" y="285">终止</text><text fill="#555" font-size="10" text-anchor="middle" x="779" y="303">Termination</text><text fill="#555" font-size="10" text-anchor="middle" x="779" y="325">确认完成</text><text fill="#555" font-size="10" text-anchor="middle" x="779" y="339">撤销总线控制</text><line marker-end="url(#arrow)" stroke="#636e72" stroke-width="2" x1="190" x2="206" y1="300" y2="300"></line><line marker-end="url(#arrow)" stroke="#636e72" stroke-width="2" x1="356" x2="372" y1="300" y2="300"></line><line marker-end="url(#arrow)" stroke="#636e72" stroke-width="2" x1="522" x2="538" y1="300" y2="300"></line><line marker-end="url(#arrow)" stroke="#636e72" stroke-width="2" x1="688" x2="704" y1="300" y2="300"></line><rect fill="#f1f2f6" height="60" rx="5" width="814" x="40" y="372"></rect><text fill="#2c3e50" font-size="13" font-weight="bold" text-anchor="middle" x="447" y="394">总线事务是总线操作的基本单位：主设备控制总线，从设备识别地址并完成数据交换</text><text fill="#636e72" font-size="11" text-anchor="middle" x="447" y="413">仲裁阶段仅在多个设备同时竞争总线时需要；简单系统可省略</text><text fill="#636e72" font-size="11" text-anchor="middle" x="447" y="427">一个总线事务可包含一次或多次（突发）数据传输</text><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0V6L8 3z" fill="#636e72"></path></marker></defs></svg>