<svg xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" viewBox="0 0 900 520"><rect fill="none" height="520" rx="12" width="900"></rect><text fill="#1a1a2e" font-size="20" font-weight="bold" text-anchor="middle" x="450" y="36">总线宽度 &amp; 总线带宽 图解</text><rect fill="#e8f8f5" height="210" rx="8" stroke="#1abc9c" stroke-width="1.5" width="840" x="30" y="55"></rect><text fill="#148f77" font-size="13" font-weight="bold" x="46" y="78">① 总线宽度（Bus Width）</text><text fill="#555" font-size="11" x="46" y="97">总线上能同时传输的数据位数 = 数据线的根数</text><text fill="#888" font-size="12" font-weight="bold" x="46" y="122">8 位总线（8 根数据线）</text><g fill="#aed6f1" stroke="#2980b9" stroke-width="1"><rect height="16" rx="3" width="28" x="46" y="128"></rect><rect height="16" rx="3" width="28" x="80" y="128"></rect><rect height="16" rx="3" width="28" x="114" y="128"></rect><rect height="16" rx="3" width="28" x="148" y="128"></rect><rect height="16" rx="3" width="28" x="182" y="128"></rect><rect height="16" rx="3" width="28" x="216" y="128"></rect><rect height="16" rx="3" width="28" x="250" y="128"></rect><rect height="16" rx="3" width="28" x="284" y="128"></rect></g><g fill="#1a5276" font-size="10" text-anchor="middle"><text x="60" y="140">1</text><text x="94" y="140">0</text><text x="128" y="140">1</text><text x="162" y="140">1</text><text x="196" y="140">0</text><text x="230" y="140">0</text><text x="264" y="140">1</text><text x="298" y="140">0</text></g><line stroke="#1abc9c" stroke-width="1.5" x1="46" x2="312" y1="152" y2="152"></line><line stroke="#1abc9c" stroke-width="1.5" x1="46" x2="46" y1="148" y2="156"></line><line stroke="#1abc9c" stroke-width="1.5" x1="312" x2="312" y1="148" y2="156"></line><text fill="#148f77" font-size="11" text-anchor="middle" x="179" y="166">8 根 → 每次传 1 字节</text><text fill="#888" font-size="12" font-weight="bold" x="46" y="192">32 位总线（32 根数据线）</text><g fill="#a9dfbf" stroke="#1e8449" stroke-width="1"><rect height="16" rx="3" width="28" x="46" y="198"></rect><rect height="16" rx="3" width="28" x="80" y="198"></rect><rect height="16" rx="3" width="28" x="114" y="198"></rect><rect height="16" rx="3" width="28" x="148" y="198"></rect><rect height="16" rx="3" width="28" x="182" y="198"></rect><rect height="16" rx="3" width="28" x="216" y="198"></rect><rect height="16" rx="3" width="28" x="250" y="198"></rect><rect height="16" rx="3" width="28" x="284" y="198"></rect><rect height="16" rx="3" width="28" x="318" y="198"></rect><rect height="16" rx="3" width="28" x="352" y="198"></rect><rect height="16" rx="3" width="28" x="386" y="198"></rect><rect height="16" rx="3" width="28" x="420" y="198"></rect><rect height="16" rx="3" width="28" x="454" y="198"></rect><rect height="16" rx="3" width="28" x="488" y="198"></rect><rect height="16" rx="3" width="28" x="522" y="198"></rect><rect height="16" rx="3" width="28" x="556" y="198"></rect></g><g fill="#a9dfbf" stroke="#1e8449" stroke-width="1"><rect height="16" rx="3" width="28" x="46" y="218"></rect><rect height="16" rx="3" width="28" x="80" y="218"></rect><rect height="16" rx="3" width="28" x="114" y="218"></rect><rect height="16" rx="3" width="28" x="148" y="218"></rect><rect height="16" rx="3" width="28" x="182" y="218"></rect><rect height="16" rx="3" width="28" x="216" y="218"></rect><rect height="16" rx="3" width="28" x="250" y="218"></rect><rect height="16" rx="3" width="28" x="284" y="218"></rect><rect height="16" rx="3" width="28" x="318" y="218"></rect><rect height="16" rx="3" width="28" x="352" y="218"></rect><rect height="16" rx="3" width="28" x="386" y="218"></rect><rect height="16" rx="3" width="28" x="420" y="218"></rect><rect height="16" rx="3" width="28" x="454" y="218"></rect><rect height="16" rx="3" width="28" x="488" y="218"></rect><rect height="16" rx="3" width="28" x="522" y="218"></rect><rect height="16" rx="3" width="28" x="556" y="218"></rect></g><line stroke="#1abc9c" stroke-width="1.5" x1="46" x2="584" y1="242" y2="242"></line><line stroke="#1abc9c" stroke-width="1.5" x1="46" x2="46" y1="238" y2="246"></line><line stroke="#1abc9c" stroke-width="1.5" x1="584" x2="584" y1="238" y2="246"></line><text fill="#148f77" font-size="11" text-anchor="middle" x="315" y="256">32 根 → 每次传 4 字节（位宽越宽，单次传输越多）</text><text fill="#555" font-size="12" x="620" y="140">位宽决定"并行通道数"</text><text fill="#888" font-size="11" x="620" y="158">8 位 → 1 字节 / 次</text><text fill="#888" font-size="11" x="620" y="174">16 位 → 2 字节 / 次</text><text fill="#888" font-size="11" x="620" y="190">32 位 → 4 字节 / 次</text><text fill="#888" font-size="11" x="620" y="206">64 位 → 8 字节 / 次</text><rect fill="#fdf2f8" height="220" rx="8" stroke="#8e44ad" stroke-width="1.5" width="840" x="30" y="280"></rect><text fill="#7d3c98" font-size="13" font-weight="bold" x="46" y="302">② 总线带宽（Bus Bandwidth）</text><text fill="#555" font-size="11" x="46" y="321">单位时间内总线能传输的最大数据量（MB/s 或 GB/s）</text><rect fill="#d7bde2" height="40" rx="6" stroke="#7d3c98" stroke-width="1" width="808" x="46" y="332"></rect><text fill="#4a235a" font-size="13" font-weight="bold" text-anchor="middle" x="450" y="348">带宽 = （总线宽度 / 8）× 工作频率</text><text fill="#6c3483" font-size="11" text-anchor="middle" x="450" y="364">单位：(bits / 8) × Hz = Bytes/s → 换算为 MB/s</text><rect fill="#ebdef0" height="100" rx="6" stroke="#8e44ad" stroke-width="1" width="240" x="46" y="384"></rect><text fill="#6c3483" font-size="12" font-weight="bold" text-anchor="middle" x="166" y="402">示例 A</text><text fill="#555" font-size="11" text-anchor="middle" x="166" y="420">宽度 = 32 位</text><text fill="#555" font-size="11" text-anchor="middle" x="166" y="436">工作频率 = 100 MHz</text><line stroke="#8e44ad" stroke-dasharray="4,3" stroke-width="1" x1="66" x2="266" y1="444" y2="444"></line><text fill="#4a235a" font-size="12" font-weight="bold" text-anchor="middle" x="166" y="460">= (32/8) × 100M</text><text fill="#7d3c98" font-size="12" font-weight="bold" text-anchor="middle" x="166" y="476">= 400 MB/s</text><rect fill="#ebdef0" height="100" rx="6" stroke="#8e44ad" stroke-width="1" width="240" x="330" y="384"></rect><text fill="#6c3483" font-size="12" font-weight="bold" text-anchor="middle" x="450" y="402">示例 B（DDR）</text><text fill="#555" font-size="11" text-anchor="middle" x="450" y="420">宽度 = 64 位</text><text fill="#555" font-size="11" text-anchor="middle" x="450" y="436">工作频率 = 2 × 100 MHz</text><line stroke="#8e44ad" stroke-dasharray="4,3" stroke-width="1" x1="350" x2="550" y1="444" y2="444"></line><text fill="#4a235a" font-size="12" font-weight="bold" text-anchor="middle" x="450" y="460">= (64/8) × 200M</text><text fill="#7d3c98" font-size="12" font-weight="bold" text-anchor="middle" x="450" y="476">= 1600 MB/s</text><rect fill="#ebdef0" height="100" rx="6" stroke="#8e44ad" stroke-width="1" width="240" x="614" y="384"></rect><text fill="#6c3483" font-size="12" font-weight="bold" text-anchor="middle" x="734" y="402">示例 C（宽度翻倍）</text><text fill="#555" font-size="11" text-anchor="middle" x="734" y="420">宽度 = 64 位</text><text fill="#555" font-size="11" text-anchor="middle" x="734" y="436">工作频率 = 100 MHz</text><line stroke="#8e44ad" stroke-dasharray="4,3" stroke-width="1" x1="634" x2="834" y1="444" y2="444"></line><text fill="#4a235a" font-size="12" font-weight="bold" text-anchor="middle" x="734" y="460">= (64/8) × 100M</text><text fill="#7d3c98" font-size="12" font-weight="bold" text-anchor="middle" x="734" y="476">= 800 MB/s</text><text fill="#c0392b" font-size="18" text-anchor="middle" x="295" y="430">→</text><text fill="#c0392b" font-size="9" text-anchor="middle" x="295" y="445">频率×2</text><text fill="#27ae60" font-size="18" text-anchor="middle" x="579" y="430">→</text><text fill="#27ae60" font-size="9" text-anchor="middle" x="579" y="445">位宽×2</text></svg>