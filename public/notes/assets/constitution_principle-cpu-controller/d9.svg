<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><rect fill="none" height="600" width="900"></rect><g id="registers"><rect fill="#e3f2fd" height="200" stroke="#1976d2" stroke-width="2" width="120" x="30" y="150"></rect><text font-size="14" font-weight="bold" text-anchor="middle" x="90" y="135">寄存器组</text><rect fill="#fff" height="35" stroke="#666" stroke-width="1" width="100" x="40" y="180"></rect><text font-size="13" text-anchor="middle" x="90" y="202">R0</text><rect fill="#fff" height="35" stroke="#666" stroke-width="1" width="100" x="40" y="225"></rect><text font-size="13" text-anchor="middle" x="90" y="247">R1</text><rect fill="#fff" height="35" stroke="#666" stroke-width="1" width="100" x="40" y="270"></rect><text font-size="13" text-anchor="middle" x="90" y="292">R2</text><text font-size="12" text-anchor="middle" x="90" y="325">...</text></g><rect fill="#fff3e0" height="40" stroke="#f57c00" stroke-width="2" width="100" x="250" y="80"></rect><text font-size="13" font-weight="bold" text-anchor="middle" x="300" y="105">MAR</text><rect fill="#fff3e0" height="40" stroke="#f57c00" stroke-width="2" width="100" x="250" y="150"></rect><text font-size="13" font-weight="bold" text-anchor="middle" x="300" y="175">MDR</text><rect fill="#f3e5f5" height="150" stroke="#7b1fa2" stroke-width="2" width="120" x="450" y="80"></rect><text font-size="14" font-weight="bold" text-anchor="middle" x="510" y="105">存储器</text><rect fill="#fff" height="25" stroke="#666" stroke-width="1" width="90" x="465" y="120"></rect><text font-size="11" text-anchor="middle" x="510" y="138">地址</text><rect fill="#fff" height="25" stroke="#666" stroke-width="1" width="90" x="465" y="155"></rect><text font-size="11" text-anchor="middle" x="510" y="173">数据</text><g id="alu-section"><rect fill="#e8f5e9" height="40" stroke="#388e3c" stroke-width="2" width="100" x="250" y="280"></rect><text font-size="13" font-weight="bold" text-anchor="middle" x="300" y="305">T1</text><path d="M4e2 350H5e2l-20 70H420z" fill="#ffebee" stroke="#d32f2f" stroke-width="2"></path><text font-size="14" font-weight="bold" text-anchor="middle" x="450" y="388">ALU</text><rect fill="#e8f5e9" height="40" stroke="#388e3c" stroke-width="2" width="100" x="550" y="370"></rect><text font-size="13" font-weight="bold" text-anchor="middle" x="600" y="395">T2</text></g><g id="mux"><path d="M250 370l40-10v30l-40-10z" fill="#fff8e1" stroke="#ffa000" stroke-width="2"></path><text font-size="11" text-anchor="middle" x="270" y="377">MUX</text></g><g id="clock-cycles"><rect fill="none" height="500" stroke="#999" stroke-dasharray="5,5" stroke-width="1" width="150" x="720" y="50"></rect><text font-size="14" font-weight="bold" text-anchor="middle" x="795" y="40">时钟周期</text><rect fill="#e1f5fe" height="80" stroke="#0277bd" stroke-width="1" width="130" x="730" y="60"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="795" y="80">C7: MAR←R1</text><text font-size="10" text-anchor="middle" x="795" y="100">R1out, MARin</text><circle cx="745" cy="120" fill="#d32f2f" r="3"></circle><text font-size="9" x="760" y="124">R1→MAR传输</text><rect fill="#f3e5f5" height="80" stroke="#7b1fa2" stroke-width="1" width="130" x="730" y="150"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="795" y="170">C8: MDR←M(MAR)</text><text font-size="10" text-anchor="middle" x="795" y="190">MemR, MDRin</text><circle cx="745" cy="210" fill="#7b1fa2" r="3"></circle><text font-size="9" x="760" y="214">存储器读取</text><rect fill="#e8f5e9" height="80" stroke="#388e3c" stroke-width="1" width="130" x="730" y="240"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="795" y="260">C9: T1←R0</text><text font-size="10" text-anchor="middle" x="795" y="280">R0out, T1in</text><circle cx="745" cy="300" fill="#388e3c" r="3"></circle><text font-size="9" x="760" y="304">R0→T1暂存</text><rect fill="#ffebee" height="80" stroke="#d32f2f" stroke-width="1" width="130" x="730" y="330"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="795" y="350">C10: T2←MDR+T1</text><text font-size="10" text-anchor="middle" x="795" y="370">MDRout, MUXop,</text><text font-size="10" text-anchor="middle" x="795" y="385">Add, T2in</text><circle cx="745" cy="395" fill="#d32f2f" r="3"></circle><text font-size="9" x="760" y="399">ALU执行加法</text><rect fill="#e1f5fe" height="80" stroke="#0277bd" stroke-width="1" width="130" x="730" y="420"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="795" y="440">C11: R0←T2</text><text font-size="10" text-anchor="middle" x="795" y="460">T2out, R0in</text><circle cx="745" cy="480" fill="#0277bd" r="3"></circle><text font-size="9" x="760" y="484">结果写回R0</text></g><defs><marker id="arrowhead-blue" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#0277bd" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-purple" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#7b1fa2" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-green" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#388e3c" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead-red" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#d32f2f" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><path d="M140 242 250 1e2" fill="none" marker-end="url(#arrowhead-blue)" stroke="#0277bd" stroke-dasharray="5,3" stroke-width="2"><animate attributename="stroke-dashoffset" dur="2s" from="8" repeatcount="indefinite" to="0"></animate></path><text fill="#0277bd" font-size="10" x="180" y="160">C7</text><path d="M350 1e2H450" fill="none" marker-end="url(#arrowhead-purple)" stroke="#7b1fa2" stroke-width="2"></path><path d="M450 170H350" fill="none" marker-end="url(#arrowhead-purple)" stroke="#7b1fa2" stroke-dasharray="5,3" stroke-width="2"><animate attributename="stroke-dashoffset" dur="2s" from="8" repeatcount="indefinite" to="0"></animate></path><text fill="#7b1fa2" font-size="10" x="400" y="95">C8</text><path d="M140 197 250 3e2" fill="none" marker-end="url(#arrowhead-green)" stroke="#388e3c" stroke-dasharray="5,3" stroke-width="2"><animate attributename="stroke-dashoffset" dur="2s" from="8" repeatcount="indefinite" to="0"></animate></path><text fill="#388e3c" font-size="10" x="180" y="240">C9</text><path d="M3e2 190 270 360" fill="none" marker-end="url(#arrowhead-red)" stroke="#d32f2f" stroke-width="2"></path><path d="M290 375H4e2" fill="none" marker-end="url(#arrowhead-red)" stroke="#d32f2f" stroke-width="2"></path><path d="M350 3e2l70 55" fill="none" marker-end="url(#arrowhead-red)" stroke="#d32f2f" stroke-width="2"></path><path d="M480 390h70" fill="none" marker-end="url(#arrowhead-red)" stroke="#d32f2f" stroke-dasharray="5,3" stroke-width="2"><animate attributename="stroke-dashoffset" dur="2s" from="8" repeatcount="indefinite" to="0"></animate></path><text fill="#d32f2f" font-size="10" x="320" y="250">C10</text><path d="M550 380Q350 250 140 197" fill="none" marker-end="url(#arrowhead-blue)" stroke="#0277bd" stroke-dasharray="5,3" stroke-width="2"><animate attributename="stroke-dashoffset" dur="2s" from="8" repeatcount="indefinite" to="0"></animate></path><text fill="#0277bd" font-size="10" x="400" y="280">C11</text><g id="control-signals"><rect fill="none" height="120" stroke="#666" stroke-dasharray="3,3" stroke-width="1" width="650" x="30" y="450"></rect><text font-size="12" font-weight="bold" text-anchor="middle" x="355" y="470">控制信号说明</text><text font-size="10" x="50" y="495">• R1out, MARin: 寄存器R1输出，MAR输入使能</text><text font-size="10" x="50" y="515">• MemR, MDRin: 存储器读操作，MDR输入使能</text><text font-size="10" x="50" y="535">• R0out, T1in: 寄存器R0输出，T1暂存器输入使能</text><text font-size="10" x="360" y="495">• MDRout, MUXop: MDR输出，MUX选择操作数</text><text font-size="10" x="360" y="515">• Add, T2in: ALU执行加法，T2暂存器输入使能</text><text font-size="10" x="360" y="535">• T2out, R0in: T2暂存器输出，R0输入使能</text></g><text fill="#333" font-size="16" font-weight="bold" x="200" y="30">执行阶段</text><text fill="#7b1fa2" font-size="16" font-weight="bold" x="400" y="30">访存阶段</text><text fill="#0277bd" font-size="16" font-weight="bold" x="600" y="30">写回阶段</text></svg>