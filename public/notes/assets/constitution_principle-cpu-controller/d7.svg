<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#e74c3c" points="0 0, 10 3, 0 6"></polygon></marker></defs><rect class="highlight-box" height="110" rx="5" width="360" x="20" y="20"></rect><text class="section-title" x="35" y="42">① 赋值符号 ←</text><text class="text" x="50" y="65">R1 ← R2 + R3</text><text class="comment" x="50" y="85">目标寄存器 ← 源操作数</text><text class="note" x="50" y="105">等价写法：R1 ← (R2) + (R3)</text><text class="note" x="50" y="120">() 表示读取寄存器内容</text><rect class="highlight-box" height="110" rx="5" width="380" x="400" y="20"></rect><text class="section-title" x="415" y="42">② 并行操作（同一时钟周期）</text><text class="text" x="430" y="65">PC ← PC + 4</text><text class="parallel" x="523" y="65">,</text><text class="text" x="540" y="65">MAR ← PC</text><rect fill="none" height="20" rx="3" stroke="#27ae60" stroke-width="2" width="15" x="518" y="50"></rect><text class="comment" x="430" y="85">逗号分隔 = 同时执行</text><text class="note" x="430" y="105">两个传送操作在一个</text><text class="note" x="430" y="120">时钟周期内完成</text><rect class="highlight-box" height="150" rx="5" width="360" x="20" y="150"></rect><text class="section-title" x="35" y="172">③ 顺序操作（多个时钟周期）</text><text class="text" x="50" y="200">MAR ← PC</text><text class="comment" x="200" y="200">T1 周期</text><rect fill="none" height="20" rx="2" stroke="#9b59b6" stroke-dasharray="3,3" stroke-width="1.5" width="145" x="40" y="186"></rect><text class="text" x="50" y="225">MDR ← M[MAR]</text><text class="comment" x="200" y="225">T2 周期</text><rect fill="none" height="20" rx="2" stroke="#9b59b6" stroke-dasharray="3,3" stroke-width="1.5" width="145" x="40" y="211"></rect><text class="text" x="50" y="250">IR ← MDR</text><text class="comment" x="200" y="250">T3 周期</text><rect fill="none" height="20" rx="2" stroke="#9b59b6" stroke-dasharray="3,3" stroke-width="1.5" width="145" x="40" y="236"></rect><text class="note" x="50" y="270">不同行 = 不同时钟周期</text><text class="note" x="50" y="285">按顺序逐个执行</text><rect class="highlight-box" height="210" rx="5" width="380" x="400" y="150"></rect><text class="section-title" x="415" y="172">④ 存储器访问</text><text class="section-title" style="font-size:12px;fill:#16a085" x="430" y="195">读存储器：</text><text class="text" x="445" y="215">MAR ← PC</text><text class="comment" x="600" y="215">设置地址</text><text class="text" x="445" y="235">MDR ← M[MAR]</text><text class="comment" x="600" y="235">读取数据</text><rect fill="#fff3cd" height="18" rx="2" stroke="#f39c12" stroke-width="1" width="40" x="540" y="202"></rect><text style="font:700 11px sans-serif;fill:#f39c12" x="545" y="215">MAR</text><rect fill="#d4edda" height="18" rx="2" stroke="#28a745" stroke-width="1" width="40" x="540" y="222"></rect><text style="font:700 11px sans-serif;fill:#28a745" x="545" y="235">MDR</text><text class="section-title" style="font-size:12px;fill:#c0392b" x="430" y="265">写存储器：</text><text class="text" x="445" y="285">MAR ← R1</text><text class="parallel" x="555" y="285">,</text><text class="text" x="565" y="285">MDR ← R2</text><text class="text" x="445" y="305">M[MAR] ← MDR</text><text class="comment" x="600" y="305">写入数据</text><rect fill="#fff3cd" height="18" rx="2" stroke="#f39c12" stroke-width="1" width="40" x="510" y="272"></rect><text style="font:700 11px sans-serif;fill:#f39c12" x="515" y="285">MAR</text><rect fill="#d4edda" height="18" rx="2" stroke="#28a745" stroke-width="1" width="40" x="635" y="272"></rect><text style="font:700 11px sans-serif;fill:#28a745" x="640" y="285">MDR</text><text class="note" x="445" y="330">MAR = 存储器地址寄存器</text><text class="note" x="445" y="345">MDR = 存储器数据寄存器</text><rect class="box" height="120" rx="5" width="760" x="20" y="380"></rect><text class="section-title" x="35" y="402">关键要点</text><circle cx="50" cy="425" fill="#3498db" r="4"></circle><text class="text" x="65" y="430">← 表示数据传送方向，从右到左</text><circle cx="50" cy="450" fill="#27ae60" r="4"></circle><text class="text" x="65" y="455">逗号(,) 表示并行执行，多行表示顺序执行</text><circle cx="50" cy="475" fill="#e74c3c" r="4"></circle><text class="text" x="65" y="480">存储器访问必须通过 MAR(地址) 和 MDR(数据)</text><circle cx="420" cy="425" fill="#9b59b6" r="4"></circle><text class="text" x="435" y="430">M[地址] 表示访问存储器指定地址</text><circle cx="420" cy="450" fill="#f39c12" r="4"></circle><text class="text" x="435" y="455">(R1) 和 R1 含义相同，都表示读取寄存器</text><circle cx="420" cy="475" fill="#16a085" r="4"></circle><text class="text" x="435" y="480">时钟周期：并行操作在1个周期，顺序操作需多个周期</text></svg>