<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" viewBox="0 0 760 470"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#4a5568"></path></marker><marker id="arrow-red" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c53030"></path></marker><marker id="arrow-green" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2f855a"></path></marker></defs><text fill="#2d3748" font-weight="600" x="20" y="30">入口队列 (Entry Queue)</text><text fill="#718096" font-size="11" x="20" y="48">试图进入管程但被阻塞的线程</text><g><circle cx="40" cy="90" fill="#fed7d7" r="16" stroke="#c53030" stroke-width="1.5"></circle><text fill="#742a2a" font-size="11" text-anchor="middle" x="40" y="94">T3</text><circle cx="80" cy="90" fill="#fed7d7" r="16" stroke="#c53030" stroke-width="1.5"></circle><text fill="#742a2a" font-size="11" text-anchor="middle" x="80" y="94">T4</text><circle cx="120" cy="90" fill="#fed7d7" r="16" stroke="#c53030" stroke-width="1.5"></circle><text fill="#742a2a" font-size="11" text-anchor="middle" x="120" y="94">T5</text></g><line marker-end="url(#arrow-red)" stroke="#c53030" stroke-dasharray="4,3" stroke-width="2" x1="140" x2="205" y1="90" y2="90"></line><text fill="#c53030" font-size="11" x="150" y="82">尝试进入</text><rect fill="#f7fafc" height="375" rx="14" ry="14" stroke="#2b6cb0" stroke-width="2.5" width="530" x="210" y="55"></rect><text fill="#2b6cb0" font-size="15" font-weight="700" x="230" y="80">管程 (Monitor)</text><text fill="#4a5568" font-size="11" x="230" y="97">同一时刻最多一个线程可执行管程内的代码</text><g transform="translate(670,68)"><rect fill="#f6ad55" height="20" rx="3" stroke="#c05621" stroke-width="1.5" width="26" x="0" y="8"></rect><path d="M5 8V4a8 8 0 0116 0V8" fill="none" stroke="#c05621" stroke-width="2"></path><text fill="#7b341e" font-size="10" font-weight="600" text-anchor="middle" x="13" y="22">互斥</text></g><rect fill="#fefcbf" height="80" rx="8" stroke="#b7791f" stroke-width="1.5" width="220" x="230" y="115"></rect><text fill="#744210" font-weight="600" text-anchor="middle" x="340" y="135">共享数据</text><text fill="#744210" font-size="11" text-anchor="middle" x="340" y="155">buffer[N], count, in, out ...</text><text fill="#975a16" font-size="10" text-anchor="middle" x="340" y="175">只能通过管程内的方法访问</text><rect fill="#c6f6d5" height="60" rx="8" stroke="#2f855a" stroke-width="1.5" width="105" x="230" y="215"></rect><text fill="#22543d" font-weight="600" text-anchor="middle" x="282" y="238">方法 produce()</text><text fill="#22543d" font-size="10" text-anchor="middle" x="282" y="256">写入共享数据</text><text fill="#22543d" font-size="10" text-anchor="middle" x="282" y="270">调用 wait/signal</text><rect fill="#c6f6d5" height="60" rx="8" stroke="#2f855a" stroke-width="1.5" width="105" x="345" y="215"></rect><text fill="#22543d" font-weight="600" text-anchor="middle" x="397" y="238">方法 consume()</text><text fill="#22543d" font-size="10" text-anchor="middle" x="397" y="256">读取共享数据</text><text fill="#22543d" font-size="10" text-anchor="middle" x="397" y="270">调用 wait/signal</text><line marker-end="url(#arrow)" stroke="#4a5568" stroke-width="1.3" x1="282" x2="310" y1="215" y2="195"></line><line marker-end="url(#arrow)" stroke="#4a5568" stroke-width="1.3" x1="397" x2="370" y1="215" y2="195"></line><circle cx="282" cy="310" fill="#bee3f8" r="16" stroke="#2b6cb0" stroke-width="1.5"></circle><text fill="#2c5282" font-size="11" text-anchor="middle" x="282" y="314">T1</text><text fill="#2c5282" font-size="10" text-anchor="middle" x="282" y="342">当前执行的线程</text><line marker-end="url(#arrow)" stroke="#2b6cb0" stroke-width="1.3" x1="282" x2="282" y1="294" y2="278"></line><rect fill="#fff" height="200" rx="8" stroke="#805ad5" stroke-dasharray="5,3" stroke-width="1.5" width="245" x="475" y="115"></rect><text fill="#553c9a" font-weight="600" text-anchor="middle" x="597" y="135">条件变量</text><rect fill="#faf5ff" height="65" rx="6" stroke="#805ad5" stroke-width="1" width="215" x="490" y="150"></rect><text fill="#553c9a" font-size="12" font-weight="600" x="500" y="170">notFull</text><text fill="#553c9a" font-size="10" x="500" y="186">等待队列:</text><circle cx="573" cy="183" fill="#e9d8fd" r="12" stroke="#805ad5" stroke-width="1.2"></circle><text fill="#44337a" font-size="10" text-anchor="middle" x="573" y="187">T6</text><circle cx="601" cy="183" fill="#e9d8fd" r="12" stroke="#805ad5" stroke-width="1.2"></circle><text fill="#44337a" font-size="10" text-anchor="middle" x="601" y="187">T7</text><text fill="#6b46c1" font-size="10" x="500" y="207">缓冲区满时 producer 在此等待</text><rect fill="#faf5ff" height="65" rx="6" stroke="#805ad5" stroke-width="1" width="215" x="490" y="225"></rect><text fill="#553c9a" font-size="12" font-weight="600" x="500" y="245">notEmpty</text><text fill="#553c9a" font-size="10" x="500" y="261">等待队列:</text><circle cx="573" cy="258" fill="#e9d8fd" r="12" stroke="#805ad5" stroke-width="1.2"></circle><text fill="#44337a" font-size="10" text-anchor="middle" x="573" y="262">T8</text><text fill="#6b46c1" font-size="10" x="500" y="282">缓冲区空时 consumer 在此等待</text><path d="M450 245q15 0 35-27" fill="none" marker-end="url(#arrow-red)" stroke="#c53030" stroke-width="1.5"></path><text fill="#c53030" font-size="10" x="443" y="238">wait()</text><path d="M490 3e2q-45 5-85-20" fill="none" marker-end="url(#arrow-green)" stroke="#2f855a" stroke-width="1.5"></path><text fill="#2f855a" font-size="10" x="435" y="315">signal()</text><rect fill="#edf2f7" height="65" rx="6" stroke="#a0aec0" stroke-width="1" width="490" x="230" y="355"></rect><text fill="#2d3748" font-size="11" x="245" y="375"><tspan fill="#c53030" font-weight="600">互斥</tspan>: 进入方法需先获得管程锁, 未获得的线程进入<tspan font-weight="600">入口队列</tspan></text><text fill="#2d3748" font-size="11" x="245" y="393"><tspan fill="#805ad5" font-weight="600">同步</tspan>: 条件不满足时 wait() 释放锁并挂起; 其它线程 signal() 唤醒等待者</text><text fill="#2d3748" font-size="11" x="245" y="411"><tspan fill="#2f855a" font-weight="600">封装</tspan>: 共享数据只能被管程内的方法访问, 隐藏低层同步细节</text><text fill="#718096" font-size="11" x="20" y="450">图例:</text><circle cx="70" cy="446" fill="#bee3f8" r="9" stroke="#2b6cb0"></circle><text fill="#2c5282" font-size="11" x="85" y="450">运行中的线程</text><circle cx="180" cy="446" fill="#fed7d7" r="9" stroke="#c53030"></circle><text fill="#742a2a" font-size="11" x="195" y="450">入口阻塞</text><circle cx="275" cy="446" fill="#e9d8fd" r="9" stroke="#805ad5"></circle><text fill="#44337a" font-size="11" x="290" y="450">条件变量等待</text></svg>