<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="13" viewBox="0 0 720 390"><text class="h" font-size="16" text-anchor="middle" x="360" y="28">整型 ⇄ 浮点数 类型转换风险矩阵</text><g class="h"><rect class="cell" fill="#eef" height="40" width="140" x="40" y="60"></rect><text text-anchor="middle" x="110" y="85">源类型 \ 目标类型</text><rect class="cell" fill="#eef" height="40" width="170" x="180" y="60"></rect><text text-anchor="middle" x="265" y="85">int (32 位)</text><rect class="cell" fill="#eef" height="40" width="170" x="350" y="60"></rect><text text-anchor="middle" x="435" y="85">float (32 位)</text><rect class="cell" fill="#eef" height="40" width="170" x="520" y="60"></rect><text text-anchor="middle" x="605" y="85">double (64 位)</text></g><g><rect class="cell" fill="#eef" height="80" width="140" x="40" y="100"></rect><text class="h" text-anchor="middle" x="110" y="135">int</text><text fill="#666" font-size="11" text-anchor="middle" x="110" y="155">补码，± 2^31</text><rect class="cell safe" height="80" width="170" x="180" y="100"></rect><text class="h" text-anchor="middle" x="265" y="130">—</text><text font-size="11" text-anchor="middle" x="265" y="150">同类型</text><rect class="cell round" height="80" width="170" x="350" y="100"></rect><text class="h" text-anchor="middle" x="435" y="130">精度可能丢失</text><text font-size="11" text-anchor="middle" x="435" y="150">|x| &gt; 2^24 时舍入</text><text fill="#666" font-size="11" text-anchor="middle" x="435" y="168">尾数仅 23 位</text><rect class="cell safe" height="80" width="170" x="520" y="100"></rect><text class="h" text-anchor="middle" x="605" y="130">精确</text><text font-size="11" text-anchor="middle" x="605" y="150">double 52 位尾数</text><text fill="#666" font-size="11" text-anchor="middle" x="605" y="168">覆盖整个 int 范围</text></g><g><rect class="cell" fill="#eef" height="80" width="140" x="40" y="180"></rect><text class="h" text-anchor="middle" x="110" y="215">float</text><text fill="#666" font-size="11" text-anchor="middle" x="110" y="235">IEEE 754, 32 位</text><rect class="cell trunc" height="80" width="170" x="180" y="180"></rect><text class="h" text-anchor="middle" x="265" y="210">截断小数 + 可能溢出</text><text font-size="11" text-anchor="middle" x="265" y="230">超出 int 范围未定义</text><rect class="cell safe" height="80" width="170" x="350" y="180"></rect><text class="h" text-anchor="middle" x="435" y="215">—</text><text font-size="11" text-anchor="middle" x="435" y="235">同类型</text><rect class="cell safe" height="80" width="170" x="520" y="180"></rect><text class="h" text-anchor="middle" x="605" y="215">精确</text><text font-size="11" text-anchor="middle" x="605" y="235">double 范围/精度更高</text></g><g><rect class="cell" fill="#eef" height="80" width="140" x="40" y="260"></rect><text class="h" text-anchor="middle" x="110" y="295">double</text><text fill="#666" font-size="11" text-anchor="middle" x="110" y="315">IEEE 754, 64 位</text><rect class="cell trunc" height="80" width="170" x="180" y="260"></rect><text class="h" text-anchor="middle" x="265" y="290">截断小数 + 可能溢出</text><text font-size="11" text-anchor="middle" x="265" y="310">|x| &gt; 2^31 未定义</text><rect class="cell ovf" height="80" width="170" x="350" y="260"></rect><text class="h" text-anchor="middle" x="435" y="290">精度丢失 / 溢出</text><text font-size="11" text-anchor="middle" x="435" y="310">超 float 范围 → ±∞</text><text fill="#666" font-size="11" text-anchor="middle" x="435" y="328">尾数从 52 位 → 23 位</text><rect class="cell safe" height="80" width="170" x="520" y="260"></rect><text class="h" text-anchor="middle" x="605" y="295">—</text><text font-size="11" text-anchor="middle" x="605" y="315">同类型</text></g><g class="legend" transform="translate(40,360)"><rect class="safe" height="16" width="20" x="0" y="0"></rect><text x="28" y="13">精确 / 无损</text><rect class="round" height="16" width="20" x="120" y="0"></rect><text x="148" y="13">舍入 (精度丢失)</text><rect class="trunc" height="16" width="20" x="280" y="0"></rect><text x="308" y="13">截断 (丢失小数)</text><rect class="ovf" height="16" width="20" x="440" y="0"></rect><text x="468" y="13">溢出 / 未定义</text></g></svg>