<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">内存碎片形成过程</text><g><text fill="#34495e" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="60">阶段1：初始状态</text><rect fill="#95a5a6" height="120" stroke="#7f8c8d" stroke-dasharray="5,5" stroke-width="2" width="200" x="50" y="70"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="125">连续空闲内存</text><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="140">1000KB</text><text fill="#27ae60" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="150" y="210">✓ 大块连续空间，易分配</text></g><g><text fill="#34495e" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="60">阶段2：进程陆续分配</text><rect fill="#3498db" height="30" stroke="#2980b9" stroke-width="2" width="200" x="300" y="70"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="90">进程A (200KB)</text><rect fill="#95a5a6" height="25" stroke="#7f8c8d" stroke-dasharray="3,3" stroke-width="1" width="200" x="300" y="100"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="400" y="117">剩余 800KB</text><rect fill="#e74c3c" height="35" stroke="#c0392b" stroke-width="2" width="200" x="300" y="125"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="148">进程B (300KB)</text><rect fill="#95a5a6" height="30" stroke="#7f8c8d" stroke-dasharray="3,3" stroke-width="1" width="200" x="300" y="160"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="400" y="180">剩余 500KB</text><text fill="#f39c12" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="400" y="210">⚠ 空间逐渐减少</text></g><g><text fill="#34495e" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="650" y="60">阶段3：进程释放</text><rect fill="#f1c40f" height="20" stroke="#f39c12" stroke-dasharray="8,4" stroke-width="2" width="200" x="550" y="70"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="650" y="85">碎片 (200KB)</text><rect fill="#9b59b6" height="40" stroke="#8e44ad" stroke-width="2" width="200" x="550" y="90"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="650" y="115">进程C (350KB)</text><rect fill="#f1c40f" height="15" stroke="#f39c12" stroke-dasharray="8,4" stroke-width="2" width="200" x="550" y="130"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" x="650" y="142">碎片 (150KB)</text><rect fill="#1abc9c" height="25" stroke="#16a085" stroke-width="2" width="200" x="550" y="145"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="650" y="162">进程D (200KB)</text><rect fill="#f1c40f" height="10" stroke="#f39c12" stroke-dasharray="8,4" stroke-width="2" width="200" x="550" y="170"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="8" font-weight="bold" text-anchor="middle" x="650" y="180">碎片 (100KB)</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="650" y="210">✗ 产生多个小碎片</text></g><path d="M250 130h50" fill="none" marker-end="url(#arrow1)" stroke="#34495e" stroke-width="2"></path><path d="M5e2 130h50" fill="none" marker-end="url(#arrow2)" stroke="#34495e" stroke-width="2"></path><defs><marker id="arrow1" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#34495e" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrow2" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#34495e" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><g><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="260">碎片问题演示</text><rect fill="#ff6b6b" height="40" stroke="#ff5252" stroke-width="2" width="120" x="50" y="280"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="110" y="300">新进程E</text><text fill="#fff" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="110" y="315">需要 250KB</text><g transform="translate(200, 280)"><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="200" y="0">当前内存状态</text><rect fill="#f1c40f" height="30" stroke="#f39c12" stroke-dasharray="5,5" stroke-width="2" width="80" x="0" y="10"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="40" y="30">200KB</text><rect fill="#3498db" height="30" stroke="#2980b9" stroke-width="2" width="120" x="80" y="10"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="140" y="30">进程运行中</text><rect fill="#f1c40f" height="30" stroke="#f39c12" stroke-dasharray="5,5" stroke-width="2" width="60" x="200" y="10"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="230" y="30">150KB</text><rect fill="#e74c3c" height="30" stroke="#c0392b" stroke-width="2" width="80" x="260" y="10"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="300" y="30">进程</text><rect fill="#f1c40f" height="30" stroke="#f39c12" stroke-dasharray="5,5" stroke-width="2" width="50" x="340" y="10"></rect><text fill="#8b4513" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="365" y="30">100KB</text></g><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" x="110" y="345">无法分配！</text><g transform="translate(450, 340)"><rect fill="#fff" height="60" rx="5" stroke="#bdc3c7" stroke-width="2" width="200" x="0" y="0"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="100" y="18">空间分析</text><text fill="#27ae60" font-family="Arial, sans-serif" font-size="11" x="20" y="35">碎片总空间：450KB</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" x="20" y="50">最大连续空间：200KB &lt; 250KB</text></g><g transform="translate(170, 300)"><circle cx="0" cy="0" fill="#e74c3c" r="15"></circle><line stroke="#fff" stroke-width="3" x1="-8" x2="8" y1="-8" y2="8"></line><line stroke="#fff" stroke-width="3" x1="8" x2="-8" y1="-8" y2="8"></line></g></g><g><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="430">内存碎片的影响与解决</text><g transform="translate(50, 450)"><rect fill="#fff3cd" height="80" rx="5" stroke="#ffc107" stroke-width="2" width="300" x="0" y="0"></rect><text fill="#856404" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="18">负面影响</text><text fill="#856404" font-family="Arial, sans-serif" font-size="11" x="15" y="35">• 内存利用率降低</text><text fill="#856404" font-family="Arial, sans-serif" font-size="11" x="15" y="50">• 无法分配足够大的连续空间</text><text fill="#856404" font-family="Arial, sans-serif" font-size="11" x="15" y="65">• 系统性能下降</text></g><g transform="translate(450, 450)"><rect fill="#d1ecf1" height="80" rx="5" stroke="#17a2b8" stroke-width="2" width="300" x="0" y="0"></rect><text fill="#0c5460" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="150" y="18">解决方案</text><text fill="#0c5460" font-family="Arial, sans-serif" font-size="11" x="15" y="35">• 内存压缩整理</text><text fill="#0c5460" font-family="Arial, sans-serif" font-size="11" x="15" y="50">• 分页存储管理</text><text fill="#0c5460" font-family="Arial, sans-serif" font-size="11" x="15" y="65">• 虚拟内存技术</text></g></g><g><rect fill="#f8f9fa" height="30" rx="3" stroke="#dee2e6" stroke-width="1" width="300" x="250" y="560"></rect><text fill="#495057" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="400" y="580">碎片：太小无法被进程利用的空闲内存块</text></g></svg>