<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"><text fill="#333" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">动态分区分配算法</text><g transform="translate(20, 60)"><text fill="#2563eb" font-size="16" font-weight="bold" x="0" y="0">First Fit (首次适应)</text><text fill="#666" font-size="12" x="0" y="20">从头遍历，选择第一个满足的空闲块</text><g transform="translate(0, 30)"><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="60" x="0" y="0"></rect><text font-size="11" text-anchor="middle" x="30" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="40" x="60" y="0"></rect><text font-size="11" text-anchor="middle" x="80" y="25">15K</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="50" x="100" y="0"></rect><text font-size="11" text-anchor="middle" x="125" y="25">已用</text><rect fill="#86efac" height="40" stroke="#16a34a" stroke-width="2" width="70" x="150" y="0"></rect><text font-size="11" text-anchor="middle" x="185" y="25">30K ✓</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="40" x="220" y="0"></rect><text font-size="11" text-anchor="middle" x="240" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="50" x="260" y="0"></rect><text font-size="11" text-anchor="middle" x="285" y="25">35K</text><text fill="#2563eb" font-size="10" x="180" y="-30">需求: 25K</text></g></g><g transform="translate(420, 60)"><text fill="#7c3aed" font-size="16" font-weight="bold" x="0" y="0">Next Fit (临近适应)</text><text fill="#666" font-size="12" x="0" y="20">从上次分配位置的下一个继续查找</text><g transform="translate(0, 30)"><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="60" x="0" y="0"></rect><text font-size="11" text-anchor="middle" x="30" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="40" x="60" y="0"></rect><text font-size="11" text-anchor="middle" x="80" y="25">15K</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="10" x="100" y="0"></rect><rect fill="#f3e8ff" height="40" stroke="#7c3aed" stroke-dasharray="3,2" stroke-width="1" width="50" x="110" y="0"></rect><text font-size="11" text-anchor="middle" x="130" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="40" x="150" y="0"></rect><text font-size="11" text-anchor="middle" x="170" y="25">20K</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="30" x="190" y="0"></rect><text font-size="11" text-anchor="middle" x="205" y="25">已用</text><rect fill="#86efac" height="40" stroke="#16a34a" stroke-width="2" width="70" x="220" y="0"></rect><text font-size="11" text-anchor="middle" x="255" y="25">35K ✓</text><text fill="#7c3aed" font-size="10" x="165" y="-35">需求: 25K</text></g></g><g transform="translate(20, 180)"><text fill="#dc2626" font-size="16" font-weight="bold" x="0" y="0">Best Fit (最佳适应)</text><text fill="#666" font-size="12" x="0" y="20">遍历全部，选择最小满足的空闲块</text><g transform="translate(0, 30)"><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="60" x="0" y="0"></rect><text font-size="11" text-anchor="middle" x="30" y="25">已用</text><rect fill="#fee2e2" height="40" stroke="#333" stroke-width="1" width="40" x="60" y="0"></rect><text font-size="11" text-anchor="middle" x="80" y="25">15K</text><text fill="#999" font-size="9" text-anchor="middle" x="80" y="55">太小 ✗</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="50" x="100" y="0"></rect><text font-size="11" text-anchor="middle" x="125" y="25">已用</text><rect fill="#86efac" height="40" stroke="#16a34a" stroke-width="2" width="70" x="150" y="0"></rect><text font-size="11" text-anchor="middle" x="185" y="25">28K ✓</text><text fill="#16a34a" font-size="9" text-anchor="middle" x="185" y="55">最佳!</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="40" x="220" y="0"></rect><text font-size="11" text-anchor="middle" x="240" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="65" x="260" y="0"></rect><text font-size="11" text-anchor="middle" x="292" y="25">35K</text><text fill="#666" font-size="9" text-anchor="middle" x="292" y="55">浪费多</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="45" x="325" y="0"></rect><text font-size="11" text-anchor="middle" x="347" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="70" x="370" y="0"></rect><text font-size="11" text-anchor="middle" x="405" y="25">40K</text><text fill="#666" font-size="9" text-anchor="middle" x="405" y="55">浪费多</text><text fill="#dc2626" font-size="10" x="195" y="-10">需求: 25K</text></g></g><g transform="translate(20, 300)"><text fill="#ea580c" font-size="16" font-weight="bold" x="0" y="0">Worst Fit (最坏适应)</text><text fill="#666" font-size="12" x="0" y="20">遍历全部，选择最大的空闲块</text><g transform="translate(0, 30)"><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="60" x="0" y="0"></rect><text font-size="11" text-anchor="middle" x="30" y="25">已用</text><rect fill="#fee2e2" height="40" stroke="#333" stroke-width="1" width="40" x="60" y="0"></rect><text font-size="11" text-anchor="middle" x="80" y="25">15K</text><text fill="#999" font-size="9" text-anchor="middle" x="80" y="55">太小 ✗</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="45" x="100" y="0"></rect><text font-size="11" text-anchor="middle" x="122" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="65" x="145" y="0"></rect><text font-size="11" text-anchor="middle" x="177" y="25">28K</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="40" x="210" y="0"></rect><text font-size="11" text-anchor="middle" x="230" y="25">已用</text><rect fill="#e0f2fe" height="40" stroke="#333" stroke-width="1" width="65" x="250" y="0"></rect><text font-size="11" text-anchor="middle" x="282" y="25">35K</text><rect fill="#ffcccb" height="40" stroke="#333" stroke-width="1" width="35" x="315" y="0"></rect><text font-size="11" text-anchor="middle" x="332" y="25">已用</text><rect fill="#86efac" height="40" stroke="#16a34a" stroke-width="2" width="80" x="350" y="0"></rect><text font-size="11" text-anchor="middle" x="390" y="25">50K ✓</text><text fill="#ea580c" font-size="9" text-anchor="middle" x="390" y="55">最大!</text><text fill="#ea580c" font-size="10" x="270" y="-10">需求: 25K</text></g></g><g transform="translate(20, 420)"><text fill="#333" font-size="16" font-weight="bold" x="0" y="0">算法特点对比</text><rect fill="#f9fafb" height="120" stroke="#d1d5db" stroke-width="1" width="760" x="0" y="10"></rect><line stroke="#d1d5db" stroke-width="1" x1="0" x2="760" y1="35" y2="35"></line><line stroke="#d1d5db" stroke-width="1" x1="190" x2="190" y1="10" y2="130"></line><line stroke="#d1d5db" stroke-width="1" x1="380" x2="380" y1="10" y2="130"></line><line stroke="#d1d5db" stroke-width="1" x1="570" x2="570" y1="10" y2="130"></line><text font-size="12" font-weight="bold" text-anchor="middle" x="95" y="28">First Fit</text><text font-size="12" font-weight="bold" text-anchor="middle" x="285" y="28">Next Fit</text><text font-size="12" font-weight="bold" text-anchor="middle" x="475" y="28">Best Fit</text><text font-size="12" font-weight="bold" text-anchor="middle" x="665" y="28">Worst Fit</text><text fill="#16a34a" font-size="11" x="10" y="55">优点:</text><text font-size="10" x="20" y="70">• 速度快</text><text font-size="10" x="20" y="82">• 实现简单</text><text fill="#16a34a" font-size="11" x="200" y="55">优点:</text><text font-size="10" x="210" y="70">• 分配均匀</text><text font-size="10" x="210" y="82">• 避免低地址碎片</text><text fill="#16a34a" font-size="11" x="390" y="55">优点:</text><text font-size="10" x="400" y="70">• 内存利用率高</text><text font-size="10" x="400" y="82">• 碎片最小</text><text fill="#16a34a" font-size="11" x="580" y="55">优点:</text><text font-size="10" x="590" y="70">• 碎片更少</text><text fill="#dc2626" font-size="11" x="10" y="100">缺点:</text><text font-size="10" x="20" y="115">• 低地址碎片多</text><text fill="#dc2626" font-size="11" x="200" y="100">缺点:</text><text font-size="10" x="210" y="115">• 可能循环查找</text><text fill="#dc2626" font-size="11" x="390" y="100">缺点:</text><text font-size="10" x="400" y="115">• 速度慢(需遍历)，产生内存碎片</text><text fill="#dc2626" font-size="11" x="580" y="100">缺点:</text><text font-size="10" x="590" y="115">• 大空间被过度使用，碎片可能较大</text></g><defs><marker id="arrowblue" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#2563eb"></path></marker><marker id="arrowpurple" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="9" refY="3"><path d="M0 0V6L9 3z" fill="#7c3aed"></path></marker></defs></svg>