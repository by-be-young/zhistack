<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550"><rect fill="none" height="600" width="800" x="0" y="0"></rect><g transform="translate(150, 80)"><rect fill="none" height="400" stroke="#34495e" stroke-width="3" width="150" x="0" y="-30"></rect><rect fill="#e74c3c" height="100" stroke="#c0392b" stroke-width="1" width="150" x="0" y="-30"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="75" y="25">系统区</text><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="75" y="45">操作系统</text><rect fill="#3498db" height="300" stroke="#2980b9" stroke-width="1" width="150" x="0" y="70"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="75" y="210">用户区</text><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="75" y="230">单一用户程序</text><text fill="#fff" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="75" y="250">独占整个用户空间</text></g><g transform="translate(120, 80)"><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="0" y="-15">高地址</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="0" y="390">低地址</text></g><g transform="translate(400, 100)"><rect fill="#d5f4e6" height="140" rx="10" stroke="#27ae60" stroke-width="2" width="300" x="0" y="-30"></rect><text fill="#27ae60" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="150" y="-5">优点</text><circle cx="20" cy="20" fill="#27ae60" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="25">实现简单</text><circle cx="20" cy="45" fill="#27ae60" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="50">无外部碎片</text><circle cx="20" cy="70" fill="#27ae60" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="75">无需内存保护</text><circle cx="20" cy="95" fill="#27ae60" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="100">内存中永远只有一道程序</text><rect fill="#fdeaa7" height="140" rx="10" stroke="#f39c12" stroke-width="2" width="300" x="0" y="140"></rect><text fill="#e67e22" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="150" y="165">缺点</text><circle cx="20" cy="190" fill="#e67e22" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="195">只能用于单用户、单任务系统</text><circle cx="20" cy="215" fill="#e67e22" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="220">存储器利用率极低</text><circle cx="20" cy="240" fill="#e67e22" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="245">不支持多任务处理</text><circle cx="20" cy="265" fill="#e67e22" r="4"></circle><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" x="35" y="270">无法并发执行多个程序</text></g><g transform="translate(400, 350)"><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="100" y="50">系统区 + 单一程序 + 未使用空间</text><rect fill="#e74c3c" height="15" width="15" x="0" y="70"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" x="25" y="82">系统区</text><rect fill="#3498db" height="15" width="15" x="80" y="70"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" x="105" y="82">用户程序</text><rect fill="#ecf0f1" height="15" stroke="#bdc3c7" width="15" x="170" y="70"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" x="195" y="82">未使用</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#7f8c8d" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" x="400" y="520">这是最简单的内存管理方式，适用于早期的单任务操作系统</text></svg>