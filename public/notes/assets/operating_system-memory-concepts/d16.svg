<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">段表与地址翻译</text><g><text fill="#e74c3c" font-size="14" font-weight="bold" x="50" y="80">逻辑地址 (段地址)</text><rect fill="#fff2cc" height="40" stroke="#d4ad00" stroke-width="2" width="120" x="50" y="90"></rect><text fill="#333" font-size="12" x="70" y="105">段号</text><text fill="#333" font-size="12" font-weight="bold" x="70" y="118">2</text><rect fill="#dae8fc" height="40" stroke="#6c8ebf" stroke-width="2" width="120" x="170" y="90"></rect><text fill="#333" font-size="12" x="200" y="105">段内偏移</text><text fill="#333" font-size="12" font-weight="bold" x="210" y="118">300</text></g><path d="M110 140v40h90v40" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="2"></path><text fill="#e74c3c" font-size="11" x="120" y="175">用段号查表</text><g><text fill="#27ae60" font-size="14" font-weight="bold" x="240" y="200">段表</text><rect fill="#e8f5e8" height="30" stroke="#27ae60" stroke-width="2" width="60" x="150" y="210"></rect><text fill="#333" font-size="11" font-weight="bold" x="165" y="225">段号</text><rect fill="#e8f5e8" height="30" stroke="#27ae60" stroke-width="2" width="80" x="210" y="210"></rect><text fill="#333" font-size="11" font-weight="bold" x="230" y="225">基地址</text><rect fill="#e8f5e8" height="30" stroke="#27ae60" stroke-width="2" width="80" x="290" y="210"></rect><text fill="#333" font-size="11" font-weight="bold" x="315" y="225">限制</text><rect fill="#fff" height="25" stroke="#27ae60" width="60" x="150" y="240"></rect><text fill="#333" font-size="11" text-anchor="middle" x="175" y="255">0</text><rect fill="#fff" height="25" stroke="#27ae60" width="80" x="210" y="240"></rect><text fill="#333" font-size="11" text-anchor="middle" x="250" y="255">1000</text><rect fill="#fff" height="25" stroke="#27ae60" width="80" x="290" y="240"></rect><text fill="#333" font-size="11" text-anchor="middle" x="330" y="255">400</text><rect fill="#fff" height="25" stroke="#27ae60" width="60" x="150" y="265"></rect><text fill="#333" font-size="11" text-anchor="middle" x="175" y="280">1</text><rect fill="#fff" height="25" stroke="#27ae60" width="80" x="210" y="265"></rect><text fill="#333" font-size="11" text-anchor="middle" x="250" y="280">2000</text><rect fill="#fff" height="25" stroke="#27ae60" width="80" x="290" y="265"></rect><text fill="#333" font-size="11" text-anchor="middle" x="330" y="280">600</text><rect fill="#fff2cc" height="25" stroke="#d4ad00" stroke-width="3" width="60" x="150" y="290"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="175" y="305">2</text><rect fill="#fff2cc" height="25" stroke="#d4ad00" stroke-width="3" width="80" x="210" y="290"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="250" y="305">3000</text><rect fill="#fff2cc" height="25" stroke="#d4ad00" stroke-width="3" width="80" x="290" y="290"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="330" y="305">800</text></g><g><text fill="#e67e22" font-size="12" font-weight="bold" x="400" y="260">越界检查</text><rect fill="#fef2e0" height="50" rx="5" stroke="#e67e22" stroke-width="2" width="160" x="400" y="270"></rect><text fill="#333" font-size="11" x="410" y="285">偏移(300) &lt; 限制(800) ?</text><text fill="#27ae60" font-size="12" font-weight="bold" x="450" y="300">✓ 通过</text><text fill="#666" font-size="10" x="410" y="315">如果超出则产生段越界错误</text></g><path d="M250 330v50H480" fill="none" marker-end="url(#arrowhead)" stroke="#27ae60" stroke-width="2"></path><text fill="#27ae60" font-size="11" x="280" y="375">获取基地址</text><g><text fill="#8e44ad" font-size="14" font-weight="bold" x="500" y="360">地址计算</text><rect fill="#f4ecf7" height="60" rx="5" stroke="#8e44ad" stroke-width="2" width="200" x="480" y="370"></rect><text fill="#333" font-size="12" x="490" y="390">物理地址 = 基地址 + 偏移</text><text fill="#8e44ad" font-size="14" font-weight="bold" x="530" y="410">3000 + 300 = 3300</text></g><g><text fill="#c0392b" font-size="14" font-weight="bold" x="500" y="470">物理地址</text><rect fill="#fadbd8" height="40" stroke="#c0392b" stroke-width="2" width="120" x="480" y="480"></rect><text fill="#c0392b" font-size="16" font-weight="bold" text-anchor="middle" x="520" y="500">3300</text></g><path d="M580 390v80" fill="none" marker-end="url(#arrowhead)" stroke="#8e44ad" stroke-width="2"></path><g><text fill="#34495e" font-size="12" font-weight="bold" x="50" y="370">翻译步骤:</text><text fill="#34495e" font-size="11" x="50" y="390">1. 从逻辑地址提取段号(2)</text><text fill="#34495e" font-size="11" x="50" y="410">2. 用段号查段表获得基地址(3000)和限制(800)</text><text fill="#34495e" font-size="11" x="50" y="430">3. 检查偏移(300)是否小于限制(800)</text><text fill="#34495e" font-size="11" x="50" y="450">4. 计算物理地址: 3000 + 300 = 3300</text></g><g><text fill="#16a085" font-size="12" font-weight="bold" x="650" y="120">物理内存</text><rect fill="#e8f8f5" height="200" stroke="#16a085" stroke-width="2" width="80" x="630" y="130"></rect><rect fill="#f0f0f0" height="40" stroke="#999" width="70" x="635" y="135"></rect><text fill="#333" font-size="10" x="655" y="150">段0</text><text fill="#666" font-size="9" x="650" y="165">1000-1399</text><rect fill="#f0f0f0" height="60" stroke="#999" width="70" x="635" y="180"></rect><text fill="#333" font-size="10" x="655" y="205">段1</text><text fill="#666" font-size="9" x="650" y="220">2000-2599</text><rect fill="#fff2cc" height="80" stroke="#d4ad00" stroke-width="3" width="70" x="635" y="245"></rect><text fill="#333" font-size="10" font-weight="bold" x="655" y="270">段2</text><text fill="#666" font-size="9" x="650" y="285">3000-3799</text><circle cx="670" cy="300" fill="#e74c3c" r="3"></circle><text fill="#e74c3c" font-size="8" x="675" y="305">3300</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#666" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text fill="#7f8c8d" font-size="11" text-anchor="middle" x="400" y="580">段表实现了逻辑地址到物理地址的映射，同时提供越界保护</text></svg>