<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1e3 950"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#666" points="0 0, 10 3, 0 6"></polygon></marker></defs><text class="title" text-anchor="middle" x="500" y="35">进程堆内存分配与释放过程</text><g id="stage1"><text class="subtitle" x="50" y="85">1. 初始状态（空闲堆空间）</text><rect class="free-block" height="90" rx="4" width="600" x="50" y="110"></rect><text class="label" text-anchor="middle" x="350" y="160">空闲块（600 KB）</text><text class="small-label" x="50" y="215">0x1000</text><text class="small-label" text-anchor="end" x="630" y="215">0x1258</text></g><g id="stage2"><text class="subtitle" x="50" y="265">2. malloc(200KB) - 首次适应分配</text><text class="code" x="700" y="295">p1 = malloc(200*1024)</text><rect class="allocated-block" height="90" rx="4" width="200" x="50" y="290"></rect><text class="label" text-anchor="middle" x="150" y="335">已分配</text><text class="small-label" text-anchor="middle" x="150" y="360">200 KB (p1)</text><rect class="free-block" height="90" rx="4" width="400" x="250" y="290"></rect><text class="label" text-anchor="middle" x="450" y="340">空闲块（400 KB）</text><text class="small-label" x="50" y="395">0x1000</text><text class="small-label" x="250" y="395">0x1064</text><text class="small-label" text-anchor="end" x="630" y="395">0x1258</text></g><g id="stage3"><text class="subtitle" x="50" y="445">3. malloc(150KB) - 继续分配</text><text class="code" x="700" y="475">p2 = malloc(150*1024)</text><rect class="allocated-block" height="90" rx="4" width="200" x="50" y="470"></rect><text class="small-label" text-anchor="middle" x="150" y="515">200 KB (p1)</text><rect class="allocated-block" height="90" rx="4" width="150" x="250" y="470"></rect><text class="small-label" text-anchor="middle" x="325" y="515">150 KB (p2)</text><rect class="free-block" height="90" rx="4" width="250" x="400" y="470"></rect><text class="label" text-anchor="middle" x="525" y="520">空闲块（250 KB）</text><text class="small-label" x="50" y="575">0x1000</text><text class="small-label" x="250" y="575">0x1064</text><text class="small-label" x="400" y="575">0x10C8</text><text class="small-label" text-anchor="end" x="630" y="575">0x1258</text></g><g id="stage4"><text class="subtitle" x="50" y="625">4. free(p1) - 释放第一块内存</text><text class="code" x="700" y="655">free(p1)</text><rect class="free-block" height="90" rx="4" width="200" x="50" y="650"></rect><text class="small-label" text-anchor="middle" x="150" y="695">空闲块（200 KB）</text><rect class="allocated-block" height="90" rx="4" width="150" x="250" y="650"></rect><text class="small-label" text-anchor="middle" x="325" y="695">150 KB (p2)</text><rect class="free-block" height="90" rx="4" width="250" x="400" y="650"></rect><text class="label" text-anchor="middle" x="525" y="700">空闲块（250 KB）</text><text class="small-label" x="50" y="755">0x1000</text><text class="small-label" x="250" y="755">0x1064</text><text class="small-label" x="400" y="755">0x10C8</text></g><g id="stage5"><text class="subtitle" x="50" y="805">5. free(p2) - 释放并合并相邻空闲块</text><text class="code" x="700" y="835">free(p2)</text><rect class="free-block" height="90" rx="4" width="600" x="50" y="830"></rect><text class="label" text-anchor="middle" x="350" y="870">空闲块（600 KB）- 已合并</text><text class="small-label" text-anchor="middle" x="350" y="895">减少内存碎片</text><text class="small-label" x="50" y="935">0x1000</text><text class="small-label" text-anchor="end" x="630" y="935">0x1258</text></g><g id="legend" transform="translate(700, 100)"><text class="label" font-weight="bold" x="0" y="0">图例：</text><rect class="free-block" height="30" rx="2" width="45" x="0" y="15"></rect><text class="small-label" x="55" y="35">空闲块</text><rect class="allocated-block" height="30" rx="2" width="45" x="0" y="60"></rect><text class="small-label" x="55" y="80">已分配块</text></g></svg>