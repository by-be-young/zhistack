<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1e3 800"><text fill="#2c3e50" font-size="24" font-weight="bold" text-anchor="middle" x="500" y="30">IEEE 754 浮点数存储格式</text><text fill="#34495e" font-size="18" text-anchor="middle" x="500" y="60">V = (-1)^s × M × 2^E</text><text fill="#e74c3c" font-size="20" font-weight="bold" x="50" y="120">单精度 (32位)</text><g transform="translate(50, 140)"><rect fill="#e74c3c" height="50" stroke="#c0392b" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="20" y="30">s</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="20" y="70">31</text><rect fill="#3498db" height="50" stroke="#2980b9" stroke-width="2" width="320" x="40" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="200" y="30">exp (8位)</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="60" y="70">30</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="340" y="70">23</text><rect fill="#27ae60" height="50" stroke="#229954" stroke-width="2" width="460" x="360" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="590" y="30">frac (23位)</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="380" y="70">22</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="800" y="70">0</text></g><g transform="translate(50, 240)"><text fill="#2c3e50" font-size="16" font-weight="bold" x="0" y="0">单精度参数：</text><text fill="#34495e" font-size="14" x="0" y="25">• k = 8, Bias = 127</text><text fill="#34495e" font-size="14" x="0" y="45">• 1 ≤ exp ≤ 254</text><text fill="#34495e" font-size="14" x="0" y="65">• -126 ≤ E ≤ 127</text><text fill="#34495e" font-size="14" x="0" y="85">• n = 23, 1 ≤ M ≤ 2-2^(-23)</text></g><text fill="#8e44ad" font-size="20" font-weight="bold" x="50" y="380">双精度 (64位)</text><g transform="translate(50, 400)"><rect fill="#e74c3c" height="50" stroke="#c0392b" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="20" y="30">s</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="20" y="70">63</text><rect fill="#9b59b6" height="50" stroke="#8e44ad" stroke-width="2" width="220" x="40" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="30">exp (11位)</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="60" y="70">62</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="240" y="70">52</text><rect fill="#16a085" height="50" stroke="#138d75" stroke-width="2" width="560" x="260" y="0"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="540" y="30">frac (52位)</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="280" y="70">51</text><text fill="#2c3e50" font-size="12" text-anchor="middle" x="800" y="70">0</text></g><g transform="translate(50, 500)"><text fill="#2c3e50" font-size="16" font-weight="bold" x="0" y="0">双精度参数：</text><text fill="#34495e" font-size="14" x="0" y="25">• k = 11, Bias = 1023</text><text fill="#34495e" font-size="14" x="0" y="45">• 1 ≤ exp ≤ 2046</text><text fill="#34495e" font-size="14" x="0" y="65">• -1022 ≤ E ≤ 1023</text><text fill="#34495e" font-size="14" x="0" y="85">• n = 52, 1 ≤ M ≤ 2-2^(-52)</text></g><g transform="translate(50, 620)"><text fill="#2c3e50" font-size="18" font-weight="bold" x="0" y="0">计算公式：</text><rect fill="#ecf0f1" height="80" rx="5" stroke="#bdc3c7" stroke-width="1" width="900" x="0" y="10"></rect><text fill="#2c3e50" font-size="16" x="20" y="35">• 符号位：s = 0 (正数), s = 1 (负数)</text><text fill="#2c3e50" font-size="16" x="20" y="55">• 指数部分：E = exp - Bias</text><text fill="#2c3e50" font-size="16" x="20" y="75">• 尾数部分：M = 1 + frac (隐含的前导1)</text></g><g transform="translate(50, 760)"><text fill="#e67e22" font-size="16" font-weight="bold" x="0" y="0">优势：相比传统浮点表示，IEEE 754格式可以用更少的位数表示更大的数值范围</text><text fill="#34495e" font-size="14" x="0" y="25">例如：5×2^100 在IEEE格式中只需要标准的32位或64位，而不需要103位</text></g><g transform="translate(950, 140)"><text fill="#2c3e50" font-size="14" font-weight="bold" x="0" y="0">图例</text><rect fill="#e74c3c" height="15" width="20" x="0" y="10"></rect><text fill="#2c3e50" font-size="12" x="25" y="22">符号位</text><rect fill="#3498db" height="15" width="20" x="0" y="30"></rect><text fill="#2c3e50" font-size="12" x="25" y="42">阶码 (单精度)</text><rect fill="#9b59b6" height="15" width="20" x="0" y="50"></rect><text fill="#2c3e50" font-size="12" x="25" y="62">阶码 (双精度)</text><rect fill="#27ae60" height="15" width="20" x="0" y="70"></rect><text fill="#2c3e50" font-size="12" x="25" y="82">尾数 (单精度)</text><rect fill="#16a085" height="15" width="20" x="0" y="90"></rect><text fill="#2c3e50" font-size="12" x="25" y="102">尾数 (双精度)</text></g></svg>