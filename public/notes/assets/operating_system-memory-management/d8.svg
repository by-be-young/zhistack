<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><lineargradient id="headerGrad" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#4A90E2;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"></stop></lineargradient><lineargradient id="pageGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#F8F9FA;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#E9ECEF;stop-opacity:1"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><dropshadow dx="2" dy="2" flood-color="#000" flood-opacity=".2" stddeviation="3"></dropshadow></filter></defs><rect fill="none" height="600" width="800"></rect><rect fill="#E8F4FD" filter="url(#shadow)" height="80" rx="10" stroke="#4A90E2" stroke-width="2" width="700" x="50" y="30"></rect><text fill="#2C3E50" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="55">核心思想：选择在未来最长时间内不会被访问的页面进行置换</text><text fill="#34495E" font-size="14" text-anchor="middle" x="400" y="80">（需要预知未来的页面访问序列）</text><text fill="#E74C3C" font-size="12" text-anchor="middle" x="400" y="100">⚠️ 实际不可实现，仅用于理论研究和性能基准</text><text fill="#2C3E50" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="150">算法演示示例</text><text fill="#34495E" font-size="14" font-weight="bold" x="70" y="185">页面访问序列：</text><g id="sequence"><rect fill="#FFE4E1" height="25" rx="3" stroke="#FF6B6B" width="30" x="200" y="170"></rect><text fill="#C0392B" font-size="12" font-weight="bold" text-anchor="middle" x="215" y="187">A</text><rect fill="#E1F5FE" height="25" rx="3" stroke="#2196F3" width="30" x="240" y="170"></rect><text fill="#1565C0" font-size="12" font-weight="bold" text-anchor="middle" x="255" y="187">B</text><rect fill="#F3E5F5" height="25" rx="3" stroke="#9C27B0" width="30" x="280" y="170"></rect><text fill="#7B1FA2" font-size="12" font-weight="bold" text-anchor="middle" x="295" y="187">C</text><rect fill="#FFE4E1" height="25" rx="3" stroke="#FF6B6B" width="30" x="320" y="170"></rect><text fill="#C0392B" font-size="12" font-weight="bold" text-anchor="middle" x="335" y="187">A</text><rect fill="#E8F5E8" height="25" rx="3" stroke="#4CAF50" width="30" x="360" y="170"></rect><text fill="#2E7D32" font-size="12" font-weight="bold" text-anchor="middle" x="375" y="187">D</text><rect fill="#E1F5FE" height="25" rx="3" stroke="#2196F3" width="30" x="400" y="170"></rect><text fill="#1565C0" font-size="12" font-weight="bold" text-anchor="middle" x="415" y="187">B</text><rect fill="#FFF3E0" height="25" rx="3" stroke="#FF9800" width="30" x="440" y="170"></rect><text fill="#F57C00" font-size="12" font-weight="bold" text-anchor="middle" x="455" y="187">E</text><rect fill="#FFE4E1" height="25" rx="3" stroke="#FF6B6B" width="30" x="480" y="170"></rect><text fill="#C0392B" font-size="12" font-weight="bold" text-anchor="middle" x="495" y="187">A</text></g><polygon fill="#E74C3C" points="375,205 380,215 370,215"></polygon><text fill="#E74C3C" font-size="12" font-weight="bold" text-anchor="middle" x="375" y="230">当前时刻</text><text fill="#34495E" font-size="14" font-weight="bold" x="70" y="270">当前内存状态 (容量: 3页)：</text><g id="memory"><rect fill="url(#pageGrad)" height="40" rx="5" stroke="#34495E" stroke-width="2" width="60" x="280" y="280"></rect><text fill="#34495E" font-size="10" text-anchor="middle" x="310" y="295">页面 A</text><text fill="#E74C3C" font-size="9" text-anchor="middle" x="310" y="310">下次访问: +3</text><rect fill="url(#pageGrad)" height="40" rx="5" stroke="#34495E" stroke-width="2" width="60" x="350" y="280"></rect><text fill="#34495E" font-size="10" text-anchor="middle" x="380" y="295">页面 B</text><text fill="#27AE60" font-size="9" text-anchor="middle" x="380" y="310">下次访问: +2</text><rect fill="#FFE5E5" height="40" rx="5" stroke="#E74C3C" stroke-width="3" width="60" x="420" y="280"></rect><text fill="#34495E" font-size="10" text-anchor="middle" x="450" y="295">页面 C</text><text fill="#E74C3C" font-size="9" text-anchor="middle" x="450" y="310">不再访问</text></g><text fill="#E74C3C" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="350">OPT 算法选择：置换页面 C （未来不再访问）</text><rect fill="#E8F5E8" height="140" rx="10" stroke="#27AE60" stroke-width="2" width="340" x="50" y="380"></rect><text fill="#27AE60" font-size="16" font-weight="bold" text-anchor="middle" x="220" y="400">✓ 算法优势</text><text fill="#2C3E50" font-size="13" x="70" y="425">• 理论上最优解</text><text fill="#2C3E50" font-size="13" x="70" y="445">• 缺页中断次数最少</text><text fill="#2C3E50" font-size="13" x="70" y="465">• 性能评估基准</text><text fill="#2C3E50" font-size="13" x="70" y="485">• 算法正确性证明标准</text><text fill="#2C3E50" font-size="13" x="70" y="505">• 其他算法效果对比</text><rect fill="#FFE5E5" height="140" rx="10" stroke="#E74C3C" stroke-width="2" width="340" x="410" y="380"></rect><text fill="#E74C3C" font-size="16" font-weight="bold" text-anchor="middle" x="580" y="400">✗ 实际限制</text><text fill="#2C3E50" font-size="13" x="430" y="425">• 无法预知未来访问</text><text fill="#2C3E50" font-size="13" x="430" y="445">• 实际系统不可实现</text><text fill="#2C3E50" font-size="13" x="430" y="465">• 仅用于理论研究</text><text fill="#2C3E50" font-size="13" x="430" y="485">• 需要完整访问序列</text><text fill="#2C3E50" font-size="13" x="430" y="505">• 计算复杂度较高</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#E74C3C" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>