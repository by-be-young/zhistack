<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">抖动 (Thrashing) 现象图解</text><rect fill="#e8f4fd" height="400" stroke="#3498db" stroke-width="2" width="200" x="50" y="80"></rect><text fill="#2980b9" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="150" y="70">物理内存</text><rect fill="#fff" height="40" stroke="#bdc3c7" stroke-width="1" width="180" x="60" y="100"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="125">页面 A</text><rect fill="#fff" height="40" stroke="#bdc3c7" stroke-width="1" width="180" x="60" y="150"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="175">页面 B</text><rect fill="#fff" height="40" stroke="#bdc3c7" stroke-width="1" width="180" x="60" y="200"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="225">页面 C</text><rect fill="#ffeaa7" height="40" stroke="#fdcb6e" stroke-width="2" width="180" x="60" y="250"></rect><text fill="#e17055" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="275">内存不足!</text><rect fill="#fef9e7" height="400" stroke="#f39c12" stroke-width="2" width="200" x="550" y="80"></rect><text fill="#e67e22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="650" y="70">磁盘存储</text><rect fill="#fff" height="30" stroke="#bdc3c7" stroke-width="1" width="180" x="560" y="100"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="650" y="120">页面 D</text><rect fill="#fff" height="30" stroke="#bdc3c7" stroke-width="1" width="180" x="560" y="140"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="650" y="160">页面 E</text><rect fill="#fff" height="30" stroke="#bdc3c7" stroke-width="1" width="180" x="560" y="180"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="650" y="200">页面 F</text><rect fill="#fff" height="30" stroke="#bdc3c7" stroke-width="1" width="180" x="560" y="220"></rect><text fill="#34495e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="650" y="240">页面 G</text><text fill="#7f8c8d" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="650" y="280">...</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="10" refY="3.5"><polygon fill="#27ae60" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><path d="M250 150q150-30 3e2-20" fill="none" marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="3"><animate attributename="opacity" dur="1.5s" repeatcount="indefinite" values="0;1;0"></animate></path><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="400" y="115">换出到磁盘</text><path d="M550 2e2q-150 30-3e2 20" fill="none" marker-end="url(#arrowhead2)" stroke="#27ae60" stroke-width="3"><animate attributename="opacity" begin=".75s" dur="1.5s" repeatcount="indefinite" values="0;1;0"></animate></path><text fill="#27ae60" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="400" y="250">从磁盘换入</text><rect fill="#f8f9fa" height="120" stroke="#95a5a6" stroke-dasharray="5,5" stroke-width="1" width="200" x="300" y="320"></rect><text fill="#2c3e50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="340">工作集过大</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="400" y="360">进程需要的活跃页面</text><text fill="#34495e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="400" y="380">超过了物理内存容量</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="400" y="410">↓ 导致频繁缺页中断 ↓</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="400" y="430">刚换出的页面立即需要换入</text><rect fill="#fff2f2" height="80" stroke="#e74c3c" stroke-width="2" width="200" x="50" y="500"></rect><text fill="#c0392b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="150" y="520">CPU 使用率</text><rect fill="#ecf0f1" height="20" stroke="#bdc3c7" stroke-width="1" width="160" x="70" y="530"></rect><rect fill="#e74c3c" height="20" width="40" x="70" y="530"><animate attributename="width" dur="3s" repeatcount="indefinite" values="160;40;160;40"></animate></rect><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="150" y="565">大部分时间在等待I/O</text><rect fill="#fff2f2" height="80" stroke="#e74c3c" stroke-width="2" width="200" x="550" y="500"></rect><text fill="#c0392b" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="650" y="520">系统性能</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="650" y="540">吞吐量 ↓ 响应时间 ↑</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" x="650" y="555">系统变得迟钝无响应</text><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="650" y="570">抖动现象!</text><ellipse cx="400" cy="180" fill="none" rx="80" ry="40" stroke="#e74c3c" stroke-dasharray="3,3" stroke-width="2"><animate attributename="stroke-opacity" dur="1s" repeatcount="indefinite" values="0.3;1;0.3"></animate></ellipse><text fill="#e74c3c" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="185">频繁交换区域</text></svg>