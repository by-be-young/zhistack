<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect fill="none" height="600" width="800"></rect><text fill="#2c3e50" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="30">LRU 页面置换算法</text><line stroke="#34495e" stroke-width="3" x1="100" x2="700" y1="100" y2="100"></line><text fill="#34495e" font-size="14" x="50" y="105">时间</text><g fill="#7f8c8d" font-size="12"><line stroke="#34495e" x1="700" x2="700" y1="95" y2="105"></line><text text-anchor="middle" x="695" y="120">现在</text><line stroke="#34495e" x1="550" x2="550" y1="95" y2="105"></line><text text-anchor="middle" x="545" y="120">1分钟前</text><line stroke="#34495e" x1="400" x2="400" y1="95" y2="105"></line><text text-anchor="middle" x="395" y="120">2分钟前</text><line stroke="#34495e" x1="250" x2="250" y1="95" y2="105"></line><text text-anchor="middle" x="245" y="120">3分钟前</text></g><rect fill="#ecf0f1" height="120" rx="10" stroke="#bdc3c7" stroke-width="2" width="500" x="150" y="200"></rect><text fill="#2c3e50" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="190">内存中的页面</text><g><rect fill="#3498db" height="80" rx="5" stroke="#2980b9" stroke-width="2" width="100" x="180" y="220"></rect><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="230" y="250">页面 A</text><text fill="#fff" font-size="12" text-anchor="middle" x="230" y="270">1分钟前使用</text><text fill="#fff" font-size="12" text-anchor="middle" x="230" y="285">较新</text></g><g><rect fill="#f39c12" height="80" rx="5" stroke="#e67e22" stroke-width="2" width="100" x="320" y="220"></rect><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="370" y="250">页面 B</text><text fill="#fff" font-size="12" text-anchor="middle" x="370" y="270">2分钟前使用</text><text fill="#fff" font-size="12" text-anchor="middle" x="370" y="285">中等</text></g><g><rect fill="#e74c3c" height="80" rx="5" stroke="#c0392b" stroke-width="2" width="100" x="460" y="220"></rect><text fill="#fff" font-size="18" font-weight="bold" text-anchor="middle" x="510" y="250">页面 C</text><text fill="#fff" font-size="12" text-anchor="middle" x="510" y="270">3分钟前使用</text><text fill="#fff" font-size="12" text-anchor="middle" x="510" y="285">最旧</text></g><g fill="none" stroke="#34495e" stroke-width="2"><path d="M550 130q-1e2 20-320 70" stroke="#3498db"></path><polygon fill="#3498db" points="225,195 235,205 235,200 245,200 225,185"></polygon><path d="M4e2 130q-20 30-30 70" stroke="#f39c12"></path><polygon fill="#f39c12" points="365,195 375,205 375,200 385,200 365,185"></polygon><path d="M250 130q1e2 20 260 70" stroke="#e74c3c"></path><polygon fill="#e74c3c" points="505,195 515,205 515,200 525,200 505,185"></polygon></g><rect fill="#fff" height="100" rx="10" stroke="#e74c3c" stroke-width="3" width="500" x="150" y="370"></rect><text fill="#e74c3c" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="395">LRU 算法决策</text><text fill="#2c3e50" font-size="14" text-anchor="middle" x="400" y="420">选择"最近最少使用"的页面进行替换</text><g><path d="M510 320q0 20 0 40" fill="none" stroke="#e74c3c" stroke-width="4"></path><polygon fill="#e74c3c" points="505,355 515,365 515,360 525,360 505,345"></polygon><text fill="#e74c3c" font-size="14" font-weight="bold" text-anchor="middle" x="470" y="350">被替换</text></g><text fill="#e74c3c" font-size="14" font-weight="bold" text-anchor="middle" x="400" y="445">页面C距离现在时间最远，优先被替换出内存</text><rect fill="#e8f6ff" height="80" rx="10" stroke="#3498db" stroke-width="2" width="700" x="50" y="500"></rect><text fill="#2c3e50" font-size="16" font-weight="bold" text-anchor="middle" x="400" y="525">算法原理：时间局部性</text><text fill="#34495e" font-size="13" text-anchor="middle" x="400" y="545">最近被使用的页面，在将来被再次使用的可能性更大</text><text fill="#34495e" font-size="13" text-anchor="middle" x="400" y="565">因此保留最近使用的页面，替换最久未使用的页面</text></svg>