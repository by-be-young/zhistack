<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, sans-serif" font-size="13" viewBox="0 0 940 560"><defs><marker id="arr8" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker></defs><text class="title" text-anchor="middle" x="470" y="26">改进型 Clock：基于 (R, M) 的四类页面与两轮扫描</text><g transform="translate(40,60)"><text font-weight="bold" text-anchor="middle" x="200" y="0">四类页面与淘汰优先级</text><line stroke="#444" x1="40" x2="40" y1="40" y2="320"></line><line stroke="#444" x1="40" x2="380" y1="320" y2="320"></line><text class="small" x="20" y="40">M=1</text><text class="small" x="-20" y="180">M (修改位)</text><text class="small" x="20" y="320">M=0</text><text class="small" text-anchor="middle" x="40" y="340">R=0</text><text text-anchor="middle" x="210" y="340">R (访问位)</text><text class="small" text-anchor="middle" x="380" y="340">R=1</text><rect class="c00" height="130" rx="6" width="160" x="50" y="180"></rect><text font-weight="bold" text-anchor="middle" x="130" y="208">(0, 0)</text><text class="small" text-anchor="middle" x="130" y="232">最近未访问 + 未修改</text><text class="small" text-anchor="middle" x="130" y="252">直接淘汰，无需回写</text><text fill="#1b5e20" font-weight="bold" text-anchor="middle" x="130" y="278">优先级 ① 最高</text><rect class="c10" height="130" rx="6" width="160" x="220" y="180"></rect><text font-weight="bold" text-anchor="middle" x="300" y="208">(1, 0)</text><text class="small" text-anchor="middle" x="300" y="232">最近访问过 + 未修改</text><text class="small" text-anchor="middle" x="300" y="252">活跃但无脏数据</text><text fill="#ef6c00" font-weight="bold" text-anchor="middle" x="300" y="278">优先级 ③</text><rect class="c01" height="130" rx="6" width="160" x="50" y="50"></rect><text font-weight="bold" text-anchor="middle" x="130" y="78">(0, 1)</text><text class="small" text-anchor="middle" x="130" y="102">最近未访问 + 已修改</text><text class="small" text-anchor="middle" x="130" y="122">淘汰前需写回磁盘</text><text fill="#f57f17" font-weight="bold" text-anchor="middle" x="130" y="148">优先级 ②</text><rect class="c11" height="130" rx="6" width="160" x="220" y="50"></rect><text font-weight="bold" text-anchor="middle" x="300" y="78">(1, 1)</text><text class="small" text-anchor="middle" x="300" y="102">最近访问过 + 已修改</text><text class="small" text-anchor="middle" x="300" y="122">最不该淘汰</text><text fill="#b71c1c" font-weight="bold" text-anchor="middle" x="300" y="148">优先级 ④ 最低</text></g><g transform="translate(490,60)"><text font-weight="bold" text-anchor="middle" x="200" y="0">两轮（最多四轮）扫描流程</text><rect fill="#e8f5e9" height="60" rx="6" stroke="#2e7d32" width="400" x="0" y="20"></rect><text font-weight="bold" text-anchor="middle" x="200" y="44">第 1 轮：找 (0, 0)</text><text class="small" text-anchor="middle" x="200" y="64">扫描时不修改任何位；找到立刻淘汰</text><rect fill="#fff8e1" height="60" rx="6" stroke="#f57f17" width="400" x="0" y="100"></rect><text font-weight="bold" text-anchor="middle" x="200" y="124">第 2 轮：找 (0, 1)</text><text class="small" text-anchor="middle" x="200" y="144">仍未访问但脏 → 淘汰且写回；本轮把扫过的 R 清零</text><rect fill="#e3f2fd" height="60" rx="6" stroke="#1565c0" width="400" x="0" y="180"></rect><text font-weight="bold" text-anchor="middle" x="200" y="204">第 3 轮：再找 (0, 0)</text><text class="small" text-anchor="middle" x="200" y="224">经过清零，原来的 (1, 0) 此刻变 (0, 0)</text><rect fill="#fce4ec" height="60" rx="6" stroke="#ad1457" width="400" x="0" y="260"></rect><text font-weight="bold" text-anchor="middle" x="200" y="284">第 4 轮：再找 (0, 1)</text><text class="small" text-anchor="middle" x="200" y="304">原 (1, 1) 此刻已变 (0, 1) → 写回后淘汰</text><path d="M2e2 80v20" marker-end="url(#arr8)" stroke="#333"></path><path d="M2e2 160v20" marker-end="url(#arr8)" stroke="#333"></path><path d="M2e2 240v20" marker-end="url(#arr8)" stroke="#333"></path></g><g transform="translate(40,420)"><rect fill="#fafafa" height="120" rx="6" stroke="#bbb" width="860" x="0" y="0"></rect><text font-weight="bold" x="14" y="22">核心思想</text><text class="small" x="14" y="44">• 在简单 Clock 的 R 之外引入 M，把 “是否脏” 纳入淘汰排序，减少不必要的磁盘写回。</text><text class="small" x="14" y="64">• 优先级 (0,0) &gt; (0,1) &gt; (1,0) &gt; (1,1) ：先选既不活跃又干净的，再退一步选脏但不活跃的。</text><text class="small" x="14" y="84">• 通过 “第二轮清零 R” 让活跃页 (1,*) 逐步降级，避免找不到可淘汰页时无限循环。</text><text class="small" x="14" y="104">• R 由硬件 / OS 在每次访问时置 1；M 由硬件 / OS 在写操作时置 1，写回磁盘后清 0。</text></g></svg>