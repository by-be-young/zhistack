<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"><text fill="#2563eb" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="25">内存置换策略</text><g><rect fill="#dc2626" height="30" rx="5" width="300" x="50" y="50"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="200" y="70">局部置换 (Local Replacement)</text><text fill="#991b1b" font-size="12" font-weight="bold" x="60" y="105">初始状态 - 物理内存</text><g transform="translate(60, 110)"><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="20" y="22">A1</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="40" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="22">A2</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="80" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="100" y="22">A3</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="130" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="150" y="22">B1</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="170" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="190" y="22">B2</text><rect fill="#bbf7d0" height="35" stroke="#059669" stroke-width="2" width="40" x="220" y="0"></rect><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="22">C1</text><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="50">进程A</text><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="180" y="50">进程B</text><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="50">进程C</text></g><text fill="#991b1b" font-size="12" font-weight="bold" x="60" y="190">进程A发生缺页，需要载入A4</text><g transform="translate(60, 195)"><rect fill="#fed7d7" height="35" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="20" y="22">A4</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="40" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="22">A2</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="80" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="100" y="22">A3</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="130" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="150" y="22">B1</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="170" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="190" y="22">B2</text><rect fill="#bbf7d0" height="35" stroke="#059669" stroke-width="2" width="40" x="220" y="0"></rect><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="22">C1</text><text fill="#ef4444" font-size="9" text-anchor="middle" x="20" y="50">A1被A4置换</text><text fill="#1d4ed8" font-size="9" text-anchor="middle" x="180" y="50">不受影响</text><text fill="#047857" font-size="9" text-anchor="middle" x="240" y="50">不受影响</text></g><rect fill="#fef2f2" height="50" rx="5" stroke="#fecaca" stroke-width="1" width="280" x="60" y="265"></rect><text fill="#991b1b" font-size="11" x="70" y="285">• 只在进程自身页面内选择置换</text><text fill="#991b1b" font-size="11" x="70" y="300">• 不影响其他进程的内存页面</text></g><line stroke="#e2e8f0" stroke-width="2" x1="400" x2="400" y1="50" y2="550"></line><g><rect fill="#7c3aed" height="30" rx="5" width="300" x="450" y="50"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="600" y="70">全局置换 (Global Replacement)</text><text fill="#6b21a8" font-size="12" font-weight="bold" x="460" y="105">初始状态 - 物理内存</text><g transform="translate(460, 110)"><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="20" y="22">A1</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="40" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="22">A2</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="80" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="100" y="22">A3</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="130" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="150" y="22">B1</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="170" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="190" y="22">B2</text><rect fill="#bbf7d0" height="35" stroke="#059669" stroke-width="2" width="40" x="220" y="0"></rect><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="22">C1</text><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="50">进程A</text><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="180" y="50">进程B</text><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="50">进程C</text></g><text fill="#6b21a8" font-size="12" font-weight="bold" x="460" y="190">进程A发生缺页，需要载入A4</text><g transform="translate(460, 195)"><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="0" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="20" y="22">A1</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="40" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="60" y="22">A2</text><rect fill="#fecaca" height="35" stroke="#dc2626" stroke-width="2" width="40" x="80" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="100" y="22">A3</text><rect fill="#fed7d7" height="35" stroke="#dc2626" stroke-dasharray="3,3" stroke-width="2" width="40" x="130" y="0"></rect><text fill="#991b1b" font-size="10" text-anchor="middle" x="150" y="22">A4</text><rect fill="#bfdbfe" height="35" stroke="#2563eb" stroke-width="2" width="40" x="170" y="0"></rect><text fill="#1d4ed8" font-size="10" text-anchor="middle" x="190" y="22">B2</text><rect fill="#bbf7d0" height="35" stroke="#059669" stroke-width="2" width="40" x="220" y="0"></rect><text fill="#047857" font-size="10" text-anchor="middle" x="240" y="22">C1</text><text fill="#991b1b" font-size="9" text-anchor="middle" x="60" y="50">不受影响</text><text fill="#a855f7" font-size="9" text-anchor="middle" x="150" y="50">B1被A4置换</text><text fill="#1d4ed8" font-size="9" text-anchor="middle" x="215" y="50">B2</text><text fill="#047857" font-size="9" text-anchor="middle" x="240" y="50">C1</text></g><g transform="translate(460, 260)"><rect fill="none" height="20" stroke="#a855f7" stroke-dasharray="5,5" stroke-width="2" width="260" x="0" y="0"></rect><text fill="#a855f7" font-size="10" text-anchor="middle" x="130" y="35">全局选择范围 - 可以选择任何进程的页面</text></g><rect fill="#faf5ff" height="50" rx="5" stroke="#e9d5ff" stroke-width="1" width="280" x="460" y="305"></rect><text fill="#6b21a8" font-size="11" x="470" y="325">• 可在整个系统内存中选择置换</text><text fill="#6b21a8" font-size="11" x="470" y="340">• 一个进程的缺页可能影响其他进程</text></g><g transform="translate(50, 380)"><rect fill="#f8fafc" height="120" rx="10" stroke="#cbd5e1" stroke-width="2" width="700" x="0" y="0"></rect><text fill="#334155" font-size="14" font-weight="bold" text-anchor="middle" x="350" y="25">策略对比</text><g transform="translate(20, 40)"><text fill="#dc2626" font-size="12" font-weight="bold" x="0" y="0">局部置换:</text><text fill="#059669" font-size="10" x="0" y="18">✓ 进程间相互独立，不会互相干扰</text><text fill="#059669" font-size="10" x="0" y="32">✓ 每个进程的性能相对稳定</text><text fill="#dc2626" font-size="10" x="0" y="46">✗ 可能导致内存利用率较低</text><text fill="#dc2626" font-size="10" x="0" y="60">✗ 无法充分利用全局最优策略</text></g><g transform="translate(360, 40)"><text fill="#7c3aed" font-size="12" font-weight="bold" x="0" y="0">全局置换:</text><text fill="#059669" font-size="10" x="0" y="18">✓ 系统整体内存利用率更高</text><text fill="#059669" font-size="10" x="0" y="32">✓ 可以实现全局最优的置换策略</text><text fill="#dc2626" font-size="10" x="0" y="46">✗ 进程间会相互影响</text><text fill="#dc2626" font-size="10" x="0" y="60">✗ 可能导致某些进程性能不稳定</text></g></g><rect fill="#f1f5f9" height="35" rx="5" stroke="#cbd5e1" stroke-width="1" width="700" x="50" y="520"></rect><text fill="#334155" font-size="12" font-weight="bold" x="60" y="540">总结: 局部置换保证进程独立性，全局置换提高系统整体效率</text></svg>