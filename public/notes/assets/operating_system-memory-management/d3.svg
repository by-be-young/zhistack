<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><text fill="#2563eb" font-size="20" font-weight="bold" text-anchor="middle" x="400" y="25">内存分配策略</text><g><rect fill="#3b82f6" height="30" rx="5" width="320" x="50" y="50"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="210" y="70">固定分配</text><text fill="#1e40af" font-size="12" font-weight="bold" x="60" y="105">相同大小分区</text><g transform="translate(60, 110)"><rect fill="#dbeafe" height="40" stroke="#3b82f6" stroke-width="2" width="50" x="0" y="0"></rect><rect fill="#fef3c7" height="40" stroke="#3b82f6" stroke-width="2" width="50" x="50" y="0"></rect><rect fill="#dcfce7" height="40" stroke="#3b82f6" stroke-width="2" width="50" x="100" y="0"></rect><rect fill="#fce7f3" height="40" stroke="#3b82f6" stroke-width="2" width="50" x="150" y="0"></rect><rect fill="#f3e8ff" height="40" stroke="#3b82f6" stroke-width="2" width="50" x="200" y="0"></rect><text fill="#374151" font-size="10" text-anchor="middle" x="125" y="55">每个区块大小相同</text><text fill="#1e40af" font-size="10" text-anchor="middle" x="25" y="25">程序A</text><text fill="#b45309" font-size="10" text-anchor="middle" x="75" y="25">程序B</text><text fill="#166534" font-size="10" text-anchor="middle" x="125" y="25">程序C</text><text fill="#be185d" font-size="10" text-anchor="middle" x="175" y="25">空闲</text><text fill="#7c3aed" font-size="10" text-anchor="middle" x="225" y="25">空闲</text></g><text fill="#1e40af" font-size="12" font-weight="bold" x="60" y="185">不同大小分区</text><g transform="translate(60, 190)"><rect fill="#dbeafe" height="40" stroke="#3b82f6" stroke-width="2" width="80" x="0" y="0"></rect><rect fill="#fef3c7" height="40" stroke="#3b82f6" stroke-width="2" width="60" x="80" y="0"></rect><rect fill="#dcfce7" height="40" stroke="#3b82f6" stroke-width="2" width="40" x="140" y="0"></rect><rect fill="#fce7f3" height="40" stroke="#3b82f6" stroke-width="2" width="70" x="180" y="0"></rect><text fill="#374151" font-size="10" text-anchor="middle" x="125" y="55">区块大小可以不同</text><text fill="#1e40af" font-size="10" text-anchor="middle" x="40" y="25">程序A</text><text fill="#b45309" font-size="10" text-anchor="middle" x="110" y="25">程序B</text><text fill="#166534" font-size="10" text-anchor="middle" x="160" y="25">程序C</text><text fill="#be185d" font-size="10" text-anchor="middle" x="215" y="25">空闲</text></g><rect fill="#f8fafc" height="50" rx="5" stroke="#cbd5e1" stroke-width="1" width="300" x="60" y="260"></rect><text fill="#475569" font-size="11" x="70" y="280">• 内存被预先划分为固定区块</text><text fill="#475569" font-size="11" x="70" y="295">• 程序分配到固定大小的区块中</text></g><line stroke="#e2e8f0" stroke-width="2" x1="400" x2="400" y1="50" y2="450"></line><g><rect fill="#10b981" height="30" rx="5" width="320" x="430" y="50"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="590" y="70">可变分配</text><text fill="#047857" font-size="12" font-weight="bold" x="440" y="105">初始状态</text><g transform="translate(440, 110)"><rect fill="#f0fdf4" height="40" stroke="#10b981" stroke-width="2" width="280" x="0" y="0"></rect><text fill="#047857" font-size="10" text-anchor="middle" x="140" y="25">空闲内存</text></g><text fill="#047857" font-size="12" font-weight="bold" x="440" y="185">动态分配后</text><g transform="translate(440, 190)"><rect fill="#bfdbfe" height="40" stroke="#10b981" stroke-width="2" width="90" x="0" y="0"></rect><rect fill="#fed7aa" height="40" stroke="#10b981" stroke-width="2" width="70" x="90" y="0"></rect><rect fill="#bbf7d0" height="40" stroke="#10b981" stroke-width="2" width="50" x="160" y="0"></rect><rect fill="#f0fdf4" height="40" stroke="#10b981" stroke-width="2" width="70" x="210" y="0"></rect><text fill="#1e40af" font-size="10" text-anchor="middle" x="45" y="25">程序A (90MB)</text><text fill="#ea580c" font-size="10" text-anchor="middle" x="125" y="25">程序B (70MB)</text><text fill="#059669" font-size="10" text-anchor="middle" x="185" y="25">程序C</text><text fill="#047857" font-size="10" text-anchor="middle" x="245" y="25">剩余空闲</text></g><text fill="#047857" font-size="12" font-weight="bold" x="440" y="265">程序B结束，内存释放</text><g transform="translate(440, 270)"><rect fill="#bfdbfe" height="40" stroke="#10b981" stroke-width="2" width="90" x="0" y="0"></rect><rect fill="#f0fdf4" height="40" stroke="#10b981" stroke-width="2" width="70" x="90" y="0"></rect><rect fill="#bbf7d0" height="40" stroke="#10b981" stroke-width="2" width="50" x="160" y="0"></rect><rect fill="#f0fdf4" height="40" stroke="#10b981" stroke-width="2" width="70" x="210" y="0"></rect><text fill="#1e40af" font-size="10" text-anchor="middle" x="45" y="25">程序A</text><text fill="#047857" font-size="10" text-anchor="middle" x="125" y="25">空闲</text><text fill="#059669" font-size="10" text-anchor="middle" x="185" y="25">程序C</text><text fill="#047857" font-size="10" text-anchor="middle" x="245" y="25">空闲</text></g><rect fill="#f0fdf4" height="65" rx="5" stroke="#bbf7d0" stroke-width="1" width="300" x="440" y="340"></rect><text fill="#047857" font-size="11" x="450" y="360">• 根据程序需求动态分配内存</text><text fill="#047857" font-size="11" x="450" y="375">• 内存利用率更高</text><text fill="#047857" font-size="11" x="450" y="390">• 分配和释放更灵活</text></g><g transform="translate(380, 430)"><path d="M0 0 15-8v5H40V3H15V8z" fill="#6b7280"></path><text alignment-baseline="middle" fill="#6b7280" font-size="11" x="45" y="0">对比</text></g><rect fill="#f1f5f9" height="35" rx="5" stroke="#cbd5e1" stroke-width="1" width="700" x="50" y="450"></rect><text fill="#334155" font-size="12" font-weight="bold" x="60" y="470">总结: 固定分配简单但可能浪费内存，可变分配更灵活但管理复杂</text></svg>