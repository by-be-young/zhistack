<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="13" viewBox="0 0 860 560"><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#aaa"></path></marker></defs><rect fill="#fafafa" height="72" rx="6" stroke="#ddd" width="800" x="30" y="18"></rect><rect fill="#fff4e0" height="20" rx="3" stroke="#e2954a" width="66" x="148" y="30"></rect><text class="h" fill="#b45309" font-size="12" text-anchor="middle" x="181" y="44">Intel</text><text class="mono" text-anchor="middle" x="185" y="68">mov<tspan class="op">eax</tspan>,<tspan class="reg">ebx</tspan></text><text class="cmt" text-anchor="middle" x="185" y="84">; 目的 ← 源</text><path class="arrow" d="M4e2 54h60"></path><rect fill="#e8f7e8" height="20" rx="3" stroke="#4ea84e" width="66" x="596" y="30"></rect><text class="h" fill="#166534" font-size="12" text-anchor="middle" x="630" y="44">AT&amp;T</text><text class="mono" text-anchor="middle" x="630" y="65">movl<tspan class="reg">%ebx</tspan>,<tspan class="op">%eax</tspan></text><text class="cmt" text-anchor="middle" x="630" y="81">; 源 → 目的</text><rect fill="#f0f0f0" height="32" rx="4" stroke="#ccc" width="800" x="30" y="106"></rect><text class="h" font-size="13" text-anchor="middle" x="170" y="127">特性</text><line stroke="#ccc" x1="310" x2="310" y1="106" y2="138"></line><line stroke="#ccc" x1="590" x2="590" y1="106" y2="138"></line><text class="h" fill="#b45309" font-size="13" text-anchor="middle" x="450" y="127">Intel 格式</text><text class="h" fill="#166534" font-size="13" text-anchor="middle" x="710" y="127">AT&amp;T 格式</text><line stroke="#ccc" x1="310" x2="310" y1="138" y2="406"></line><line stroke="#ddd" stroke-dasharray="4,3" x1="590" x2="590" y1="106" y2="406"></line><rect fill="#fffdf7" height="44" stroke="#eee" width="800" x="30" y="138"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="158">操作数顺序</text><text class="mono" text-anchor="middle" x="450" y="156">目的, 源</text><text class="cmt" text-anchor="middle" x="450" y="172">mov eax, ebx</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="156">源, 目的</text><text class="cmt" text-anchor="middle" x="710" y="172">movl %ebx, %eax</text><rect fill="#f9f9f9" height="44" stroke="#eee" width="800" x="30" y="182"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="202">寄存器</text><text class="mono" text-anchor="middle" x="450" y="200">eax ebx ecx</text><text class="cmt" text-anchor="middle" x="450" y="215">直接写寄存器名</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="200">%eax %ebx %ecx</text><text class="cmt" text-anchor="middle" x="710" y="215">前缀<tspan fill="#b91c4a">%</tspan></text><rect fill="#fffdf7" height="44" stroke="#eee" width="800" x="30" y="226"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="246">立即数</text><text class="mono" text-anchor="middle" x="450" y="244">10 0x20</text><text class="cmt" text-anchor="middle" x="450" y="259">直接写数值</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="244">$10 $0x20</text><text class="cmt" text-anchor="middle" x="710" y="259">前缀<tspan fill="#b91c4a">$</tspan></text><rect fill="#f9f9f9" height="44" stroke="#eee" width="800" x="30" y="270"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="290">内存操作数</text><text class="mono" text-anchor="middle" x="450" y="288">[ebx + ecx*4 + 8]</text><text class="cmt" text-anchor="middle" x="450" y="303">方括号 [ ]</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="288">8(%ebx, %ecx, 4)</text><text class="cmt" text-anchor="middle" x="710" y="303">圆括号 ( )，偏移量前置</text><rect fill="#fffdf7" height="44" stroke="#eee" width="800" x="30" y="314"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="334">操作数长度</text><text class="mono" text-anchor="middle" x="450" y="332">由寄存器名决定</text><text class="cmt" text-anchor="middle" x="450" y="347">eax→32位, ax→16位</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="332">指令后缀 b/w/l/q</text><text class="cmt" text-anchor="middle" x="710" y="347">movb / movw / movl / movq</text><rect fill="#f9f9f9" height="44" stroke="#eee" width="800" x="30" y="358"></rect><text class="h" font-size="12" text-anchor="middle" x="170" y="378">注释符号</text><text class="mono" text-anchor="middle" x="450" y="378">; 分号</text><text class="mono" fill="#166534" text-anchor="middle" x="710" y="378"># 井号</text><rect fill="none" height="296" rx="4" stroke="#ccc" stroke-width="1.2" width="800" x="30" y="106"></rect><rect fill="#f8f8ff" height="118" rx="6" stroke="#c7d2fe" width="800" x="30" y="422"></rect><text class="h" fill="#3730a3" font-size="13" text-anchor="middle" x="430" y="442">内存寻址格式对照</text><rect fill="#fff4e0" height="18" rx="3" stroke="#e2954a" width="55" x="48" y="450"></rect><text class="h" fill="#b45309" font-size="11" text-anchor="middle" x="75" y="463">Intel</text><text class="mono" x="116" y="463">[<tspan class="reg">基址</tspan>+<tspan class="reg">变址</tspan>×<tspan class="imm">比例</tspan>+<tspan class="mem">偏移</tspan>]</text><text class="mono" x="116" y="479">[<tspan class="reg">ebx</tspan>+<tspan class="reg">ecx</tspan>×<tspan class="imm">4</tspan>+<tspan class="mem">8</tspan>]</text><text class="mono" text-anchor="middle" x="580" y="463">EA = (<tspan class="reg">EBX</tspan>) + (<tspan class="reg">ECX</tspan>) ×<tspan class="imm">4</tspan>+<tspan class="mem">8</tspan></text><text class="cmt" text-anchor="middle" x="580" y="479">两种格式计算结果相同，仅写法不同</text><line stroke="#c7d2fe" stroke-dasharray="4,3" x1="48" x2="812" y1="492" y2="492"></line><rect fill="#e8f7e8" height="18" rx="3" stroke="#4ea84e" width="55" x="48" y="498"></rect><text class="h" fill="#166534" font-size="11" text-anchor="middle" x="75" y="511">AT&amp;T</text><text class="mono" x="116" y="511"><tspan class="mem">偏移</tspan>(<tspan class="reg">基址</tspan>,<tspan class="reg">变址</tspan>,<tspan class="imm">比例</tspan>)</text><text class="mono" x="116" y="527"><tspan class="mem">8</tspan>(<tspan class="reg">%ebx</tspan>,<tspan class="reg">%ecx</tspan>,<tspan class="imm">4</tspan>)</text></svg>