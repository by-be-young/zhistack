<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="12" viewBox="0 0 900 460"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#888"></path></marker></defs><text class="h" font-size="16" text-anchor="middle" x="450" y="26">同一段 C 代码在 CISC (x86) 与 RISC (MIPS) 上的指令对照</text><g><rect class="src" height="80" rx="6" width="220" x="340" y="50"></rect><text class="h" text-anchor="middle" x="450" y="70">C 源代码</text><text class="mono s1" x="350" y="92">for (i = 0; i &lt; 24; i++)</text><text class="mono s2" x="350" y="108">for (j = 0; j &lt; 24; j++)</text><text class="mono s3" x="350" y="124">a[i][j] = 10;</text></g><path class="arrow" d="M4e2 130 220 170"></path><path class="arrow" d="M5e2 130l180 40"></path><g><rect class="col cisc" height="270" rx="6" width="380" x="40" y="170"></rect><text class="h" text-anchor="middle" x="230" y="192">CISC · Intel x86</text><text class="lbl" text-anchor="middle" x="230" y="208">单条指令可访存 + 复杂寻址</text><g class="mono"><text class="s1" x="55" y="235">mov dword ptr [ebp-8], 0<tspan class="cmt">; i = 0</tspan></text><text class="s1" x="55" y="253">jmp loop_chk_i</text><text class="s1" x="55" y="271">mov eax, [ebp-8]<tspan class="cmt">; load i</tspan></text><text class="s1" x="55" y="289">cmp eax, 24</text><text class="s1" x="55" y="307">jge end_i</text><text class="s2" x="55" y="325">mov dword ptr [ebp-4], 0<tspan class="cmt">; j = 0</tspan></text><text class="s3" x="55" y="343">mov dword ptr [ecx+edx*4+0x422000], 10</text><text x="55" y="361"><tspan class="cmt">; 一条指令完成寻址+赋值</tspan></text><text class="s2" x="55" y="385">inc dword ptr [ebp-4]<tspan class="cmt">; j++</tspan></text><text class="s1" x="55" y="403">inc dword ptr [ebp-8]<tspan class="cmt">; i++</tspan></text></g><text class="lbl" x="55" y="430">特点：复杂寻址模式、变长指令、单指令多步操作</text></g><g><rect class="col risc" height="270" rx="6" width="380" x="500" y="170"></rect><text class="h" text-anchor="middle" x="690" y="192">RISC · MIPS</text><text class="lbl" text-anchor="middle" x="690" y="208">load/store 架构，寻址需多条指令</text><g class="mono"><text class="s1" x="515" y="235">addi $v0, $zero, 0<tspan class="cmt">; i = 0</tspan></text><text class="s1" x="515" y="253">j loop_chk_i</text><text class="s1" x="515" y="271">lw $v1, 8($fp)<tspan class="cmt">; load i</tspan></text><text class="s1" x="515" y="289">bge $v1, 24, end_i</text><text class="s2" x="515" y="307">addi $a0, $zero, 0<tspan class="cmt">; j = 0</tspan></text><text class="s3" x="515" y="325">sll $v1, $v1, 6<tspan class="cmt">; i * 64</tspan></text><text class="s3" x="515" y="343">add $v1, $v1, $a0<tspan class="cmt">; + j</tspan></text><text class="s3" x="515" y="361">sll $v1, $v1, 2<tspan class="cmt">; * 4</tspan></text><text class="s3" x="515" y="379">lui $at, 0x0042<tspan class="cmt">; 高 16 位基址</tspan></text><text class="s3" x="515" y="397">ori $v0, $at, 0x2000<tspan class="cmt">; 拼出完整地址</tspan></text><text class="s3" x="515" y="415">add $v0, $v1, $v0</text><text class="s3" x="515" y="433">li $a1, 10 / sw $a1, 0($v0)</text></g></g></svg>