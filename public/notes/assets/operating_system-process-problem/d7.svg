<svg xmlns="http://www.w3.org/2000/svg" height="1e3" viewBox="0 0 800 1e3" width="800"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#424242" points="0 0, 10 3, 0 6"></polygon></marker><marker id="arrowhead-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><polygon fill="#757575" points="0 0, 10 3, 0 6"></polygon></marker></defs><text class="title-text" x="400" y="30">哲学家就餐问题流程图（非对称解法）</text><ellipse class="process-box" cx="400" cy="80" rx="60" ry="30"></ellipse><text class="text" x="400" y="85">开始</text><path class="arrow" d="M4e2 110v30"></path><path class="decision-box" d="M4e2 150l80 40-80 40-80-40z"></path><text class="text" x="400" y="185">判断哲学家</text><text class="text" x="400" y="200">编号 i</text><path class="arrow" d="M320 190H250"></path><text class="text" font-size="12" x="270" y="180">i &lt; N-1</text><path class="arrow" d="M480 190h70"></path><text class="text" font-size="12" x="515" y="180">i = N-1</text><g id="left-branch"><rect class="action-box" height="40" rx="5" width="100" x="170" y="220"></rect><text class="text" x="220" y="245">思考</text><path class="arrow" d="M220 260v30"></path><rect class="critical-box" height="50" rx="5" width="120" x="160" y="290"></rect><text class="text" x="220" y="310">P(fork[i])</text><text class="text" font-size="12" x="220" y="325">拿左叉子</text><path class="arrow" d="M220 340v30"></path><rect class="critical-box" height="50" rx="5" width="120" x="160" y="370"></rect><text class="text" x="220" y="390">P(fork[(i+1)%N])</text><text class="text" font-size="12" x="220" y="405">拿右叉子</text><path class="arrow" d="M220 420v30"></path><rect class="action-box" height="60" rx="5" width="140" x="150" y="450"></rect><text class="text" x="220" y="475">吃饭</text><text class="text" font-size="12" x="220" y="495">（临界区）</text><path class="arrow" d="M220 510v30"></path><rect class="process-box" height="50" rx="5" width="120" x="160" y="540"></rect><text class="text" x="220" y="560">V(fork[i])</text><text class="text" font-size="12" x="220" y="575">放左叉子</text><path class="arrow" d="M220 590v30"></path><rect class="process-box" height="50" rx="5" width="120" x="160" y="620"></rect><text class="text" x="220" y="640">V(fork[(i+1)%N])</text><text class="text" font-size="12" x="220" y="655">放右叉子</text><path class="arrow" d="M220 670v30H120V240h50"></path></g><g id="right-branch"><rect class="action-box" height="40" rx="5" width="100" x="530" y="220"></rect><text class="text" x="580" y="245">思考</text><path class="arrow" d="M580 260v30"></path><rect class="critical-box" height="50" rx="5" width="120" x="520" y="290"></rect><text class="text" x="580" y="310">P(fork[(i+1)%N])</text><text class="text" font-size="12" x="580" y="325">拿右叉子</text><path class="arrow" d="M580 340v30"></path><rect class="critical-box" height="50" rx="5" width="120" x="520" y="370"></rect><text class="text" x="580" y="390">P(fork[i])</text><text class="text" font-size="12" x="580" y="405">拿左叉子</text><path class="arrow" d="M580 420v30"></path><rect class="action-box" height="60" rx="5" width="140" x="510" y="450"></rect><text class="text" x="580" y="475">吃饭</text><text class="text" font-size="12" x="580" y="495">（临界区）</text><path class="arrow" d="M580 510v30"></path><rect class="process-box" height="50" rx="5" width="120" x="520" y="540"></rect><text class="text" x="580" y="560">V(fork[(i+1)%N])</text><text class="text" font-size="12" x="580" y="575">放右叉子</text><path class="arrow" d="M580 590v30"></path><rect class="process-box" height="50" rx="5" width="120" x="520" y="620"></rect><text class="text" x="580" y="640">V(fork[i])</text><text class="text" font-size="12" x="580" y="655">放左叉子</text><path class="arrow" d="M580 670v30H680V240H630"></path></g><g id="annotations"><rect fill="#f5f5f5" height="180" rx="5" stroke="#9e9e9e" stroke-width="1" width="350" x="20" y="780"></rect><text class="text" font-weight="bold" x="195" y="805">前 N-1 个哲学家策略</text><text class="text" font-size="13" text-anchor="start" x="180" y="830">1. 先拿左边的叉子 (fork[i])</text><text class="text" font-size="13" text-anchor="start" x="180" y="855">2. 再拿右边的叉子 (fork[(i+1)%N])</text><text class="text" font-size="13" text-anchor="start" x="180" y="880">3. 进餐</text><text class="text" font-size="13" text-anchor="start" x="180" y="905">4. 按相同顺序放下叉子</text><text class="text" font-size="13" text-anchor="start" x="180" y="935">✓ 顺时针获取资源</text><rect fill="#f5f5f5" height="180" rx="5" stroke="#9e9e9e" stroke-width="1" width="350" x="430" y="780"></rect><text class="text" font-weight="bold" x="605" y="805">最后一个哲学家策略</text><text class="text" font-size="13" text-anchor="start" x="590" y="830">1. 先拿右边的叉子 (fork[(i+1)%N])</text><text class="text" font-size="13" text-anchor="start" x="590" y="855">2. 再拿左边的叉子 (fork[i])</text><text class="text" font-size="13" text-anchor="start" x="590" y="880">3. 进餐</text><text class="text" font-size="13" text-anchor="start" x="590" y="905">4. 按相同顺序放下叉子</text><text class="text" font-size="13" text-anchor="start" x="590" y="935">✓ 逆时针获取资源（打破循环等待）</text></g><rect fill="#ffecb3" height="30" rx="5" stroke="#ffa726" stroke-width="1" width="400" x="200" y="730"></rect><text class="text" font-weight="bold" x="400" y="750">关键：非对称策略避免了循环等待，从而防止死锁</text></svg>