<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, sans-serif" font-size="13" viewBox="0 0 900 620"><defs><marker id="arr2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker></defs><text class="title" text-anchor="middle" x="450" y="26">同步问题解题模板（信号量法）</text><rect class="step" height="70" rx="8" width="220" x="40" y="60"></rect><text font-weight="bold" text-anchor="middle" x="150" y="86">① 找进程与循环结构</text><text class="small" text-anchor="middle" x="150" y="106">把题中角色 → 进程</text><text class="small" text-anchor="middle" x="150" y="122">反复行为套 while(1)</text><rect class="step" height="70" rx="8" width="220" x="340" y="60"></rect><text font-weight="bold" text-anchor="middle" x="450" y="86">② 找互斥关系</text><text class="small" text-anchor="middle" x="450" y="106">共享同一资源 + 同时仅一个</text><text class="small" text-anchor="middle" x="450" y="122">→ 互斥信号量（初值 1）</text><rect class="step" height="70" rx="8" width="220" x="640" y="60"></rect><text font-weight="bold" text-anchor="middle" x="750" y="86">③ 找同步关系</text><text class="small" text-anchor="middle" x="750" y="106">动作 A 必须先于 B</text><text class="small" text-anchor="middle" x="750" y="122">→ 同步信号量（初值 0）</text><rect class="step" height="70" rx="8" width="220" x="640" y="170"></rect><text font-weight="bold" text-anchor="middle" x="750" y="196">④ 找资源数量约束</text><text class="small" text-anchor="middle" x="750" y="216">缓冲区 / 座位 / 设备</text><text class="small" text-anchor="middle" x="750" y="232">→ 资源信号量（初值=容量）</text><rect class="step" height="70" rx="8" width="220" x="340" y="170"></rect><text font-weight="bold" text-anchor="middle" x="450" y="196">⑤ 写 P/V 伪代码</text><text class="small" text-anchor="middle" x="450" y="216">先资源信号量，后互斥信号量</text><text class="small" text-anchor="middle" x="450" y="232">V 顺序通常对称即可</text><rect class="step" height="70" rx="8" width="220" x="40" y="170"></rect><text font-weight="bold" text-anchor="middle" x="150" y="196">⑥ 自检</text><text class="small" text-anchor="middle" x="150" y="216">P/V 成对、方向一致</text><text class="small" text-anchor="middle" x="150" y="232">无死锁、覆盖全部角色</text><path class="arr" d="M260 95h80" marker-end="url(#arr2)"></path><path class="arr" d="M560 95h80" marker-end="url(#arr2)"></path><path class="arr" d="M750 130v40" marker-end="url(#arr2)"></path><path class="arr" d="M640 205H560" marker-end="url(#arr2)"></path><path class="arr" d="M340 205H260" marker-end="url(#arr2)"></path><rect class="qbox" height="60" rx="8" width="220" x="340" y="280"></rect><text font-weight="bold" text-anchor="middle" x="450" y="305">三类信号量怎么选？</text><text class="small" text-anchor="middle" x="450" y="325">按 “保护对象” 划分</text><rect class="out" height="180" rx="8" width="240" x="40" y="380"></rect><text font-weight="bold" text-anchor="middle" x="160" y="402">互斥信号量</text><text class="small" text-anchor="middle" x="160" y="422">初值 1</text><text x="60" y="448">保护对象：临界资源</text><text x="60" y="470">命名：mutex, rw, fork[i]</text><text font-family="Menlo,monospace" font-size="11" x="60" y="492">P(mutex);</text><text font-family="Menlo,monospace" font-size="11" x="60" y="508">// 临界区</text><text font-family="Menlo,monospace" font-size="11" x="60" y="524">V(mutex);</text><text class="small" fill="#c62828" x="60" y="548">紧贴临界区，不要包多</text><rect class="out" height="180" rx="8" width="240" x="320" y="380"></rect><text font-weight="bold" text-anchor="middle" x="440" y="402">同步信号量</text><text class="small" text-anchor="middle" x="440" y="422">初值 0</text><text x="340" y="448">保护对象：事件先后</text><text x="340" y="470">命名：s, done, ready</text><text font-family="Menlo,monospace" font-size="11" x="340" y="492">A: ... V(s);</text><text font-family="Menlo,monospace" font-size="11" x="340" y="508">B: P(s); ...</text><text class="small" x="340" y="524">前驱关系一条边 → 一个信号量</text><text class="small" fill="#c62828" x="340" y="548">谁等谁 P，谁完成谁 V</text><rect class="out" height="180" rx="8" width="240" x="600" y="380"></rect><text font-weight="bold" text-anchor="middle" x="720" y="402">资源信号量</text><text class="small" text-anchor="middle" x="720" y="422">初值=资源总数 n</text><text x="620" y="448">保护对象：可数资源</text><text x="620" y="470">命名：empty, full, seat</text><text font-family="Menlo,monospace" font-size="11" x="620" y="492">P(empty); P(mutex);</text><text font-family="Menlo,monospace" font-size="11" x="620" y="508">// 放数据</text><text font-family="Menlo,monospace" font-size="11" x="620" y="524">V(mutex); V(full);</text><text class="small" fill="#c62828" x="620" y="548">先资源、后互斥，防死锁</text><path class="arr" d="M450 340 160 380" marker-end="url(#arr2)"></path><path class="arr" d="M450 340l-10 40" marker-end="url(#arr2)"></path><path class="arr" d="M450 340l270 40" marker-end="url(#arr2)"></path><path class="arr" d="M150 240l3e2 40" marker-end="url(#arr2)"></path><text class="small" text-anchor="middle" x="450" y="600">核心：自然语言 → 互斥关系/前驱关系/资源约束 → 三类信号量与 P/V 顺序</text></svg>