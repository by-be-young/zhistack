<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 760 400"><defs><radialgradient cx="50%" cy="50%" id="platter" r="50%"><stop offset="0" stop-color="#f1f5f9"></stop><stop offset="70%" stop-color="#cbd5e1"></stop><stop offset="100%" stop-color="#94a3b8"></stop></radialgradient><lineargradient id="head" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7c3aed"></stop><stop offset="100%" stop-color="#a78bfa"></stop></lineargradient><filter height="140%" id="sh" width="140%" x="-20%" y="-20%"><fedropshadow dx="0" dy="2" flood-opacity=".18" stddeviation="2"></fedropshadow></filter></defs><text fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle" x="380" y="32">多个读写请求分布在不同磁道上</text><text fill="#64748b" font-size="12.5" text-anchor="middle" x="380" y="54">磁头每次只能处理一个请求 — 服务顺序直接影响寻道开销</text><g filter="url(#sh)" transform="translate(230,240)"><circle fill="url(#platter)" r="130" stroke="#64748b" stroke-width="1.5"></circle><g fill="none" opacity=".7" stroke="#94a3b8" stroke-dasharray="2 3" stroke-width=".8"><circle r="115"></circle><circle r="100"></circle><circle r="85"></circle><circle r="70"></circle><circle r="55"></circle><circle r="40"></circle></g><circle fill="#334155" r="14"></circle><circle fill="#94a3b8" r="5"></circle><g><circle cx="41.7" cy="-114.7" fill="#ef4444" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#b91c1c" font-size="11" font-weight="600" x="49" y="-122">18</text></g><g><circle cx="45.6" cy="97.9" fill="#f59e0b" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#b45309" font-size="11" font-weight="600" x="54" y="112">39</text></g><g><circle cx="-83.4" cy="38.9" fill="#10b981" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#047857" font-size="11" font-weight="600" x="-104" y="42">55</text></g><g><circle cx="-70.5" cy="-25.7" fill="#06b6d4" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#0e7490" font-size="11" font-weight="600" x="-90" y="-28">90</text></g><g><circle cx="54.5" cy="19.8" fill="#3b82f6" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#1d4ed8" font-size="11" font-weight="600" x="50" y="38">150</text></g><g><circle cx="-16.4" cy="45.1" fill="#8b5cf6" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#6d28d9" font-size="11" font-weight="600" x="-32" y="60">160</text></g><g><circle cx="-14.8" cy="-31.7" fill="#ec4899" r="6" stroke="#fff" stroke-width="1.5"></circle><text fill="#be185d" font-size="11" font-weight="600" x="-32" y="-36">184</text></g><g><rect fill="url(#head)" height="12" opacity=".92" rx="3" width="160" x="60" y="-6"></rect><circle cx="220" cy="0" fill="#1e293b" r="10"></circle><polygon fill="#7c3aed" points="62,-3 62,3 50,0"></polygon><text fill="#5b21b6" font-size="10.5" font-weight="600" text-anchor="middle" x="150" y="-12">读写磁头</text></g><text fill="#64748b" font-size="10" text-anchor="middle" x="0" y="-138">外圈 (磁道号小)</text><text fill="#64748b" font-size="10" text-anchor="middle" x="0" y="32">内圈 (磁道号大)</text><text fill="#f97316" font-size="28" font-weight="700" opacity=".75" x="-150" y="-150">?</text><text fill="#f97316" font-size="28" font-weight="700" opacity=".75" x="155" y="155">?</text></g><g transform="translate(430,100)"><text fill="#0f172a" font-size="14" font-weight="700" x="0" y="0">等待服务的请求队列</text><rect fill="#f8fafc" height="58" rx="10" stroke="#cbd5e1" width="290" x="0" y="14"></rect><g font-size="13" font-weight="600"><rect fill="#fee2e2" height="32" rx="6" width="34" x="10" y="26"></rect><text fill="#b91c1c" text-anchor="middle" x="27" y="47">18</text><rect fill="#fef3c7" height="32" rx="6" width="34" x="50" y="26"></rect><text fill="#b45309" text-anchor="middle" x="67" y="47">39</text><rect fill="#d1fae5" height="32" rx="6" width="34" x="90" y="26"></rect><text fill="#047857" text-anchor="middle" x="107" y="47">55</text><rect fill="#cffafe" height="32" rx="6" width="34" x="130" y="26"></rect><text fill="#0e7490" text-anchor="middle" x="147" y="47">90</text><rect fill="#dbeafe" height="32" rx="6" width="40" x="170" y="26"></rect><text fill="#1d4ed8" text-anchor="middle" x="190" y="47">150</text><rect fill="#ede9fe" height="32" rx="6" width="40" x="216" y="26"></rect><text fill="#6d28d9" text-anchor="middle" x="236" y="47">160</text></g><text fill="#0f172a" font-size="14" font-weight="700" x="0" y="110">核心问题</text><foreignobject height="100" width="300" x="0" y="120"><div style="font-size:12.5px;color:#334155;line-height:1.6;font-family:inherit" xmlns="http://www.w3.org/1999/xhtml"> 多条请求落在<b style="color:#7c3aed">不同磁道</b>上，磁头一次只能在一条磁道上工作。<br/> 以怎样的顺序服务这些请求，将直接影响<b style="color:#ef4444">寻道距离</b>与<b style="color:#ef4444">平均响应时间</b>。 </div></foreignobject><g font-size="11.5" font-weight="600" transform="translate(0,240)"><rect fill="#fff7ed" height="26" rx="13" stroke="#fb923c" width="60" x="0" y="0"></rect><text fill="#c2410c" text-anchor="middle" x="30" y="17">FCFS</text><rect fill="#ecfeff" height="26" rx="13" stroke="#22d3ee" width="60" x="68" y="0"></rect><text fill="#0e7490" text-anchor="middle" x="98" y="17">SSTF</text><rect fill="#eff6ff" height="26" rx="13" stroke="#60a5fa" width="60" x="136" y="0"></rect><text fill="#1d4ed8" text-anchor="middle" x="166" y="17">SCAN</text><rect fill="#fdf4ff" height="26" rx="13" stroke="#c084fc" width="80" x="204" y="0"></rect><text fill="#7e22ce" text-anchor="middle" x="244" y="17">C-SCAN</text><text fill="#64748b" font-size="11" x="0" y="46">不同调度算法 → 不同的访问顺序与开销</text></g></g></svg>