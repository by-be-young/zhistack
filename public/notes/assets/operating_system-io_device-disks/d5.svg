<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 900 360"><defs><lineargradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fef3c7"></stop><stop offset="100%" stop-color="#fde68a"></stop></lineargradient><lineargradient id="g2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dbeafe"></stop><stop offset="100%" stop-color="#bfdbfe"></stop></lineargradient><lineargradient id="g3" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dcfce7"></stop><stop offset="100%" stop-color="#bbf7d0"></stop></lineargradient><lineargradient id="g4" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fce7f3"></stop><stop offset="100%" stop-color="#fbcfe8"></stop></lineargradient><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#475569"></path></marker><filter height="130%" id="shadow" width="120%" x="-10%" y="-10%"><fedropshadow dx="0" dy="3" flood-color="#000" flood-opacity=".12" stddeviation="3"></fedropshadow></filter></defs><text fill="#0f172a" font-size="20" font-weight="700" text-anchor="middle" x="450" y="36">系统引导流程 (Boot Process)</text><text fill="#64748b" font-size="13" text-anchor="middle" x="450" y="58">加电 → 固件 → 主引导记录 → 分区引导扇区 → 操作系统</text><g filter="url(#shadow)"><rect fill="url(#g1)" height="130" rx="14" stroke="#f59e0b" stroke-width="1.5" width="180" x="40" y="100"></rect><circle cx="70" cy="130" fill="#f59e0b" r="14"></circle><text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="70" y="135">1</text><text fill="#78350f" font-size="15" font-weight="700" x="95" y="135">ROM 固件</text><text fill="#7c2d12" font-size="12" x="60" y="160">BIOS / UEFI</text><text fill="#7c2d12" font-size="11.5" x="60" y="180">· 加电自检 (POST)</text><text fill="#7c2d12" font-size="11.5" x="60" y="198">· 初始化硬件</text><text fill="#7c2d12" font-size="11.5" x="60" y="216">· 读取 0 号扇区</text></g><g filter="url(#shadow)"><rect fill="url(#g2)" height="130" rx="14" stroke="#3b82f6" stroke-width="1.5" width="180" x="250" y="100"></rect><circle cx="280" cy="130" fill="#3b82f6" r="14"></circle><text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="280" y="135">2</text><text fill="#1e3a8a" font-size="15" font-weight="700" x="305" y="135">MBR Bootloader</text><text fill="#1e40af" font-size="12" x="270" y="160">主引导记录</text><text fill="#1e40af" font-size="11.5" x="270" y="180">· 解析分区表</text><text fill="#1e40af" font-size="11.5" x="270" y="198">· 定位活动分区</text><text fill="#1e40af" font-size="11.5" x="270" y="216">· 加载引导扇区</text></g><g filter="url(#shadow)"><rect fill="url(#g3)" height="130" rx="14" stroke="#10b981" stroke-width="1.5" width="180" x="460" y="100"></rect><circle cx="490" cy="130" fill="#10b981" r="14"></circle><text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="490" y="135">3</text><text fill="#064e3b" font-size="15" font-weight="700" x="515" y="135">分区引导扇区</text><text fill="#065f46" font-size="12" x="480" y="160">Boot Sector</text><text fill="#065f46" font-size="11.5" x="480" y="180">· OS 专属引导代码</text><text fill="#065f46" font-size="11.5" x="480" y="198">· GRUB / NT Loader</text><text fill="#065f46" font-size="11.5" x="480" y="216">· 加载内核组件</text></g><g filter="url(#shadow)"><rect fill="url(#g4)" height="130" rx="14" stroke="#ec4899" stroke-width="1.5" width="190" x="670" y="100"></rect><circle cx="700" cy="130" fill="#ec4899" r="14"></circle><text fill="#fff" font-size="14" font-weight="700" text-anchor="middle" x="700" y="135">4</text><text fill="#831843" font-size="15" font-weight="700" x="725" y="135">OS 初始化程序</text><text fill="#9f1239" font-size="12" x="690" y="160">操作系统启动</text><text fill="#9f1239" font-size="11.5" x="690" y="180">· 加载内核</text><text fill="#9f1239" font-size="11.5" x="690" y="198">· 加载驱动程序</text><text fill="#9f1239" font-size="11.5" x="690" y="216">· 移交控制权</text></g><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="222" x2="248" y1="165" y2="165"></line><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="432" x2="458" y1="165" y2="165"></line><line marker-end="url(#arrow)" stroke="#475569" stroke-width="2" x1="642" x2="668" y1="165" y2="165"></line><g fill="#475569" font-size="11"><text text-anchor="middle" x="235" y="262">加载 MBR</text><text text-anchor="middle" x="445" y="262">移交控制权</text><text text-anchor="middle" x="655" y="262">启动内核</text></g><line stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="2" x1="60" x2="840" y1="295" y2="295"></line><circle cx="60" cy="295" fill="#f59e0b" r="6"></circle><circle cx="320" cy="295" fill="#3b82f6" r="6"></circle><circle cx="560" cy="295" fill="#10b981" r="6"></circle><circle cx="840" cy="295" fill="#ec4899" r="6"></circle><text fill="#64748b" font-size="11" text-anchor="middle" x="60" y="320">加电</text><text fill="#64748b" font-size="11" text-anchor="middle" x="320" y="320">读盘</text><text fill="#64748b" font-size="11" text-anchor="middle" x="560" y="320">分区</text><text fill="#64748b" font-size="11" text-anchor="middle" x="840" y="320">系统就绪</text><text fill="#94a3b8" font-size="11" font-style="italic" text-anchor="middle" x="450" y="348">每一阶段执行完毕后，将控制权传递给下一阶段，直至操作系统完全运行</text></svg>