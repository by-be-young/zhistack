<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" viewBox="0 0 880 480"><text class="title" font-size="20" text-anchor="middle" x="440" y="28">SMTP 推送 / POP3 拉取 — 邮件传递时序</text><g><rect class="ua" height="46" rx="6" width="140" x="40" y="60"></rect><text class="label-w" text-anchor="middle" x="110" y="89">发送方 UA</text><rect class="server" height="46" rx="6" width="160" x="240" y="60"></rect><text class="label-w" text-anchor="middle" x="320" y="89">发送方邮件服务器</text><rect class="server" height="46" rx="6" width="160" x="460" y="60"></rect><text class="label-w" text-anchor="middle" x="540" y="89">接收方邮件服务器</text><rect class="ua" height="46" rx="6" width="140" x="680" y="60"></rect><text class="label-w" text-anchor="middle" x="750" y="89">接收方 UA</text><line stroke="#bdc3c7" stroke-dasharray="3 3" x1="110" x2="110" y1="106" y2="430"></line><line stroke="#bdc3c7" stroke-dasharray="3 3" x1="320" x2="320" y1="106" y2="430"></line><line stroke="#bdc3c7" stroke-dasharray="3 3" x1="540" x2="540" y1="106" y2="430"></line><line stroke="#bdc3c7" stroke-dasharray="3 3" x1="750" x2="750" y1="106" y2="430"></line></g><g><line class="push" marker-end="url(#redArrow)" x1="110" x2="320" y1="150" y2="150"></line><text class="anno" fill="#c0392b" font-weight="bold" text-anchor="middle" x="215" y="142">① SMTP 推送 (端口 25/587)</text><text class="desc" text-anchor="middle" x="215" y="166">UA 主动把邮件提交给本方服务器</text></g><g><line class="push" marker-end="url(#redArrow)" x1="320" x2="540" y1="220" y2="220"></line><text class="anno" fill="#c0392b" font-weight="bold" text-anchor="middle" x="430" y="212">② SMTP 推送 (端口 25)</text><text class="desc" text-anchor="middle" x="430" y="236">服务器间继续主动推送，直到目标服务器</text></g><rect fill="#fef5e7" height="22" rx="4" stroke="#e67e22" width="100" x="490" y="252"></rect><text class="anno" fill="#a04000" text-anchor="middle" x="540" y="268">入站邮箱缓存</text><g><line class="pull-req" marker-end="url(#blueArrow)" x1="750" x2="540" y1="320" y2="320"></line><text class="anno" fill="#2980b9" font-weight="bold" text-anchor="middle" x="645" y="312">③ POP3 请求 (端口 110/995)</text><text class="desc" text-anchor="middle" x="645" y="336">UA 主动询问 "有没有新邮件？"</text></g><g><line class="pull-resp" marker-end="url(#blueArrow)" x1="540" x2="750" y1="390" y2="390"></line><text class="anno" fill="#2980b9" font-weight="bold" text-anchor="middle" x="645" y="382">④ POP3 下载邮件</text><text class="desc" text-anchor="middle" x="645" y="406">服务器把邮件返回给 UA（默认下载后删除）</text></g><g transform="translate(40,440)"><line class="push" marker-end="url(#redArrow)" x1="0" x2="40" y1="0" y2="0"></line><text class="anno" x="48" y="4">SMTP 推送 (Push)：主动发送方</text><line class="pull-req" marker-end="url(#blueArrow)" x1="280" x2="320" y1="0" y2="0"></line><text class="anno" x="328" y="4">POP3 拉取 (Pull)：主动接收方</text><text class="anno" fill="#7f8c8d" x="0" y="24">UA = 用户代理；IMAP 行为类似 POP3 但保留服务器副本</text></g><defs><marker id="redArrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker><marker id="blueArrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2980b9"></path></marker></defs></svg>