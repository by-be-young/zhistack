<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><lineargradient id="clientGrad" x1="0" x2="100%" y1="0" y2="100%"><stop offset="0" style="stop-color:#4CAF50;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#45a049;stop-opacity:1"></stop></lineargradient><lineargradient id="serverGrad" x1="0" x2="100%" y1="0" y2="100%"><stop offset="0" style="stop-color:#2196F3;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#1976D2;stop-opacity:1"></stop></lineargradient><filter id="shadow"><fedropshadow dx="2" dy="2" flood-opacity=".3" stddeviation="2"></fedropshadow></filter></defs><rect fill="none" height="500" stroke="#e9ecef" stroke-width="1" width="800"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="400" y="25">FTP 工作原理</text><rect fill="url(#clientGrad)" filter="url(#shadow)" height="80" rx="8" width="120" x="50" y="80"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="110" y="110">FTP 客户端</text><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="110" y="130">Client</text><rect fill="url(#serverGrad)" filter="url(#shadow)" height="80" rx="8" width="120" x="630" y="80"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" x="690" y="110">FTP 服务器</text><text fill="#fff" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" x="690" y="130">Server</text><line marker-end="url(#arrowhead)" stroke="#FF5722" stroke-width="3" x1="170" x2="630" y1="100" y2="100"></line><text fill="#FF5722" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="95">控制连接 (端口 21)</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="400" y="110">命令与响应</text><line marker-end="url(#arrowhead2)" stroke="#9C27B0" stroke-width="3" x1="170" x2="630" y1="140" y2="140"></line><text fill="#9C27B0" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="400" y="135">数据连接 (端口 20 或动态)</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="400" y="150">文件传输</text><text fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="50" y="200">工作流程：</text><rect fill="#fff" filter="url(#shadow)" height="250" rx="8" stroke="#ddd" stroke-width="1" width="720" x="40" y="220"></rect><circle cx="70" cy="250" fill="#FF5722" r="12"></circle><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="70" y="255">1</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="100" y="255">建立连接</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" x="100" y="270">• 建立 TCP 控制连接 (端口 21)</text><circle cx="270" cy="250" fill="#FF9800" r="12"></circle><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="270" y="255">2</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="300" y="255">身份验证</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" x="300" y="270">• 用户名和密码验证</text><circle cx="470" cy="250" fill="#4CAF50" r="12"></circle><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="470" y="255">3</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="500" y="255">命令交换</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" x="500" y="270">• 通过控制连接发送命令</text><circle cx="650" cy="250" fill="#2196F3" r="12"></circle><text fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="650" y="255">4</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="680" y="255">数据传输</text><text fill="#666" font-family="Arial, sans-serif" font-size="10" x="680" y="270">• 建立数据连接传输文件</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="70" y="310">传输模式：</text><rect fill="#E3F2FD" height="60" rx="5" stroke="#2196F3" stroke-width="1" width="150" x="70" y="320"></rect><text fill="#1976D2" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="145" y="340">主动模式 (Active)</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="145" y="355">客户端开放端口</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="145" y="370">服务器主动连接</text><rect fill="#FFF3E0" height="60" rx="5" stroke="#FF9800" stroke-width="1" width="150" x="240" y="320"></rect><text fill="#F57C00" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="315" y="340">被动模式 (Passive)</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="315" y="355">服务器开放端口</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="315" y="370">客户端主动连接</text><text fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" x="450" y="310">文件类型：</text><rect fill="#E8F5E8" height="30" rx="5" stroke="#4CAF50" stroke-width="1" width="120" x="450" y="320"></rect><text fill="#2E7D32" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="510" y="340">ASCII 模式</text><rect fill="#F3E5F5" height="30" rx="5" stroke="#9C27B0" stroke-width="1" width="120" x="580" y="320"></rect><text fill="#7B1FA2" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" x="640" y="340">二进制模式</text><rect fill="#FAFAFA" height="60" rx="5" stroke="#ccc" stroke-width="1" width="250" x="450" y="360"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="575" y="380">常用命令</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="575" y="395">LIST (列表) • RETR (下载) • STOR (上传)</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="575" y="410">PWD (当前目录) • CWD (切换目录) • QUIT (退出)</text><rect fill="#FAFAFA" height="50" rx="5" stroke="#ccc" stroke-width="1" width="320" x="70" y="400"></rect><text fill="#333" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" x="230" y="420">常见状态码</text><text fill="#666" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" x="230" y="435">200 (成功) • 220 (连接就绪) • 226 (传输完成) • 530 (认证失败)</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#FF5722" points="0 0, 10 3.5, 0 7"></polygon></marker><marker id="arrowhead2" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#9C27B0" points="0 0, 10 3.5, 0 7"></polygon></marker></defs></svg>