<svg xmlns="http://www.w3.org/2000/svg" height="320" viewBox="0 0 600 320" width="600"><rect fill="none" height="320" rx="8" stroke="#e9ecef" stroke-width="2" width="600"></rect><text fill="#2c3e50" font-size="18" font-weight="bold" text-anchor="middle" x="300" y="25">FTP 控制连接 (TCP 端口 21)</text><rect fill="#3498db" height="80" rx="8" stroke="#2980b9" stroke-width="2" width="120" x="50" y="80"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="110" y="105">FTP 客户端</text><text fill="#fff" font-size="12" text-anchor="middle" x="110" y="125">发送命令</text><text fill="#fff" font-size="12" text-anchor="middle" x="110" y="145">接收响应</text><rect fill="#27ae60" height="80" rx="8" stroke="#229954" stroke-width="2" width="120" x="430" y="80"></rect><text fill="#fff" font-size="14" font-weight="bold" text-anchor="middle" x="490" y="105">FTP 服务器</text><text fill="#fff" font-size="12" text-anchor="middle" x="490" y="125">处理命令</text><text fill="#fff" font-size="12" text-anchor="middle" x="490" y="145">返回状态码</text><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#e74c3c" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="3" x1="170" x2="430" y1="110" y2="110"></line><line marker-end="url(#arrowhead)" stroke="#e74c3c" stroke-width="3" x1="430" x2="170" y1="130" y2="130"></line><rect fill="#fff" height="50" rx="5" stroke="#e74c3c" stroke-width="2" width="120" x="240" y="95"></rect><text fill="#e74c3c" font-size="12" font-weight="bold" text-anchor="middle" x="300" y="115">控制连接</text><text fill="#e74c3c" font-size="11" text-anchor="middle" x="300" y="130">持久连接</text><rect fill="#fff" height="110" rx="5" stroke="#bdc3c7" stroke-width="1" width="540" x="30" y="190"></rect><text fill="#2c3e50" font-size="13" font-weight="bold" x="50" y="210">常见 FTP 命令与响应：</text><text fill="#3498db" font-size="11" font-weight="bold" x="70" y="230">命令：</text><text fill="#34495e" font-size="11" x="120" y="230">USER username</text><text fill="#34495e" font-size="11" x="250" y="230">PASS password</text><text fill="#34495e" font-size="11" x="370" y="230">LIST</text><text fill="#34495e" font-size="11" x="420" y="230">CWD /path</text><text fill="#27ae60" font-size="11" font-weight="bold" x="70" y="250">响应：</text><text fill="#34495e" font-size="11" x="120" y="250">220 Ready</text><text fill="#34495e" font-size="11" x="250" y="250">230 Login OK</text><text fill="#34495e" font-size="11" x="370" y="250">150 Opening</text><text fill="#34495e" font-size="11" x="470" y="250">250 OK</text><text fill="#e74c3c" font-size="11" font-weight="bold" x="70" y="275">特点：</text><text fill="#34495e" font-size="11" x="120" y="275">• 始终保持打开状态</text><text fill="#34495e" font-size="11" x="280" y="275">• 传输命令和状态码</text><text fill="#34495e" font-size="11" x="450" y="275">• 使用 TCP 端口 21</text><text fill="#34495e" font-size="11" x="120" y="290">• QUIT 命令关闭连接</text><text fill="#34495e" font-size="11" x="280" y="290">• 控制整个 FTP 会话</text></svg>