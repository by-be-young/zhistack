<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><text fill="#2563eb" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="30">原码（Sign-Magnitude）表示法</text><text fill="#1f2937" font-size="16" font-weight="bold" x="50" y="70">8位原码结构：</text><g transform="translate(50, 90)"><text fill="#6b7280" font-size="12" text-anchor="middle" x="15" y="15">7</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="55" y="15">6</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="95" y="15">5</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="135" y="15">4</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="175" y="15">3</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="215" y="15">2</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="255" y="15">1</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="295" y="15">0</text><rect fill="#fef3c7" height="40" stroke="#f59e0b" stroke-width="2" width="30" x="0" y="20"></rect><text fill="#d97706" font-size="14" font-weight="bold" text-anchor="middle" x="15" y="44">S</text><rect fill="#dbeafe" height="40" stroke="#3b82f6" stroke-width="2" width="270" x="40" y="20"></rect><text fill="#2563eb" font-size="14" font-weight="bold" text-anchor="middle" x="175" y="44">数值位（Magnitude Bits）</text><text fill="#d97706" font-size="12" font-weight="bold" text-anchor="middle" x="15" y="75">符号位</text><text fill="#2563eb" font-size="12" font-weight="bold" text-anchor="middle" x="175" y="75">绝对值的二进制表示</text></g><g transform="translate(400, 90)"><text fill="#1f2937" font-size="16" font-weight="bold" x="0" y="20">符号位规则：</text><g transform="translate(0, 40)"><rect fill="#dcfce7" height="25" stroke="#22c55e" stroke-width="2" width="25" x="0" y="0"></rect><text fill="#16a34a" font-size="14" font-weight="bold" text-anchor="middle" x="12" y="17">0</text><text fill="#1f2937" font-size="14" x="35" y="17">= 正数</text></g><g transform="translate(0, 75)"><rect fill="#fee2e2" height="25" stroke="#ef4444" stroke-width="2" width="25" x="0" y="0"></rect><text fill="#dc2626" font-size="14" font-weight="bold" text-anchor="middle" x="12" y="17">1</text><text fill="#1f2937" font-size="14" x="35" y="17">= 负数</text></g></g><text fill="#1f2937" font-size="18" font-weight="bold" x="50" y="210">示例：</text><g transform="translate(50, 240)"><text fill="#16a34a" font-size="16" font-weight="bold" x="0" y="0">正数：+25</text><text fill="#6b7280" font-size="14" x="0" y="25">25的二进制：11001</text><g transform="translate(0, 45)"><rect fill="#dcfce7" height="30" stroke="#22c55e" stroke-width="2" width="30" x="0" y="0"></rect><text fill="#16a34a" font-size="16" font-weight="bold" text-anchor="middle" x="15" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="35" y="0"></rect><text font-size="14" text-anchor="middle" x="50" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="65" y="0"></rect><text font-size="14" text-anchor="middle" x="80" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="95" y="0"></rect><text font-size="14" text-anchor="middle" x="110" y="20">1</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="125" y="0"></rect><text font-size="14" text-anchor="middle" x="140" y="20">1</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="155" y="0"></rect><text font-size="14" text-anchor="middle" x="170" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="185" y="0"></rect><text font-size="14" text-anchor="middle" x="200" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="215" y="0"></rect><text font-size="14" text-anchor="middle" x="230" y="20">1</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="125" y="50">00011001 = +25</text></g></g><g transform="translate(50, 360)"><text fill="#dc2626" font-size="16" font-weight="bold" x="0" y="0">负数：-25</text><text fill="#6b7280" font-size="14" x="0" y="25">25的二进制：11001（绝对值相同）</text><g transform="translate(0, 45)"><rect fill="#fee2e2" height="30" stroke="#ef4444" stroke-width="2" width="30" x="0" y="0"></rect><text fill="#dc2626" font-size="16" font-weight="bold" text-anchor="middle" x="15" y="20">1</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="35" y="0"></rect><text font-size="14" text-anchor="middle" x="50" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="65" y="0"></rect><text font-size="14" text-anchor="middle" x="80" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="95" y="0"></rect><text font-size="14" text-anchor="middle" x="110" y="20">1</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="125" y="0"></rect><text font-size="14" text-anchor="middle" x="140" y="20">1</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="155" y="0"></rect><text font-size="14" text-anchor="middle" x="170" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="185" y="0"></rect><text font-size="14" text-anchor="middle" x="200" y="20">0</text><rect fill="#f3f4f6" height="30" stroke="#6b7280" stroke-width="1" width="30" x="215" y="0"></rect><text font-size="14" text-anchor="middle" x="230" y="20">1</text><text fill="#6b7280" font-size="12" text-anchor="middle" x="125" y="50">10011001 = -25</text></g></g><g transform="translate(400, 240)"><text fill="#7c3aed" font-size="16" font-weight="bold" x="0" y="0">零的表示：</text><g transform="translate(0, 30)"><text fill="#7c3aed" font-size="14" x="0" y="0">+0：</text><rect fill="#dcfce7" height="20" stroke="#22c55e" stroke-width="1" width="20" x="40" y="-15"></rect><text fill="#16a34a" font-size="12" text-anchor="middle" x="50" y="-2">0</text><text fill="#6b7280" font-size="12" x="70" y="-2">0000000</text></g><g transform="translate(0, 60)"><text fill="#7c3aed" font-size="14" x="0" y="0">-0：</text><rect fill="#fee2e2" height="20" stroke="#ef4444" stroke-width="1" width="20" x="40" y="-15"></rect><text fill="#dc2626" font-size="12" text-anchor="middle" x="50" y="-2">1</text><text fill="#6b7280" font-size="12" x="70" y="-2">0000000</text></g><text fill="#6b7280" font-size="12" x="0" y="90">（实际应用中通常只使用+0）</text></g><g transform="translate(400, 360)"><text fill="#1f2937" font-size="16" font-weight="bold" x="0" y="0">原码特点：</text><text fill="#6b7280" font-size="14" x="0" y="25">• 符号位独立于数值位</text><text fill="#6b7280" font-size="14" x="0" y="45">• 正负数的数值位相同</text><text fill="#6b7280" font-size="14" x="0" y="65">• 直观易懂</text><text fill="#6b7280" font-size="14" x="0" y="85">• 运算复杂（需要判断符号）</text><text fill="#6b7280" font-size="14" x="0" y="105">• 存在+0和-0两个零</text></g><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="0" refY="3.5"><polygon fill="#6b7280" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><line marker-end="url(#arrowhead)" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1" x1="65" x2="400" y1="140" y2="140"></line></svg>