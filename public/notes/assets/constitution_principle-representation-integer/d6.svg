<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#3498db" points="0 0, 10 3.5, 0 7"></polygon></marker></defs><text class="title" text-anchor="middle" x="400" y="30">十进制负数 → 补码二进制转换</text><rect class="box" height="40" width="120" x="50" y="50"></rect><text class="subtitle" text-anchor="middle" x="110" y="75">十进制: -73</text><rect class="method-box" height="200" width="360" x="30" y="110"></rect><text class="subtitle" text-anchor="middle" x="210" y="135">方法一：基于公式直接观察</text><text class="formula" x="50" y="160">S = Σ(i=0 to n-2) 2^i × bi - 2^(n-1) × bn-1</text><text class="text" x="50" y="185">-73 = -128 + 55</text><text class="text" x="50" y="205">= -128 + 32 + 16 + 4 + 2 + 1</text><text class="text" x="50" y="225">= -2^7 + 2^5 + 2^4 + 2^2 + 2^1 + 2^0</text><text class="text" x="50" y="250">位置:</text><text class="formula" x="120" y="250">7 6 5 4 3 2 1 0</text><text class="text" x="50" y="275">补码:</text><text class="binary negative" x="120" y="275">1</text><text class="binary positive" x="142" y="275">0</text><text class="binary highlight" x="164" y="275">1</text><text class="binary highlight" x="186" y="275">1</text><text class="binary positive" x="208" y="275">0</text><text class="binary highlight" x="230" y="275">1</text><text class="binary highlight" x="252" y="275">1</text><text class="binary highlight" x="274" y="275">1</text><rect class="method-box" height="200" width="360" x="410" y="110"></rect><text class="subtitle" text-anchor="middle" x="590" y="135">方法二：取反加一法</text><text class="text" x="430" y="165">步骤1: |-73| = 73 的纯二进制</text><text class="formula" x="450" y="185">73 = 64 + 8 + 1 = 2^6 + 2^3 + 2^0</text><text class="binary positive" x="450" y="205">01001001</text><line class="arrow" x1="590" x2="590" y1="215" y2="235"></line><text class="text" x="430" y="255">步骤2: 取反 (0↔1)</text><text class="binary negative" x="450" y="275">10110110</text><line class="arrow" x1="590" x2="590" y1="285" y2="305"></line><text class="text" x="430" y="325">步骤3: 加1</text><text class="formula" x="450" y="345">10110110 + 1 =</text><text class="binary negative" style="font-size:16px" x="600" y="345">10110111</text><rect height="80" style="stroke:#27ae60;stroke-width:3;fill:#d5f4e6;rx:10" width="400" x="200" y="370"></rect><text class="subtitle" style="fill:#27ae60" text-anchor="middle" x="400" y="395">两种方法得到相同结果</text><text class="text" x="250" y="420">方法一结果:</text><text class="binary negative" style="font-size:18px" x="370" y="420">10110111</text><text class="text" x="250" y="440">方法二结果:</text><text class="binary negative" style="font-size:18px" x="370" y="440">10110111</text><text class="subtitle" x="50" y="490">验证: 10110111(补码) → 十进制</text><text class="formula" x="50" y="515">= 1×2^0 + 1×2^1 + 1×2^2 + 0×2^3 + 1×2^4 + 1×2^5 + 0×2^6 - 1×2^7</text><text class="formula" x="50" y="535">= 1 + 2 + 4 + 0 + 16 + 32 + 0 - 128</text><text class="formula" x="50" y="555">= 55 - 128 = -73 ✓</text><text class="text" style="font-size:12px;fill:#7f8c8d" x="50" y="580">注: 最高位为符号位，1表示负数，0表示非负数</text></svg>