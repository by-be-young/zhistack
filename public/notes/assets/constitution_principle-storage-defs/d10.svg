)"><circle cx="8" cy="8" fill="#d4753b" r="6"></circle><text x="24" y="12">功耗：刷新+读写有持续开销</text></g><g transform="translate(0,160)"><circle cx="8" cy="8" fill="#d4753b" r="6"></circle><text x="24" y="12">成本：低</text></g><g transform="translate(0,192)"><circle cx="8" cy="8" fill="#d4753b" r="6"></circle><text x="24" y="12">典型用途：主存、显存</text></g></g><circle cx="450" cy="260" fill="#fff" r="26" stroke="#666" stroke-width="1.5"></circle><text fill="#444" font-size="16" font-weight="700" text-anchor="middle" x="450" y="266">VS</text></svg>