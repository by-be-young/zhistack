<svg xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 900 520"><defs><lineargradient id="sramGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"></stop><stop offset="1" stop-color="#eaf2fd"></stop></lineargradient><lineargradient id="dramGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffaf5"></stop><stop offset="1" stop-color="#fdf0e4"></stop></lineargradient><marker id="arr" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#666"></path></marker></defs><rect fill="url(#sramGrad)" height="480" rx="14" stroke="#9dbde8" stroke-width="1.5" width="420" x="20" y="20"></rect><text fill="#1e3f80" font-size="26" font-weight="700" text-anchor="middle" x="230" y="60">SRAM</text><text fill="#28518a" font-size="13" text-anchor="middle" x="230" y="82">Static Random-Access Memory</text><g transform="translate(60,105)"><rect fill="#fff" height="120" rx="8" stroke="#3b74d4" stroke-width="1.5" width="340" x="0" y="0"></rect><text fill="#1e3f80" font-size="12" font-weight="600" text-anchor="middle" x="170" y="18">存储单元：6 晶体管触发器 (6T)</text><polygon fill="#c9dcff" points="90,55 130,42 130,68" stroke="#3b74d4"></polygon><polygon fill="#c9dcff" points="250,55 210,42 210,68" stroke="#3b74d4"></polygon><line stroke="#333" stroke-width="1.2" x1="130" x2="210" y1="55" y2="55"></line><line stroke="#333" stroke-width="1.2" x1="170" x2="170" y1="55" y2="80"></line><line stroke="#333" stroke-width="1.2" x1="90" x2="70" y1="55" y2="55"></line><line stroke="#333" stroke-width="1.2" x1="250" x2="270" y1="55" y2="55"></line><rect fill="#fff" height="20" stroke="#3b74d4" width="16" x="55" y="45"></rect><rect fill="#fff" height="20" stroke="#3b74d4" width="16" x="269" y="45"></rect><line stroke="#e2831b" stroke-width="1.5" x1="63" x2="63" y1="30" y2="45"></line><line stroke="#e2831b" stroke-width="1.5" x1="277" x2="277" y1="30" y2="45"></line><line stroke="#e2831b" stroke-width="1.5" x1="40" x2="300" y1="30" y2="30"></line><text fill="#e2831b" font-size="10" x="310" y="34">WL</text><line stroke="#666" stroke-width="1.2" x1="30" x2="55" y1="55" y2="55"></line><line stroke="#666" stroke-width="1.2" x1="285" x2="315" y1="55" y2="55"></line><line stroke="#666" stroke-width="1.2" x1="30" x2="30" y1="55" y2="105"></line><line stroke="#666" stroke-width="1.2" x1="315" x2="315" y1="55" y2="105"></line><text fill="#666" font-size="10" x="12" y="105">BL</text><text fill="#666" font-size="10" x="320" y="105">BL̅</text></g><g fill="#1e3f80" font-size="14" transform="translate(50,245)"><g transform="translate(0,0)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">数据保持：触发器闩锁，通电即稳</text></g><g transform="translate(0,32)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">刷新：无需刷新</text></g><g transform="translate(0,64)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">速度：极快（约 1–5 ns）</text></g><g transform="translate(0,96)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">集成度：低（每 bit ≥ 6 管）</text></g><g transform="translate(0,128)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">功耗：静态低，切换高</text></g><g transform="translate(0,160)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">成本：高</text></g><g transform="translate(0,192)"><circle cx="8" cy="8" fill="#3b74d4" r="6"></circle><text x="24" y="12">典型用途：CPU Cache、寄存器</text></g></g><rect fill="url(#dramGrad)" height="480" rx="14" stroke="#e8bf9d" stroke-width="1.5" width="420" x="460" y="20"></rect><text fill="#80421e" font-size="26" font-weight="700" text-anchor="middle" x="670" y="60">DRAM</text><text fill="#8a5228" font-size="13" text-anchor="middle" x="670" y="82">Dynamic Random-Access Memory</text><g transform="translate(500,105)"><rect fill="#fff" height="120" rx="8" stroke="#d4753b" stroke-width="1.5" width=