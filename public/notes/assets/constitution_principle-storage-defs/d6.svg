-size="12" text-anchor="middle" x="80" y="80">1 个地址 → 4 bit 数据</text></g></g><g fill="none" stroke="#b9770e" stroke-width="1.5"><path d="M3e2 264q120-24 280 44" marker-end="url(#arrow)"></path><path d="M272 292q158-32 348 16" marker-end="url(#arrow)"></path><path d="M244 320q206-40 416-12" marker-end="url(#arrow)"></path><path d="M216 348q254-28 484-40" marker-end="url(#arrow)"></path></g><g transform="translate(560,430)"><rect fill="#eaf4fc" height="16" stroke="#2c6da3" width="16" x="0" y="0"></rect><text fill="#333" font-size="12" x="22" y="13">位平面 (Bit Plane)</text><rect fill="#f39c12" height="16" stroke="#b9770e" width="16" x="0" y="24"></rect><text fill="#333" font-size="12" x="22" y="37">被同一 (行,列) 选中的 Cell</text></g></svg>