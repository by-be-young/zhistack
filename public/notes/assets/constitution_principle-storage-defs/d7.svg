<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 880 520"><defs><lineargradient id="bgGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fafbff"></stop><stop offset="100%" stop-color="#eef2fb"></stop></lineargradient><lineargradient id="rowGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ff8a65"></stop><stop offset="100%" stop-color="#ff5722"></stop></lineargradient><lineargradient id="colGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#42a5f5"></stop><stop offset="100%" stop-color="#1565c0"></stop></lineargradient><lineargradient id="chipGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="100%" stop-color="#e3e8f4"></stop></lineargradient><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#37474f"></path></marker><marker id="arrowRow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#e64a19"></path></marker><marker id="arrowCol" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#1565c0"></path></marker><filter height="140%" id="softShadow" width="140%" x="-20%" y="-20%"><fegaussianblur in="SourceAlpha" stddeviation="2"></fegaussianblur><feoffset dx="0" dy="2" result="off"></feoffset><fecomponenttransfer><fefunca slope=".18" type="linear"></fefunca></fecomponenttransfer><femerge><femergenode></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter></defs><rect fill="url(#bgGrad)" height="520" width="880"></rect><text fill="#1a237e" font-size="20" font-weight="700" text-anchor="middle" x="440" y="34">DRAM 行列地址复用 (Address Multiplexing)</text><text fill="#546e7a" font-size="12" text-anchor="middle" x="440" y="56">同一组地址引脚分两次传送：先送行地址