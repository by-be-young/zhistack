0">用途</text><text fill="#00838f" font-size="11" font-weight="700" text-anchor="middle" x="50" y="40">CPU Cache</text><text fill="#00838f" font-size="11" font-weight="700" text-anchor="middle" x="50" y="58">寄存器</text></g></g><g transform="translate(406,46)"><rect fill="url(#dramGrad)" filter="url(#ramShadow)" height="170" rx="10" stroke="#ffcc80" width="370" x="0" y="0"></rect><text fill="#e65100" font-size="16" font-weight="800" x="20" y="28">DRAM</text><text fill="#ef6c00" font-size="11" x="20" y="46">Dynamic RAM · 动态随机存储器</text><g fill="#263238" font-size="11" transform="translate(20,68)"><text x="0" y="0">• 存储单元：<tspan font-weight="700">1 晶体管 + 1 电容 (1T1C)</tspan></text><text x="0" y="20">• 速度：较慢</text><text x="0" y="40">• 功耗：刷新带来动态功耗</text><text x="0" y="60">• 成本低 · 集成度高 · 容量大</text><text x="0" y="80">•<tspan font-weight="700">需周期性刷新</tspan>（电容漏电）</text></g><g transform="translate(250,80)"><rect fill="#fff" height="70" opacity=".95" rx="6" width="100" x="0" y="0"></rect><text fill="#4a148c" font-size="10" font-weight="700" text-anchor="middle" x="50" y="20">用途</text><text fill="#6a1b9a" font-size="11" font-weight="700" text-anchor="middle" x="50" y="40">主内存</text><text fill="#6a1b9a" font-size="11" font-weight="700" text-anchor="middle" x="50" y="58">显存</text></g></g></g></svg>