<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 800 320"><defs><marker id="promArr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker></defs><rect fill="#fff" height="320" width="800"></rect><g transform="translate(40,50)"><rect fill="#eceff1" height="150" rx="8" stroke="#b0bec5" width="220" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="110" y="30">出厂时（空白）</text><g stroke="#ef6c00" stroke-width="4"><line x1="30" x2="60" y1="55" y2="55"></line><line x1="80" x2="110" y1="55" y2="55"></line><line x1="130" x2="160" y1="55" y2="55"></line><line x1="30" x2="60" y1="85" y2="85"></line><line x1="80" x2="110" y1="85" y2="85"></line><line x1="130" x2="160" y1="85" y2="85"></line><line x1="30" x2="60" y1="115" y2="115"></line><line x1="80" x2="110" y1="115" y2="115"></line><line x1="130" x2="160" y1="115" y2="115"></line></g><text fill="#546e7a" font-size="10" text-anchor="middle" x="110" y="145">所有熔丝完好 = 全 1</text></g><path d="M268 120h52" marker-end="url(#promArr)" stroke="#455a64" stroke-width="2"></path><text fill="#546e7a" font-size="11" text-anchor="middle" x="294" y="100">高压脉冲</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="294" y="140">烧断熔丝</text><g transform="translate(330,50)"><rect fill="#eceff1" height="150" rx="8" stroke="#b0bec5" width="220" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="110" y="30">编程一次后</text><g stroke-width="4"><line stroke="#ef6c00" x1="30" x2="60" y1="55" y2="55"></line><line stroke="#e53935" x1="80" x2="95" y1="55" y2="55"></line><line stroke="#ef6c00" x1="130" x2="160" y1="55" y2="55"></line><line stroke="#e53935" x1="30" x2="45" y1="85" y2="85"></line><line stroke="#ef6c00" x1="80" x2="110" y1="85" y2="85"></line><line stroke="#e53935" x1="130" x2="145" y1="85" y2="85"></line><line stroke="#ef6c00" x1="30" x2="60" y1="115" y2="115"></line><line stroke="#e53935" x1="80" x2="95" y1="115" y2="115"></line><line stroke="#ef6c00" x1="130" x2="160" y1="115" y2="115"></line></g><text fill="#546e7a" font-size="10" text-anchor="middle" x="110" y="145">断开的熔丝 = 数据固定</text></g><g transform="translate(40,230)"><g transform="translate(0,0)"><rect fill="#eceff1" height="60" rx="8" stroke="#b0bec5" width="220" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="110" y="24">用户烧录</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="110" y="44">出厂后再写入内容</text></g><g transform="translate(240,0)"><rect fill="#eceff1" height="60" rx="8" stroke="#b0bec5" width="220" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="110" y="24">仅可写入一次</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="110" y="44">OTP · One-Time Programmable</text></g><g transform="translate(480,0)"><rect fill="#eceff1" height="60" rx="8" stroke="#b0bec5" width="220" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="110" y="24">写入后不可逆</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="110" y="44">熔丝烧断无法恢复</text></g></g></svg>