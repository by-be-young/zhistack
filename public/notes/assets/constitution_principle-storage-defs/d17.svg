<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 800 300"><defs><radialgradient cx="50%" cy="50%" id="discGrad" r="50%"><stop offset="0" stop-color="#eceff1"></stop><stop offset="55%" stop-color="#b0bec5"></stop><stop offset="70%" stop-color="#fff"></stop><stop offset="85%" stop-color="#90a4ae"></stop><stop offset="100%" stop-color="#607d8b"></stop></radialgradient><marker id="cdromArr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker></defs><rect fill="#fff" height="300" width="800"></rect><g transform="translate(150,160)"><circle fill="url(#discGrad)" r="90" stroke="#78909c" stroke-width="2"></circle><circle fill="#fff" r="14" stroke="#78909c" stroke-width="2"></circle><circle fill="#607d8b" r="5"></circle><g fill="none" opacity=".6" stroke="#546e7a" stroke-width=".6"><circle r="24"></circle><circle r="34"></circle><circle r="44"></circle><circle r="54"></circle><circle r="64"></circle><circle r="74"></circle></g><line stroke="#e53935" stroke-width="2" x1="0" x2="0" y1="0" y2="-140"></line><circle cx="0" cy="-140" fill="#e53935" r="8"></circle><text fill="#c62828" font-size="11" font-weight="700" x="20" y="-135">激光读取头</text></g><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="150" y="265">光盘介质</text><text fill="#546e7a" font-size="10" text-anchor="middle" x="150" y="282">凹坑/平面编码数据</text><path d="M280 140h50" marker-end="url(#cdromArr)" stroke="#455a64" stroke-width="2"></path><text fill="#546e7a" font-size="11" text-anchor="middle" x="305" y="128">只读</text><g transform="translate(350,40)"><g transform="translate(0,0)"><rect fill="#eceff1" height="56" rx="8" stroke="#b0bec5" width="210" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="105" y="22">生产时一次写入</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="105" y="40">用户不可修改</text></g><g transform="translate(220,0)"><rect fill="#eceff1" height="56" rx="8" stroke="#b0bec5" width="210" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="105" y="22">非易失性</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="105" y="40">断电数据不丢失</text></g><g transform="translate(0,72)"><rect fill="#eceff1" height="56" rx="8" stroke="#b0bec5" width="210" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="105" y="22">容量约 700 MB</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="105" y="40">激光读取数据</text></g><g transform="translate(220,72)"><rect fill="#eceff1" height="56" rx="8" stroke="#b0bec5" width="210" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="105" y="22">属于外存</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="105" y="40">辅助存储器，非半导体 ROM</text></g><g transform="translate(0,144)"><rect fill="#eceff1" height="56" rx="8" stroke="#b0bec5" width="430" x="0" y="0"></rect><text fill="#263238" font-size="12" font-weight="700" text-anchor="middle" x="215" y="22">访问速度远低于半导体存储器</text><text fill="#546e7a" font-size="11" text-anchor="middle" x="215" y="40">机械旋转 + 光学读取，延迟较高</text></g></g></svg>