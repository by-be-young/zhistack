<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" viewBox="0 0 900 540"><defs><marker id="arr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#444"></path></marker><marker id="arrRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker><marker id="arrGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#1e8449"></path></marker></defs><g transform="translate(30,30)"><rect fill="#fff8e7" height="220" rx="8" stroke="#b9770e" stroke-width="1.2" width="400" x="0" y="0"></rect><text fill="#8a5a06" font-weight="bold" text-anchor="middle" x="200" y="24">① 问题：电容漏电，数据会消失</text><g transform="translate(30,60)"><text fill="#555" font-size="12" text-anchor="middle" x="30" y="0">刚写入</text><line stroke="#333" stroke-width="2.5" x1="10" x2="50" y1="20" y2="20"></line><line stroke="#333" stroke-width="2.5" x1="10" x2="50" y1="34" y2="34"></line><line stroke="#333" stroke-width="1.5" x1="30" x2="30" y1="8" y2="20"></line><line stroke="#333" stroke-width="1.5" x1="30" x2="30" y1="34" y2="46"></line><text fill="#c0392b" font-size="11" text-anchor="middle" x="30" y="30">+ + +</text><text fill="#1e8449" font-size="12" font-weight="bold" text-anchor="middle" x="30" y="66">1 (满电荷)</text></g><g transform="translate(90,90)"><line marker-end="url(#arrRed)" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5" x1="0" x2="60" y1="0" y2="0"></line><text fill="#c0392b" font-size="11" text-anchor="middle" x="30" y="-6">时间流逝</text><text fill="#c0392b" font-size="11" text-anchor="middle" x="30" y="16">电容漏电</text></g><g transform="translate(160,60)"><text fill="#555" font-size="12" text-anchor="middle" x="30" y="0">几十 ms 后</text><line stroke="#333" stroke-width="2.5" x1="10" x2="50" y1="20" y2="20"></line><line stroke="#333" stroke-width="2.5" x1="10" x2="50" y1="34" y2="34"></line><line stroke="#333" stroke-width="1.5" x1="30" x2="30" y1="8" y2="20"></line><line stroke="#333" stroke-width="1.5" x1="30" x2="30" y1="34" y2="46"></line><text fill="#c0392b" font-size="11" text-anchor="middle" x="30" y="30">+</text><text fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle" x="30" y="66">? (电荷不足)</text></g><g transform="translate(240,60)"><text fill="#555" font-size="12" text-anchor="middle" x="70" y="0">电荷 vs 时间</text><line stroke="#666" x1="10" x2="140" y1="90" y2="90"></line><line stroke="#666" x1="10" x2="10" y1="10" y2="90"></line><text fill="#666" font-size="10" text-anchor="middle" x="10" y="105">0</text><text fill="#666" font-size="10" x="150" y="94">t</text><text fill="#666" font-size="10" text-anchor="end" x="4" y="14">Q</text><path d="M10 15Q55 30 90 60t50 28" fill="none" stroke="#c0392b" stroke-width="2"></path><line stroke="#999" stroke-dasharray="3,3" stroke-width="1" x1="10" x2="140" y1="55" y2="55"></line><text fill="#999" font-size="10" x="142" y="58">阈值</text><text fill="#c0392b" font-size="11" text-anchor="middle" x="70" y="130">跌破阈值 → 无法判定 0/1</text></g></g><g transform="translate(470,30)"><rect fill="#e8f8f0" height="220" rx="8" stroke="#1e8449" stroke-width="1.2" width="400" x="0" y="0"></rect><text fill="#186a3b" font-weight="bold" text-anchor="middle" x="200" y="24">② 解决：由内存控制器周期性刷新</text><g transform="translate(20,50)"><rect fill="#fff" height="46" rx="6" stroke="#1e8449" stroke-width="1.5" width="110" x="0" y="0"></rect><text fill="#186a3b" font-weight="bold" text-anchor="middle" x="55" y="20">内存控制器</text><text fill="#555" font-size="11" text-anchor="middle" x="55" y="36">Memory Controller</text></g><line marker-end="url(#arrGreen)" stroke="#1e8449" stroke-width="1.5" x1="130" x2="200" y1="73" y2="73"></line><text fill="#186a3b" font-size="11" text-anchor="middle" x="165" y="66">发出刷新命令</text><g transform="translate(210,50)"><rect fill="#fff" height="46" rx="6" stroke="#1e8449" stroke-width="1.5" width="170" x="0" y="0"></rect><text fill="#186a3b" font-weight="bold" text-anchor="middle" x="85" y="20">DRAM 阵列</text><text fill="#555" font-size="11" text-anchor="middle" x="85" y="36">在规定时间内每行刷新一次</text></g><g transform="translate(30,120)"><text fill="#186a3b" font-size="12" font-weight="bold" x="0" y="0">刷新本质：读出一行 → 感应放大 → 写回同一行</text><g transform="translate(0,16)"><rect fill="#fff" height="60" rx="4" stroke="#7f8c8d" width="88" x="0" y="0"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="44" y="18">1. 读取</text><text fill="#666" font-size="10" text-anchor="middle" x="44" y="34">激活字线</text><text fill="#666" font-size="10" text-anchor="middle" x="44" y="48">读出微弱信号</text></g><line marker-end="url(#arr)" stroke="#555" stroke-width="1.5" x1="90" x2="110" y1="46" y2="46"></line><g transform="translate(112,16)"><rect fill="#fff" height="60" rx="4" stroke="#7f8c8d" width="98" x="0" y="0"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="49" y="18">2. 感应放大</text><text fill="#666" font-size="10" text-anchor="middle" x="49" y="34">Sense Amplifier</text><text fill="#666" font-size="10" text-anchor="middle" x="49" y="48">恢复为 0/1</text></g><line marker-end="url(#arr)" stroke="#555" stroke-width="1.5" x1="212" x2="232" y1="46" y2="46"></line><g transform="translate(234,16)"><rect fill="#fff" height="60" rx="4" stroke="#7f8c8d" width="98" x="0" y="0"></rect><text fill="#333" font-size="11" font-weight="bold" text-anchor="middle" x="49" y="18">3. 写回</text><text fill="#666" font-size="10" text-anchor="middle" x="49" y="34">重新充电到</text><text fill="#666" font-size="10" text-anchor="middle" x="49" y="48">满电荷状态</text></g></g></g><g transform="translate(30,280)"><rect fill="#eef4fb" height="250" rx="8" stroke="#2c6da3" stroke-width="1.2" width="840" x="0" y="0"></rect><text fill="#1e4a70" font-weight="bold" text-anchor="middle" x="420" y="24">③ 刷新单位是"行"：同一字线上的所有 Cell 一次性刷新</text><g transform="translate(40,50)"><text fill="#c0392b" font-size="11" font-weight="bold" text-anchor="end" x="-48" y="14">字线</text><g id="matrix"><rect fill="#fff" height="160" stroke="#2c6da3" stroke-width="1.5" width="360" x="0" y="0"></rect><g stroke="#c8d4e0" stroke-width=".8"><line x1="45" x2="45" y1="0" y2="160"></line><line x1="90" x2="90" y1="0" y2="160"></line><line x1="135" x2="135" y1="0" y2="160"></line><line x1="180" x2="180" y1="0" y2="160"></line><line x1="225" x2="225" y1="0" y2="160"></line><line x1="270" x2="270" y1="0" y2="160"></line><line x1="315" x2="315" y1="0" y2="160"></line></g><g stroke="#c8d4e0" stroke-width=".8"><line x1="0" x2="360" y1="20" y2="20"></line><line x1="0" x2="360" y1="40" y2="40"></line><line x1="0" x2="360" y1="60" y2="60"></line><line x1="0" x2="360" y1="80" y2="80"></line><line x1="0" x2="360" y1="100" y2="100"></line><line x1="0" x2="360" y1="120" y2="120"></line><line x1="0" x2="360" y1="140" y2="140"></line></g><rect fill="#f39c12" height="20" opacity=".55" width="360" x="0" y="60"></rect><g fill="#b9770e"><circle cx="22" cy="70" r="4"></circle><circle cx="67" cy="70" r="4"></circle><circle cx="112" cy="70" r="4"></circle><circle cx="157" cy="70" r="4"></circle><circle cx="202" cy="70" r="4"></circle><circle cx="247" cy="70" r="4"></circle><circle cx="292" cy="70" r="4"></circle><circle cx="337" cy="70" r="4"></circle></g><g fill="#666" font-size="10" text-anchor="end"><text x="-4" y="14">Row 0</text><text x="-4" y="34">Row 1</text><text x="-4" y="54">Row 2</text><text fill="#b9770e" font-weight="bold" x="-4" y="74">Row 3 ★</text><text x="-4" y="94">Row 4</text><text x="-4" y="114">...</text><text x="-2" y="134">Row n-2</text><text x="-2" y="154">Row n-1</text></g><rect fill="#dfe8f2" height="22" stroke="#2c6da3" stroke-width="1" width="360" x="0" y="170"></rect><text fill="#1e4a70" font-size="11" font-weight="bold" text-anchor="middle" x="180" y="185">感应放大器阵列 (Sense Amplifier Row)</text><text fill="#1e4a70" font-size="11" font-weight="bold" text-anchor="middle" x="180" y="-6">位线 → 每列一条</text></g></g><g transform="translate(440,60)"><text fill="#1e4a70" font-weight="bold" x="0" y="0">为什么按行刷新？</text><text fill="#333" font-size="12" x="0" y="22">• 同一行的所有 Cell 共享一条<tspan fill="#c0392b" font-weight="bold">字线</tspan></text><text fill="#333" font-size="12" x="0" y="42">• 激活一次字线，整行 Cell 全部导通</text><text fill="#333" font-size="12" x="0" y="62">• 每列的感应放大器同时读出并写回</text><text fill="#333" font-size="12" x="0" y="82">• 一次刷新 = 恢复整行电荷</text><line stroke="#b0bec5" x1="0" x2="360" y1="100" y2="100"></line><text fill="#186a3b" font-weight="bold" x="0" y="122">约束条件</text><text fill="#333" font-size="12" x="0" y="144">• 刷新周期通常为<tspan font-weight="bold">64 ms</tspan>左右</text><text fill="#333" font-size="12" x="0" y="164">• 期间必须保证<tspan font-weight="bold">每一行至少刷新 1 次</tspan></text><text fill="#c0392b" font-size="12" x="0" y="184">• 正被刷新的存储体无法响应读/写请求</text></g></g></svg>