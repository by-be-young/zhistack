<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 880 600"><defs><lineargradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8f1"></stop><stop offset="100%" stop-color="#ffe7d1"></stop></lineargradient><lineargradient id="gate" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffb74d"></stop><stop offset="100%" stop-color="#f57c00"></stop></lineargradient><lineargradient id="float" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd54f"></stop><stop offset="100%" stop-color="#fbc02d"></stop></lineargradient><lineargradient id="card" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="100%" stop-color="#fff3e0"></stop></lineargradient><lineargradient id="nand" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ede7f6"></stop><stop offset="100%" stop-color="#d1c4e9"></stop></lineargradient><lineargradient id="nor" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0f2f1"></stop><stop offset="100%" stop-color="#b2dfdb"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><fegaussianblur in="SourceAlpha" stddeviation="2.2"></fegaussianblur><feoffset dx="0" dy="2" result="off"></feoffset><fecomponenttransfer><fefunca slope=".18" type="linear"></fefunca></fecomponenttransfer><femerge><femergenode></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter><marker id="arr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#5d4037"></path></marker><radialgradient cx="50%" cy="50%" id="elec" r="50%"><stop offset="0" stop-color="#fff59d"></stop><stop offset="100%" stop-color="#f9a825"></stop></radialgradient></defs><rect fill="url(#bg)" height="600" width="880"></rect><text fill="#bf360c" font-size="22" font-weight="700" text-anchor="middle" x="440" y="36">Flash 存储器 · Floating-Gate 浮栅晶体管</text><text fill="#6d4c41" font-size="12" text-anchor="middle" x="440" y="58">非易失性 · 电擦写 · 用于 SSD / U盘 / 手机存储</text><g transform="translate(50,90)"><rect fill="#fff" filter="url(#shadow)" height="320" rx="12" stroke="#ffcc80" width="380" x="0" y="0"></rect><text fill="#bf360c" font-size="14" font-weight="700" text-anchor="middle" x="190" y="26">浮栅晶体管 (Floating Gate MOSFET)</text><g transform="translate(40,42)"><line stroke="#37474f" stroke-width="2" x1="150" x2="150" y1="20" y2="44"></line><circle cx="150" cy="18" fill="#37474f" r="3"></circle><text fill="#37474f" font-size="10" x="158" y="22">CG</text><rect fill="url(#gate)" height="22" rx="3" stroke="#e65100" width="140" x="80" y="44"></rect><text fill="#fff" font-size="11" font-weight="700" text-anchor="middle" x="150" y="59">Control Gate · 控制栅</text><rect fill="#b3e5fc" height="10" stroke="#4fc3f7" width="140" x="80" y="70"></rect><rect fill="url(#float)" height="34" rx="3" stroke="#f57f17" width="140" x="80" y="82"></rect><text fill="#5d4037" font-size="11" font-weight="700" text-anchor="middle" x="150" y="95">Floating Gate · 浮栅</text><g><circle cx="105" cy="108" fill="url(#elec)" r="4" stroke="#e65100"></circle><text fill="#5d4037" font-size="7" font-weight="700" text-anchor="middle" x="105" y="111">e⁻</text><circle cx="135" cy="108" fill="url(#elec)" r="4" stroke="#e65100"></circle><text fill="#5d4037" font-size="7" font-weight="700" text-anchor="middle" x="135" y="111">e⁻</text><circle cx="165" cy="108" fill="url(#elec)" r="4" stroke="#e65100"></circle><text fill="#5d4037" font-size="7" font-weight="700" text-anchor="middle" x="165" y="111">e⁻</text><circle cx="195" cy="108" fill="url(#elec)" r="4" stroke="#e65100"></circle><text fill="#5d4037" font-size="7" font-weight="700" text-anchor="middle" x="195" y="111">e⁻</text></g><rect fill="#b3e5fc" height="12" stroke="#4fc3f7" width="140" x="80" y="120"></rect><text fill="#01579b" font-size="9" x="222" y="130">隧穿氧化层</text><rect fill="#cfd8dc" height="22" stroke="#90a4ae" width="60" x="10" y="132"></rect><text fill="#263238" font-size="10" font-weight="700" text-anchor="middle" x="40" y="148">Source</text><text fill="#37474f" font-size="10" text-anchor="middle" x="40" y="184">源极 (S)</text><rect fill="#cfd8dc" height="22" stroke="#90a4ae" width="60" x="230" y="132"></rect><text fill="#263238" font-size="10" font-weight="700" text-anchor="middle" x="260" y="148">Drain</text><text fill="#37474f" font-size="10" text-anchor="middle" x="260" y="184">漏极 (D)</text><rect fill="#eceff1" height="20" stroke="#b0bec5" width="300" x="0" y="154"></rect><text fill="#37474f" font-size="10" font-weight="600" text-anchor="middle" x="150" y="168">P-Substrate (硅衬底)</text><path d="M150 147q0-15 0-27" fill="none" marker-end="url(#arr)" stroke="#d84315" stroke-dasharray="3 2" stroke-width="1.5"></path><text fill="#d84315" font-size="9" x="190" y="142">隧穿</text></g><g transform="translate(20,256)"><rect fill="#fff3e0" height="48" rx="6" stroke="#ef6c00" width="170" x="0" y="0"></rect><circle cx="22" cy="24" fill="#f57c00" r="8"></circle><text fill="#fff" font-size="10" font-weight="700" text-anchor="middle" x="22" y="28">e⁻</text><text fill="#bf360c" font-size="11" font-weight="700" x="42" y="20">有电荷</text><text fill="#6d4c41" font-size="10" x="42" y="36">表示 逻辑 0</text><rect fill="#e8f5e9" height="48" rx="6" stroke="#2e7d32" width="170" x="190" y="0"></rect><circle cx="212" cy="24" fill="#fff" r="8" stroke="#9e9e9e"></circle><text fill="#1b5e20" font-size="11" font-weight="700" x="232" y="20">无电荷</text><text fill="#37474f" font-size="10" x="232" y="36">表示 逻辑 1</text></g></g><g transform="translate(460,90)"><rect fill="url(#card)" filter="url(#shadow)" height="135" rx="10" stroke="#ffcc80" width="370" x="0" y="0"></rect><text fill="#bf360c" font-size="14" font-weight="700" x="20" y="26">三种基本操作</text><g transform="translate(20,42)"><rect fill="#e3f2fd" height="78" rx="8" stroke="#1e88e5" width="100" x="0" y="0"></rect><text fill="#0d47a1" font-size="12" font-weight="700" text-anchor="middle" x="50" y="20">读 Read</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="40">检测阈值电压</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="56">速度快</text><text fill="#2e7d32" font-size="10" font-weight="700" text-anchor="middle" x="50" y="70">⚡ 单元级</text></g><g transform="translate(135,42)"><rect fill="#fff3e0" height="78" rx="8" stroke="#ef6c00" width="100" x="0" y="0"></rect><text fill="#bf360c" font-size="12" font-weight="700" text-anchor="middle" x="50" y="20">写 Program</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="40">注入电子到浮栅</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="56">1 → 0</text><text fill="#37474f" font-size="10" font-weight="700" text-anchor="middle" x="50" y="70">页级写入</text></g><g transform="translate(250,42)"><rect fill="#ffebee" height="78" rx="8" stroke="#c62828" width="100" x="0" y="0"></rect><text fill="#b71c1c" font-size="12" font-weight="700" text-anchor="middle" x="50" y="20">擦 Erase</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="40">抽走电子，全置 1</text><text fill="#37474f" font-size="10" text-anchor="middle" x="50" y="56">0 → 1</text><text fill="#c62828" font-size="10" font-weight="700" text-anchor="middle" x="50" y="70">块级擦除</text></g></g><g transform="translate(460,240)"><rect fill="#fff" filter="url(#shadow)" height="170" rx="10" stroke="#ffcc80" width="370" x="0" y="0"></rect><text fill="#bf360c" font-size="14" font-weight="700" x="20" y="26">两大类型</text><g transform="translate(20,40)"><rect fill="url(#nand)" height="115" rx="8" stroke="#7e57c2" width="160" x="0" y="0"></rect><text fill="#4527a0" font-size="13" font-weight="800" text-anchor="middle" x="80" y="24">NAND Flash</text><text fill="#5e35b1" font-size="10" text-anchor="middle" x="80" y="50">串联结构 · 密度高</text><text fill="#5e35b1" font-size="10" text-anchor="middle" x="80" y="68">顺序读快 · 容量大</text><text fill="#4527a0" font-size="10" font-weight="700" text-anchor="middle" x="80" y="100">SSD · U盘 · SD卡</text><rect fill="url(#nor)" height="115" rx="8" stroke="#26a69a" width="160" x="170" y="0"></rect><text fill="#00695c" font-size="13" font-weight="800" text-anchor="middle" x="250" y="24">NOR Flash</text><text fill="#00796b" font-size="10" text-anchor="middle" x="250" y="50">并联结构 · 可随机读</text><text fill="#00796b" font-size="10" text-anchor="middle" x="250" y="68">支持就地执行 (XIP)</text><text fill="#00695c" font-size="10" font-weight="700" text-anchor="middle" x="250" y="100">BIOS · 嵌入式固件</text></g></g><g transform="translate(50,435)"><rect fill="#fff" filter="url(#shadow)" height="150" rx="10" stroke="#ffcc80" width="780" x="0" y="0"></rect><text fill="#bf360c" font-size="14" font-weight="700" x="16" y="26">速度 / 性能定位</text><g transform="translate(40,46)"><text fill="#37474f" font-size="11" x="-20" y="14">RAM</text><rect fill="#42a5f5" height="16" rx="4" width="540" x="30" y="2"></rect><text fill="#1565c0" font-size="10" font-weight="700" x="578" y="14">最快</text><text fill="#37474f" font-size="11" x="-20" y="40">Flash</text><rect fill="url(#gate)" height="16" rx="4" width="280" x="30" y="28"></rect><text fill="#bf360c" font-size="10" font-weight="700" x="318" y="40">中等（比 HDD 快得多）</text><text fill="#37474f" font-size="11" x="-20" y="66">HDD</text><rect fill="#a1887f" height="16" rx="4" width="100" x="30" y="54"></rect><text fill="#5d4037" font-size="10" font-weight="700" x="138" y="66">最慢</text></g><g transform="translate(40,138)"><text fill="#6d4c41" font-size="11" x="0" y="0"><tspan fill="#bf360c" font-weight="700">优势：</tspan>非易失 · 无机械结构 · 抗震 · 低功耗 · 体积小 · 速度远超机械硬盘</text></g></g></svg>