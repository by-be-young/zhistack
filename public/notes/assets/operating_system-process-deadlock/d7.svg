<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" viewBox="0 0 900 640"><defs><lineargradient id="bgGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" stop-color="#f8fafc"></stop><stop offset="100%" stop-color="#eef2f7"></stop></lineargradient><lineargradient id="detectGrad" x1="0" x2="100%" y1="0" y2="100%"><stop offset="0" stop-color="#6366f1"></stop><stop offset="100%" stop-color="#8b5cf6"></stop></lineargradient><lineargradient id="recoverGrad" x1="0" x2="100%" y1="0" y2="100%"><stop offset="0" stop-color="#10b981"></stop><stop offset="100%" stop-color="#059669"></stop></lineargradient><lineargradient id="titleGrad" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" stop-color="#1e293b"></stop><stop offset="100%" stop-color="#475569"></stop></lineargradient><filter height="140%" id="shadow" width="140%" x="-20%" y="-20%"><fegaussianblur in="SourceAlpha" stddeviation="3"></fegaussianblur><feoffset dx="0" dy="2"></feoffset><fecomponenttransfer><fefunca slope=".18" type="linear"></fefunca></fecomponenttransfer><femerge><femergenode></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#475569"></path></marker><marker id="arrowRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#ef4444"></path></marker></defs><rect fill="url(#bgGrad)" height="640" width="900"></rect><rect fill="url(#titleGrad)" height="58" width="900" x="0" y="0"></rect><text fill="#fff" font-size="22" font-weight="700" letter-spacing="1" text-anchor="middle" x="450" y="37">死锁的检测与解除 · Deadlock Detection &amp; Recovery</text><g transform="translate(30, 80)"><rect fill="#fff" filter="url(#shadow)" height="540" rx="14" stroke="#e2e8f0" stroke-width="1" width="420"></rect><rect fill="url(#detectGrad)" height="44" rx="14" width="420"></rect><rect fill="url(#detectGrad)" height="14" width="420" y="30"></rect><text fill="#fff" font-size="16" font-weight="700" x="20" y="29">① 死锁检测 (Detection)</text><text fill="#fff" font-size="13" opacity=".85" text-anchor="end" x="400" y="29">资源分配图 · DFS 找环</text><text fill="#475569" font-size="13" x="20" y="72">将进程与资源建模为有向图，环 = 死锁</text><g transform="translate(20, 90)"><rect fill="#f8fafc" height="220" rx="10" stroke="#cbd5e1" stroke-dasharray="4 3" width="380"></rect><text fill="#64748b" font-size="11" font-weight="600" x="10" y="18">资源分配图示例</text><circle cx="80" cy="80" fill="#dbeafe" r="22" stroke="#3b82f6" stroke-width="2"></circle><text fill="#1e40af" font-size="14" font-weight="700" text-anchor="middle" x="80" y="85">P1</text><circle cx="300" cy="80" fill="#dbeafe" r="22" stroke="#3b82f6" stroke-width="2"></circle><text fill="#1e40af" font-size="14" font-weight="700" text-anchor="middle" x="300" y="85">P2</text><rect fill="#fef3c7" height="36" rx="4" stroke="#f59e0b" stroke-width="2" width="44" x="58" y="160"></rect><circle cx="80" cy="178" fill="#92400e" r="3"></circle><text fill="#92400e" font-size="12" font-weight="700" text-anchor="middle" x="80" y="153">R1</text><rect fill="#fef3c7" height="36" rx="4" stroke="#f59e0b" stroke-width="2" width="44" x="278" y="160"></rect><circle cx="300" cy="178" fill="#92400e" r="3"></circle><text fill="#92400e" font-size="12" font-weight="700" text-anchor="middle" x="300" y="153">R2</text><path d="M1e2 90q1e2-30 180 75" fill="none" marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="2"></path><text fill="#ef4444" font-size="11" font-weight="600" x="190" y="62">请求</text><path d="M3e2 158V105" fill="none" marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="2"></path><path d="M280 90q-80 30-178 75" fill="none" marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="2"></path><text fill="#ef4444" font-size="11" font-weight="600" x="190" y="135">请求</text><path d="M80 158V105" fill="none" marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="2"></path><g transform="translate(155, 200)"><rect fill="#fee2e2" height="22" rx="11" stroke="#ef4444" width="70"></rect><text fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle" x="35" y="15">存在环路</text></g><g transform="translate(230, 14)"><circle cx="6" cy="6" fill="#dbeafe" r="5" stroke="#3b82f6"></circle><text fill="#475569" font-size="10" x="16" y="10">进程</text><rect fill="#fef3c7" height="10" stroke="#f59e0b" width="10" x="48" y="1"></rect><text fill="#475569" font-size="10" x="63" y="10">资源</text><line marker-end="url(#arrowRed)" stroke="#ef4444" stroke-width="2" x1="92" x2="118" y1="6" y2="6"></line><text fill="#475569" font-size="10" x="125" y="10">边</text></g></g><g transform="translate(20, 330)"><text fill="#1e293b" font-size="13" font-weight="700">检测步骤</text><g transform="translate(0, 14)"><circle cx="10" cy="10" fill="#eef2ff" r="9" stroke="#6366f1"></circle><text fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle" x="10" y="14">1</text><text fill="#334155" font-size="12" x="28" y="14">为请求/分配关系建立有向边</text></g><g transform="translate(0, 42)"><circle cx="10" cy="10" fill="#eef2ff" r="9" stroke="#6366f1"></circle><text fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle" x="10" y="14">2</text><text fill="#334155" font-size="12" x="28" y="14">对资源分配图执行 DFS / 简化</text></g><g transform="translate(0, 70)"><circle cx="10" cy="10" fill="#eef2ff" r="9" stroke="#6366f1"></circle><text fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle" x="10" y="14">3</text><text fill="#334155" font-size="12" x="28" y="14">若存在环 → 系统已死锁</text></g><g transform="translate(0, 98)"><circle cx="10" cy="10" fill="#eef2ff" r="9" stroke="#6366f1"></circle><text fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle" x="10" y="14">4</text><text fill="#334155" font-size="12" x="28" y="14">环中进程即为死锁进程</text></g></g><g transform="translate(20, 455)"><rect fill="#f1f5f9" height="64" rx="8" stroke="#cbd5e1" width="380"></rect><text fill="#0f172a" font-size="11" font-weight="700" x="12" y="20">📌 小贴士</text><text fill="#475569" font-size="11" x="12" y="38">• 单实例资源：图中有环 ⇔ 死锁</text><text fill="#475569" font-size="11" x="12" y="54">• 多实例资源：有环只是必要条件，需进一步简化</text></g></g><g transform="translate(470, 80)"><rect fill="#fff" filter="url(#shadow)" height="540" rx="14" stroke="#e2e8f0" stroke-width="1" width="400"></rect><rect fill="url(#recoverGrad)" height="44" rx="14" width="400"></rect><rect fill="url(#recoverGrad)" height="14" width="400" y="30"></rect><text fill="#fff" font-size="16" font-weight="700" x="20" y="29">② 死锁解除 (Recovery)</text><text fill="#fff" font-size="13" opacity=".9" text-anchor="end" x="380" y="29">打破环路 · 恢复运行</text><text fill="#475569" font-size="13" x="20" y="72">检测到死锁后，需采取措施使系统脱离死锁状态</text><g transform="translate(20, 90)"><g><rect fill="#f0fdf4" height="90" rx="10" stroke="#86efac" width="360"></rect><rect fill="#10b981" height="90" rx="3" width="6"></rect><text fill="#065f46" font-size="14" font-weight="700" x="20" y="26">资源剥夺法</text><text fill="#334155" font-size="12" x="20" y="48">从某些死锁进程中强制抢占资源，</text><text fill="#334155" font-size="12" x="20" y="66">分配给其他死锁进程使其继续执行。</text><text fill="#64748b" font-size="11" x="20" y="82">⚠ 被剥夺进程可能进入饥饿状态</text></g><g transform="translate(0, 105)"><rect fill="#eff6ff" height="90" rx="10" stroke="#93c5fd" width="360"></rect><rect fill="#3b82f6" height="90" rx="3" width="6"></rect><text fill="#1e40af" font-size="14" font-weight="700" x="20" y="26">撤销进程法</text><text fill="#334155" font-size="12" x="20" y="48">强制撤销部分（甚至全部）死锁进程，</text><text fill="#334155" font-size="12" x="20" y="66">释放其占有的全部资源。</text><text fill="#64748b" font-size="11" x="20" y="82">⚠ 实现简单，但代价较大</text></g><g transform="translate(0, 210)"><rect fill="#fef3c7" height="90" rx="10" stroke="#fcd34d" width="360"></rect><rect fill="#f59e0b" height="90" rx="3" width="6"></rect><text fill="#92400e" font-size="14" font-weight="700" x="20" y="26">进程回退法</text><text fill="#334155" font-size="12" x="20" y="48">让一个或多个死锁进程回退到</text><text fill="#334155" font-size="12" x="20" y="66">足以避开死锁的某个检查点。</text><text fill="#64748b" font-size="11" x="20" y="82">⚠ 需要保存历史信息，开销大</text></g></g><g transform="translate(20, 410)"><rect fill="#faf5ff" height="110" rx="10" stroke="#d8b4fe" width="360"></rect><text fill="#6b21a8" font-size="13" font-weight="700" x="14" y="22">🎯 选择「牺牲品」的准则</text><text fill="#334155" font-size="11.5" x="14" y="44">• 进程优先级</text><text fill="#334155" font-size="11.5" x="14" y="62">• 已运行时间 与 剩余完成时间</text><text fill="#334155" font-size="11.5" x="14" y="80">• 已占有资源数量 与 还需资源数量</text><text fill="#334155" font-size="11.5" x="14" y="98">• 进程类型（交互式 / 批处理）</text></g></g><g><path d="M450 355h20" marker-end="url(#arrow)" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="2"></path></g></svg>