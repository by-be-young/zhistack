<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><lineargradient id="headerGrad" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#2563eb;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1"></stop></lineargradient><lineargradient id="cardGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#f8fafc;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"></stop></lineargradient></defs><rect fill="#f1f5f9" height="600" width="800"></rect><rect fill="url(#headerGrad)" height="50" width="800" x="0" y="0"></rect><text fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="32">死锁预防 (Deadlock Prevention)</text><g transform="translate(40, 80)"><rect fill="url(#cardGrad)" height="120" rx="8" stroke="#cbd5e1" stroke-width="2" width="340" x="0" y="0"></rect><circle cx="25" cy="25" fill="#ef4444" r="8"></circle><text fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="40" y="32">1. 破坏互斥条件</text><text fill="#475569" font-family="Arial, sans-serif" font-size="13" x="15" y="55"><tspan dy="0" x="15">• 资源复制或虚拟化技术</tspan><tspan dy="18" x="15">• 减少资源的互斥使用</tspan><tspan dy="18" x="15">• 某些硬件资源难以避免互斥</tspan></text><g transform="translate(280, 15)"><rect fill="#3b82f6" height="15" rx="2" width="20" x="0" y="0"></rect><rect fill="#3b82f6" height="15" rx="2" width="20" x="25" y="0"></rect><line stroke="#10b981" stroke-width="2" x1="20" x2="25" y1="8" y2="8"></line><text fill="#64748b" font-size="10" text-anchor="middle" x="10" y="30">共享</text></g></g><g transform="translate(420, 80)"><rect fill="url(#cardGrad)" height="120" rx="8" stroke="#cbd5e1" stroke-width="2" width="340" x="0" y="0"></rect><circle cx="25" cy="25" fill="#f59e0b" r="8"></circle><text fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="40" y="32">2. 破坏占有并等待</text><text fill="#475569" font-family="Arial, sans-serif" font-size="13" x="15" y="55"><tspan dy="0" x="15">• 一次性申请所有所需资源</tspan><tspan dy="18" x="15">• 申请失败则释放已分配资源</tspan></text><g transform="translate(280, 15)"><rect fill="#f59e0b" height="12" rx="2" width="12" x="5" y="5"></rect><rect fill="#f59e0b" height="12" rx="2" width="12" x="20" y="5"></rect><rect fill="#f59e0b" height="12" rx="2" width="12" x="35" y="5"></rect><text fill="#64748b" font-size="10" text-anchor="middle" x="26" y="30">一次性</text></g></g><g transform="translate(40, 230)"><rect fill="url(#cardGrad)" height="120" rx="8" stroke="#cbd5e1" stroke-width="2" width="340" x="0" y="0"></rect><circle cx="25" cy="25" fill="#10b981" r="8"></circle><text fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="40" y="32">3. 破坏非抢占</text><text fill="#475569" font-family="Arial, sans-serif" font-size="13" x="15" y="55"><tspan dy="0" x="15">• 允许进程抢占其他进程的资源</tspan><tspan dy="18" x="15">• 需要时可强制回收资源</tspan></text><g transform="translate(280, 15)"><rect fill="#64748b" height="15" rx="2" width="15" x="0" y="0"></rect><rect fill="#10b981" height="15" rx="2" width="15" x="20" y="0"></rect><polygon fill="#ef4444" points="15,8 25,3 25,13"></polygon><text fill="#64748b" font-size="10" text-anchor="middle" x="17" y="30">抢占</text></g></g><g transform="translate(420, 230)"><rect fill="url(#cardGrad)" height="120" rx="8" stroke="#cbd5e1" stroke-width="2" width="340" x="0" y="0"></rect><circle cx="25" cy="25" fill="#8b5cf6" r="8"></circle><text fill="#1e293b" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="40" y="32">4. 破坏循环等待</text><text fill="#475569" font-family="Arial, sans-serif" font-size="13" x="15" y="55"><tspan dy="0" x="15">• 对资源申请顺序进行限制</tspan><tspan dy="18" x="15">• 按固定顺序申请资源</tspan></text><g transform="translate(280, 15)"><circle cx="10" cy="8" fill="#8b5cf6" r="6"></circle><circle cx="25" cy="8" fill="#8b5cf6" r="6"></circle><circle cx="40" cy="8" fill="#8b5cf6" r="6"></circle><text fill="#fff" font-size="8" text-anchor="middle" x="10" y="12">1</text><text fill="#fff" font-size="8" text-anchor="middle" x="25" y="12">2</text><text fill="#fff" font-size="8" text-anchor="middle" x="40" y="12">3</text><text fill="#64748b" font-size="10" text-anchor="middle" x="25" y="30">顺序</text></g></g><g transform="translate(40, 380)"><rect fill="#fef3c7" height="80" rx="8" stroke="#f59e0b" stroke-width="2" width="720" x="0" y="0"></rect><circle cx="25" cy="25" fill="#f59e0b" r="10"></circle><text fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" x="25" y="31">!</text><text fill="#92400e" font-family="Arial, sans-serif" font-size="16" font-weight="bold" x="45" y="32">核心思想</text><text fill="#92400e" font-family="Arial, sans-serif" font-size="14" x="45" y="55">通过破坏死锁产生的四个必要条件中的至少一个，从根本上避免死锁的发生</text></g><g transform="translate(40, 480)"><rect fill="#dcfce7" height="100" rx="8" stroke="#16a34a" stroke-width="2" width="350" x="0" y="0"></rect><text fill="#15803d" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="15" y="25">优点</text><text fill="#15803d" font-family="Arial, sans-serif" font-size="12" x="15" y="45"><tspan dy="0" x="15">• 彻底避免死锁</tspan><tspan dy="16" x="15">• 实现相对简单</tspan><tspan dy="16" x="15">• 易于理解和验证</tspan></text></g><g transform="translate(410, 480)"><rect fill="#fee2e2" height="100" rx="8" stroke="#dc2626" stroke-width="2" width="350" x="0" y="0"></rect><text fill="#dc2626" font-family="Arial, sans-serif" font-size="14" font-weight="bold" x="15" y="25">缺点</text><text fill="#dc2626" font-family="Arial, sans-serif" font-size="12" x="15" y="45"><tspan dy="0" x="15">• 资源利用率低</tspan><tspan dy="16" x="15">• 限制并发度</tspan><tspan dy="16" x="15">• 可能导致饥饿</tspan></text></g></svg>