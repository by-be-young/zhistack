<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><lineargradient id="grad1" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#4A90E2;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"></stop></lineargradient><lineargradient id="grad2" x1="0" x2="100%" y1="0" y2="0"><stop offset="0" style="stop-color:#E85D75;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#D4456E;stop-opacity:1"></stop></lineargradient><filter height="200%" id="shadow" width="200%" x="-50%" y="-50%"><fedropshadow dx="2" dy="2" flood-opacity=".3" stddeviation="3"></fedropshadow></filter></defs><text fill="#2C3E50" font-size="24" font-weight="bold" text-anchor="middle" x="400" y="35">指令长度设计的两大挑战及解决方案</text><line stroke="#BDC3C7" stroke-dasharray="5,5" stroke-width="2" x1="400" x2="400" y1="50" y2="580"></line><g id="fixed-length"><rect fill="url(#grad1)" filter="url(#shadow)" height="50" rx="8" width="340" x="30" y="70"></rect><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="200" y="95">问题 1：地址字段数量不统一</text><text fill="#fff" font-size="12" text-anchor="middle" x="200" y="112">定长指令 · 不同指令需要的地址字段数不同</text><text fill="#2C3E50" font-size="14" font-weight="bold" x="50" y="155">三地址指令</text><g transform="translate(50, 165)"><rect fill="#3498DB" height="35" stroke="#2980B9" stroke-width="2" width="60" x="0" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="30" y="22">操作码</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="60" x="60" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="90" y="22">地址1</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="60" x="120" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="150" y="22">地址2</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="60" x="180" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="210" y="22">地址3</text></g><text fill="#7F8C8D" font-size="11" x="310" y="187">← 刚好填满</text><text fill="#2C3E50" font-size="14" font-weight="bold" x="50" y="230">二地址指令</text><g transform="translate(50, 240)"><rect fill="#3498DB" height="35" stroke="#2980B9" stroke-width="2" width="60" x="0" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="30" y="22">操作码</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="60" x="60" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="90" y="22">地址1</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="60" x="120" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="150" y="22">地址2</text><rect fill="#95A5A6" height="35" stroke="#7F8C8D" stroke-dasharray="3,3" stroke-width="2" width="60" x="180" y="0"></rect><text fill="#555" font-size="10" text-anchor="middle" x="210" y="22">无效字段</text></g><text fill="#E67E22" font-size="11" x="310" y="262">← 需要填充!</text><rect fill="#27AE60" height="40" opacity=".9" rx="6" width="340" x="30" y="300"></rect><text fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" x="200" y="325">✓ 解决方案：无效字段填充</text><g transform="translate(40, 355)"><circle cx="5" cy="0" fill="#27AE60" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="4">指令长度保持一致(如32位)</text><circle cx="5" cy="25" fill="#27AE60" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="29">地址字段不足时用填充值占位</text><circle cx="5" cy="50" fill="#27AE60" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="54">填充值不影响执行,仅用于对齐</text><circle cx="5" cy="75" fill="#27AE60" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="79">简化硬件解码逻辑</text></g><rect fill="#ECF0F1" height="110" rx="6" stroke="#BDC3C7" stroke-width="1.5" width="320" x="40" y="450"></rect><text fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle" x="200" y="472">💡 定长指令的优势</text><text fill="#555" font-size="11" x="55" y="495">• 解码简单：固定位置提取字段</text><text fill="#555" font-size="11" x="55" y="515">• 流水线高效：指令长度可预测</text><text fill="#555" font-size="11" x="55" y="535">• 取指快速：按固定步长即可</text></g><g id="variable-length"><rect fill="url(#grad2)" filter="url(#shadow)" height="50" rx="8" width="340" x="430" y="70"></rect><text fill="#fff" font-size="16" font-weight="bold" text-anchor="middle" x="600" y="95">问题 2：如何识别指令边界</text><text fill="#fff" font-size="12" text-anchor="middle" x="600" y="112">变长指令 · 不同指令长度不同</text><text fill="#2C3E50" font-size="14" font-weight="bold" x="450" y="155">指令流示例</text><g transform="translate(450, 165)"><rect fill="#9B59B6" height="35" stroke="#8E44AD" stroke-width="2" width="30" x="0" y="0"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="15" y="22">前缀</text><rect fill="#3498DB" height="35" stroke="#2980B9" stroke-width="2" width="80" x="30" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="70" y="22">8位指令</text></g><text fill="#7F8C8D" font-size="10" x="565" y="187">16位</text><g transform="translate(450, 215)"><rect fill="#9B59B6" height="35" stroke="#8E44AD" stroke-width="2" width="30" x="0" y="0"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="15" y="22">前缀</text><rect fill="#E67E22" height="35" stroke="#D35400" stroke-width="2" width="150" x="30" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="105" y="22">16位指令</text></g><text fill="#7F8C8D" font-size="10" x="635" y="237">24位</text><g transform="translate(450, 265)"><rect fill="#9B59B6" height="35" stroke="#8E44AD" stroke-width="2" width="30" x="0" y="0"></rect><text fill="#fff" font-size="10" text-anchor="middle" x="15" y="22">前缀</text><rect fill="#E74C3C" height="35" stroke="#C0392B" stroke-width="2" width="250" x="30" y="0"></rect><text fill="#fff" font-size="11" text-anchor="middle" x="155" y="22">32位指令</text></g><text fill="#7F8C8D" font-size="10" x="735" y="287">40位</text><rect fill="#8E44AD" height="40" opacity=".9" rx="6" width="340" x="430" y="320"></rect><text fill="#fff" font-size="15" font-weight="bold" text-anchor="middle" x="600" y="345">✓ 解决方案：指令前缀标识</text><g transform="translate(440, 375)"><circle cx="5" cy="0" fill="#8E44AD" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="4">在指令开头设置前缀字段</text><circle cx="5" cy="25" fill="#8E44AD" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="29">前缀标识该指令的长度/类型</text><circle cx="5" cy="50" fill="#8E44AD" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="54">CPU先读前缀,再提取完整指令</text><circle cx="5" cy="75" fill="#8E44AD" r="3"></circle><text fill="#34495E" font-size="12" x="15" y="79">增加解码复杂度,换取编码灵活性</text></g><rect fill="#ECF0F1" height="90" rx="6" stroke="#BDC3C7" stroke-width="1.5" width="320" x="440" y="470"></rect><text fill="#2C3E50" font-size="13" font-weight="bold" text-anchor="middle" x="600" y="492">💡 变长指令的优势</text><text fill="#555" font-size="11" x="455" y="515">• 编码紧凑：指令密度更高</text><text fill="#555" font-size="11" x="455" y="535">• 功能丰富：可支持复杂操作</text></g><rect fill="#3498DB" height="2" opacity=".3" width="700" x="50" y="575"></rect></svg>