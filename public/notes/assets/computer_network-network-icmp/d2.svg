<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" viewBox="0 0 900 560"><text class="title" font-size="20" text-anchor="middle" x="450" y="30">ICMP 消息类型分类</text><rect class="root" height="44" rx="8" width="140" x="380" y="55"></rect><text class="label-w" text-anchor="middle" x="450" y="83">ICMP 消息</text><path class="edge" d="M450 99q-230 31-230 51"></path><path class="edge" d="M450 99q230 31 230 51"></path><rect class="err" height="42" rx="8" width="200" x="120" y="150"></rect><text class="label-w" text-anchor="middle" x="220" y="177">差错报文 (Error)</text><rect class="qry" height="42" rx="8" width="200" x="580" y="150"></rect><text class="label-w" text-anchor="middle" x="680" y="177">查询报文 (Query)</text><g><path class="edge" d="M220 192v23H60v20"></path><path class="edge" d="M220 192v23H165v20"></path><path class="edge" d="M220 192v23h55v20"></path><path class="edge" d="M220 192v23H385v20"></path><path class="edge" d="M220 215V320H60v20"></path><rect class="sub" height="60" rx="6" width="100" x="20" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="70" y="255">终点不可达</text><text class="desc" text-anchor="middle" x="70" y="273">Type 3</text><text class="desc" text-anchor="middle" x="70" y="287">网络/主机/端口</text><rect class="sub" height="60" rx="6" width="100" x="125" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="175" y="255">源点抑制</text><text class="desc" text-anchor="middle" x="175" y="273">Type 4</text><text class="desc" text-anchor="middle" x="175" y="287">网络拥塞</text><rect class="sub" height="60" rx="6" width="100" x="230" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="280" y="255">路由重定向</text><text class="desc" text-anchor="middle" x="280" y="273">Type 5</text><text class="desc" text-anchor="middle" x="280" y="287">告知更优路径</text><rect class="sub" height="60" rx="6" width="100" x="335" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="385" y="255">超时</text><text class="desc" text-anchor="middle" x="385" y="273">Type 11</text><text class="desc" text-anchor="middle" x="385" y="287">TTL=0 / 分片超时</text><rect class="sub" height="60" rx="6" width="100" x="20" y="340"></rect><text class="label" font-weight="bold" text-anchor="middle" x="70" y="360">参数错误</text><text class="desc" text-anchor="middle" x="70" y="378">Type 12</text><text class="desc" text-anchor="middle" x="70" y="392">IP 头字段错</text></g><g><path class="edge" d="M680 192v23H530v20"></path><path class="edge" d="M680 192v23h0v20"></path><path class="edge" d="M680 192v23H830v20"></path><rect class="sub" height="60" rx="6" width="100" x="480" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="530" y="253">Echo</text><text class="desc" text-anchor="middle" x="530" y="270">Req=8 / Rep=0</text><text class="desc" text-anchor="middle" x="530" y="285">ping 工具</text><rect class="sub" height="60" rx="6" width="100" x="630" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="680" y="253">Timestamp</text><text class="desc" text-anchor="middle" x="680" y="270">Type 13/14</text><text class="desc" text-anchor="middle" x="680" y="285">时间同步</text><rect class="sub" height="60" rx="6" width="100" x="780" y="235"></rect><text class="label" font-weight="bold" text-anchor="middle" x="830" y="253">Address Mask</text><text class="desc" text-anchor="middle" x="830" y="270">Type 17/18</text><text class="desc" text-anchor="middle" x="830" y="285">子网掩码查询</text></g><rect fill="#ecf0f1" height="100" rx="8" width="780" x="60" y="430"></rect><text fill="#2c3e50" font-size="14" font-weight="bold" x="80" y="455">两类报文的对比</text><text class="label" x="80" y="478">• 差错报文：被动触发，由路由器/主机在<tspan fill="#e74c3c" font-weight="bold">出错</tspan>时回送给源主机</text><text class="label" x="80" y="498">• 查询报文：主动发起，用于<tspan fill="#27ae60" font-weight="bold">诊断</tspan>网络可达性、时延、配置信息</text><text class="label" x="80" y="518">• 应用层工具：<tspan font-weight="bold">ping</tspan>= Echo Request/Reply ；<tspan font-weight="bold">traceroute</tspan>= TTL 递增触发 Time Exceeded</text></svg>