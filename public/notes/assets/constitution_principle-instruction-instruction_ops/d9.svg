<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="12" viewBox="0 0 880 330"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#555"></path></marker><marker id="b" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#4a90e2"></path></marker></defs><text class="h" font-size="16" text-anchor="middle" x="440" y="26">陷阱指令 INT n 的执行流程</text><line class="divider" x1="40" x2="840" y1="180" y2="180"></line><text class="lbl" fill="#c0392b" x="50" y="170">用户态 (Ring 3)</text><text class="lbl" fill="#c0392b" x="50" y="200">内核态 (Ring 0)</text><g><rect class="user" height="90" rx="6" width="180" x="40" y="60"></rect><text class="h" text-anchor="middle" x="130" y="80">① 用户程序</text><text class="mono" x="50" y="105">mov eax, 1</text><text class="mono" x="50" y="122">mov ebx, 0</text><text class="mono" fill="#c0392b" x="50" y="139">int 0x80 ; 触发陷阱</text></g><g><rect class="ivt" height="110" rx="6" width="200" x="260" y="210"></rect><text class="h" text-anchor="middle" x="360" y="232">② IVT / IDT 查表</text><text class="lbl" text-anchor="middle" x="360" y="252">用 n 作索引找处理程序地址</text><g class="mono"><text x="275" y="275">0x00 → handler0</text><text x="275" y="291">0x01 → handler1</text><text fill="#c0392b" x="275" y="307">0x80 → sys_call_handler</text></g></g><g><rect class="handler" height="110" rx="6" width="220" x="500" y="210"></rect><text class="h" text-anchor="middle" x="610" y="232">③ 内核处理程序</text><text class="mono" x="510" y="255">push 寄存器现场</text><text class="mono" x="510" y="272">根据 eax 分派 syscall</text><text class="mono" x="510" y="289">执行特权操作 (I/O, exit…)</text><text class="mono" x="510" y="306">恢复现场 / iret</text></g><g><rect class="kernel" height="90" rx="6" width="200" x="260" y="60"></rect><text class="h" text-anchor="middle" x="360" y="80">CPU 硬件自动动作</text><text class="mono" x="270" y="103">push EFLAGS</text><text class="mono" x="270" y="120">push CS : EIP (返回地址)</text><text class="mono" x="270" y="137">切换到 Ring 0 + 内核栈</text></g><g><rect class="user" height="90" rx="6" width="220" x="500" y="60"></rect><text class="h" text-anchor="middle" x="610" y="80">④ iret 返回用户程序</text><text class="mono" x="510" y="105">pop EIP, CS, EFLAGS</text><text class="mono" x="510" y="122">切回 Ring 3</text><text class="mono" x="510" y="139">继续执行 int 后下一条指令</text></g><path class="arrow" d="M220 115h40"></path><path class="arrow" d="M360 150v60"></path><path class="arrow" d="M460 265h40"></path><path class="arrow" d="M610 210V150"></path><path class="ret" d="M5e2 105c-120 0-2e2-10-280-10"></path><text class="lbl" fill="#4a90e2" text-anchor="middle" x="360" y="50">iret 返回路径</text></svg>