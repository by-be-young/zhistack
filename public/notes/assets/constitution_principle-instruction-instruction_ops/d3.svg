<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, Helvetica, sans-serif" font-size="12" viewBox="0 0 820 420"><defs><marker id="a" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#555"></path></marker></defs><text class="h" font-size="16" text-anchor="middle" x="410" y="26">x86 乘除法：EDX:EAX 隐式寄存器对的数据通路</text><g><text class="h" text-anchor="middle" x="180" y="60">MUL / IMUL reg</text><text class="lbl" text-anchor="middle" x="180" y="78">EAX × 操作数 → EDX:EAX</text><rect class="reg" height="36" rx="4" width="120" x="40" y="100"></rect><text class="mono" text-anchor="middle" x="100" y="123">EAX (被乘数)</text><rect class="reg" height="36" rx="4" width="120" x="200" y="100"></rect><text class="mono" text-anchor="middle" x="260" y="123">操作数 reg/mem</text><rect class="alu" height="50" rx="6" width="160" x="100" y="180"></rect><text class="h" text-anchor="middle" x="180" y="210">乘法器 (Multiplier)</text><path class="arrow" d="M1e2 136l50 44"></path><path class="arrow" d="M260 136l-50 44"></path><rect class="op" height="40" rx="4" width="120" x="40" y="280"></rect><text class="mono" text-anchor="middle" x="100" y="305">EDX (高 32)</text><rect class="op" height="40" rx="4" width="120" x="200" y="280"></rect><text class="mono" text-anchor="middle" x="260" y="305">EAX (低 32)</text><path class="arrow" d="M150 230l-50 50"></path><path class="arrow" d="M210 230l50 50"></path><text class="lbl" text-anchor="middle" x="180" y="340">64 位乘积自动拆入 EDX:EAX</text></g><line stroke="#ccc" stroke-dasharray="4 4" x1="400" x2="400" y1="60" y2="400"></line><g><text class="h" text-anchor="middle" x="610" y="60">DIV / IDIV reg</text><text class="lbl" text-anchor="middle" x="610" y="78">EDX:EAX ÷ 操作数 → 商 EAX, 余 EDX</text><rect class="reg" height="36" rx="4" width="120" x="450" y="100"></rect><text class="mono" text-anchor="middle" x="510" y="123">EDX (高 32)</text><rect class="reg" height="36" rx="4" width="120" x="610" y="100"></rect><text class="mono" text-anchor="middle" x="670" y="123">EAX (低 32)</text><rect class="reg" height="32" rx="4" width="160" x="530" y="146"></rect><text class="mono" text-anchor="middle" x="610" y="167">除数 reg/mem (32 位)</text><rect class="alu" height="50" rx="6" width="220" x="500" y="200"></rect><text class="h" text-anchor="middle" x="610" y="230">除法器 (Divider)</text><path class="arrow" d="M510 136l50 64"></path><path class="arrow" d="M670 136l-10 64"></path><path class="arrow" d="M610 178v22"></path><rect class="op" height="40" rx="4" width="120" x="450" y="300"></rect><text class="mono" text-anchor="middle" x="510" y="325">EAX = 商</text><rect class="op" height="40" rx="4" width="120" x="610" y="300"></rect><text class="mono" text-anchor="middle" x="670" y="325">EDX = 余数</text><path class="arrow" d="M560 250l-50 50"></path><path class="arrow" d="M660 250l10 50"></path><rect class="exc" height="36" rx="4" width="220" x="500" y="360"></rect><text text-anchor="middle" x="610" y="383">异常: 除数=0 或 商溢出 → #DE</text><path class="arrow dashed" d="M590 250V360" stroke="#c0392b"></path></g></svg>