<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><lineargradient id="physicalGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#e2e8f0;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#cbd5e0;stop-opacity:1"></stop></lineargradient><lineargradient id="hypervisorGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#bee3f8;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#90cdf4;stop-opacity:1"></stop></lineargradient><lineargradient id="vmGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#c6f6d5;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#9ae6b4;stop-opacity:1"></stop></lineargradient><lineargradient id="osGrad" x1="0" x2="0" y1="0" y2="100%"><stop offset="0" style="stop-color:#fed7d7;stop-opacity:1"></stop><stop offset="100%" style="stop-color:#fbb6ce;stop-opacity:1"></stop></lineargradient></defs><text style="font-size:24px;font-weight:700;fill:#2d3748" text-anchor="middle" x="400" y="30">虚拟机架构图</text><rect fill="url(#physicalGrad)" height="100" rx="8" width="700" x="50" y="480"></rect><text style="font-size:18px;font-weight:700;fill:#4a5568" text-anchor="middle" x="400" y="520">物理硬件 (Physical Hardware)</text><text style="font-size:14px;fill:#718096" text-anchor="middle" x="400" y="545">CPU • 内存 (RAM) • 存储设备 • 网络设备</text><rect fill="url(#hypervisorGrad)" height="50" rx="8" width="700" x="50" y="420"></rect><text style="font-size:16px;font-weight:700;fill:#2d3748" text-anchor="middle" x="400" y="440">Hypervisor (虚拟机监视器)</text><text style="font-size:12px;fill:#4a5568" text-anchor="middle" x="400" y="455">资源管理 • 隔离 • 虚拟化</text><rect fill="url(#vmGrad)" height="200" rx="8" stroke="#2f855a" stroke-width="2" width="200" x="80" y="200"></rect><text style="font-size:16px;font-weight:700;fill:#2d3748" text-anchor="middle" x="180" y="225">虚拟机 1</text><rect fill="url(#osGrad)" height="40" rx="4" width="160" x="100" y="240"></rect><text style="font-size:14px;font-weight:700;fill:#fff" text-anchor="middle" x="180" y="265">Linux OS</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="110" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="132" y="309">App1</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="165" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="187" y="309">App2</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="220" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="242" y="309">Web</text><rect fill="#f7fafc" height="60" rx="4" stroke="#cbd5e0" width="160" x="100" y="330"></rect><text style="font-size:12px;font-weight:700;fill:#4a5568" text-anchor="middle" x="180" y="350">虚拟硬件</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="180" y="365">vCPU: 2核</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="180" y="378">vRAM: 4GB</text><rect fill="url(#vmGrad)" height="200" rx="8" stroke="#2f855a" stroke-width="2" width="200" x="300" y="200"></rect><text style="font-size:16px;font-weight:700;fill:#2d3748" text-anchor="middle" x="400" y="225">虚拟机 2</text><rect fill="url(#osGrad)" height="40" rx="4" width="160" x="320" y="240"></rect><text style="font-size:14px;font-weight:700;fill:#fff" text-anchor="middle" x="400" y="265">Windows OS</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="330" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="352" y="309">SQL</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="385" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="407" y="309">IIS</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="440" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="462" y="309">Office</text><rect fill="#f7fafc" height="60" rx="4" stroke="#cbd5e0" width="160" x="320" y="330"></rect><text style="font-size:12px;font-weight:700;fill:#4a5568" text-anchor="middle" x="400" y="350">虚拟硬件</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="400" y="365">vCPU: 4核</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="400" y="378">vRAM: 8GB</text><rect fill="url(#vmGrad)" height="200" rx="8" stroke="#2f855a" stroke-width="2" width="200" x="520" y="200"></rect><text style="font-size:16px;font-weight:700;fill:#2d3748" text-anchor="middle" x="620" y="225">虚拟机 3</text><rect fill="url(#osGrad)" height="40" rx="4" width="160" x="540" y="240"></rect><text style="font-size:14px;font-weight:700;fill:#fff" text-anchor="middle" x="620" y="265">Ubuntu OS</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="550" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="572" y="309">Docker</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="605" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="627" y="309">K8s</text><rect fill="#f7fafc" height="30" rx="3" stroke="#cbd5e0" width="45" x="660" y="290"></rect><text style="font-size:10px;fill:#4a5568" text-anchor="middle" x="682" y="309">DB</text><rect fill="#f7fafc" height="60" rx="4" stroke="#cbd5e0" width="160" x="540" y="330"></rect><text style="font-size:12px;font-weight:700;fill:#4a5568" text-anchor="middle" x="620" y="350">虚拟硬件</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="620" y="365">vCPU: 6核</text><text style="font-size:10px;fill:#718096" text-anchor="middle" x="620" y="378">vRAM: 16GB</text><line stroke="#2c5282" stroke-dasharray="5,5" stroke-width="2" x1="180" x2="180" y1="400" y2="420"></line><polygon fill="#2c5282" points="175,415 180,420 185,415"></polygon><line stroke="#2c5282" stroke-dasharray="5,5" stroke-width="2" x1="400" x2="400" y1="400" y2="420"></line><polygon fill="#2c5282" points="395,415 400,420 405,415"></polygon><line stroke="#2c5282" stroke-dasharray="5,5" stroke-width="2" x1="620" x2="620" y1="400" y2="420"></line><polygon fill="#2c5282" points="615,415 620,420 625,415"></polygon><line stroke="#4a5568" stroke-width="3" x1="400" x2="400" y1="470" y2="480"></line><polygon fill="#4a5568" points="395,475 400,480 405,475"></polygon><g transform="translate(50, 60)"><rect fill="#f8f9fa" height="120" rx="8" stroke="#e2e8f0" width="300" x="0" y="0"></rect><text style="font-size:14px;font-weight:700;fill:#2d3748" x="10" y="25">主要功能：</text><text style="font-size:12px;fill:#4a5568" x="10" y="45">• 资源虚拟化与分配</text><text style="font-size:12px;fill:#4a5568" x="10" y="60">• 多操作系统并行运行</text><text style="font-size:12px;fill:#4a5568" x="10" y="75">• 虚拟机间隔离保护</text><text style="font-size:12px;fill:#4a5568" x="10" y="90">• 硬件资源动态调度</text><text style="font-size:12px;fill:#4a5568" x="10" y="105">• 快照与迁移支持</text></g><g transform="translate(450, 60)"><rect fill="#f0fff4" height="120" rx="8" stroke="#9ae6b4" width="300" x="0" y="0"></rect><text style="font-size:14px;font-weight:700;fill:#2d3748" x="10" y="25">技术优势：</text><text style="font-size:12px;fill:#4a5568" x="10" y="45">• 提高硬件利用率</text><text style="font-size:12px;fill:#4a5568" x="10" y="60">• 降低运维成本</text><text style="font-size:12px;fill:#4a5568" x="10" y="75">• 简化环境部署</text><text style="font-size:12px;fill:#4a5568" x="10" y="90">• 增强系统安全性</text><text style="font-size:12px;fill:#4a5568" x="10" y="105">• 支持灾难恢复</text></g></svg>