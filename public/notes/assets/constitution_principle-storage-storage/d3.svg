"M65 278V251q0-9 165-9t165 9v27" fill="#dde3ff" stroke="none"></path><ellipse cx="230" cy="251" fill="#e0e7ff" rx="165" ry="46" stroke="#a5b4fc" stroke-width="1"></ellipse><ellipse cx="230" cy="251" fill="none" opacity=".5" rx="127" ry="36" stroke="#818cf8" stroke-dasharray="4 3" stroke-width=".7"></ellipse><ellipse cx="230" cy="251" fill="none" opacity=".5" rx="92" ry="26" stroke="#818cf8" stroke-dasharray="4 3" stroke-width=".7"></ellipse><ellipse cx="230" cy="251" fill="none" opacity=".5" rx="58" ry="17" stroke="#818cf8" stroke-dasharray="4 3" stroke-width=".7"></ellipse><ellipse cx="230" cy="251" fill="#e8eef8" rx="20" ry="6" stroke="#a5b4fc" stroke-width="1"></ellipse><path d="M65 251V224q0-9 165-9t165 9v27" fill="#c7d2fe" stroke="none"></path><ellipse cx="230" cy="224" fill="url(#platterTop)" filter="url(#shadow)" rx="165" ry="46" stroke="#93c5fd" stroke-width="1.5"></ellipse><ellipse cx="230" cy="224" fill="none" opacity=".6" rx="127" ry="36" stroke="#3b82f6" stroke-dasharray="5 3" stroke-width="1"></ellipse><ellipse cx="230" cy="224" fill="none" opacity=".5" rx="92" ry="26" stroke="#3b82f6" stroke-dasharray="5 3" stroke-width=".8"></ellipse><ellipse cx="230" cy="224" fill="none" opacity=".4" rx="58" ry="17" stroke="#3b82f6" stroke-dasharray="5 3" stroke-width=".7"></ellipse><ellipse cx="230" cy="224" fill="none" filter="url(#glow)" rx="127" ry="36" stroke="#2563eb" stroke-width="2.5"></ellipse><path d="M230 224l84-24a127 36 0 0124 37z" fill="#fde68a" opacity=".55"></path><path d="M230 224l84-24a127 36 0 0124 37z" fill="none" stroke="#d97706" stroke-width="1.8"></path><ellipse cx="230" cy="224" fill="#e0e7ff" rx="20" ry="6" stroke="#93c5fd" stroke-width="1.5"></ellipse><line stroke="#94a3b8" stroke-width="2.5" x1="230" x2="230" y1="175" y2="355"></line><line stroke="#64748b" stroke-width="2.5" x1="382" x2="302" y1="163" y2="221"></line><circle cx="302" cy="221" fill="#7c3aed" filter="url(#glow)" r="5" stroke="#fff" stroke-width="1.5"></circle><circle cx="382" cy="163" fill="#cbd5e1" r="7" stroke="#94a3b8" stroke-width="1.5"></circle><line marker-end="url(#arrowBlue)" stroke="#2563eb" stroke-dasharray="5 3" stroke-width="1.5" x1="148" x2="173" y1="152" y2="200"></line><text fill="#1d4ed8" font-size="11" font-weight="700" x="60" y="146">柱面 C</text><text fill="#3b82f6" font-size="9" x="56" y="160">同半径的磁道集合</text><line marker-end="url(#arrowOrange)" stroke="#d97706" stroke-dasharray="5 3" stroke-width="1.5" x1="290" x2="175" y1="245" y2="350"></line><text fill="#b45309" font-size="11" font-weight="700" x="78" y="362">扇区 S</text><text fill="#d97706" font-size="9" x="74" y="376">磁道的最小存储单元</text><text fill="#7c3aed" font-size="10" font-weight="600" x="392" y="158">磁头 H</text><text fill="#64748b" font-size="9" x="75" y="228">H=3</text><text fill="#64748b" font-size="9" x="75" y="255">H=2</text><text fill="#64748b" font-size="9" x="75" y="282">H=1</text><text fill="#64748b" font-size="9" x="75" y="309">H=0</text><line marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)" stroke="#2563eb" stroke-width="1.5" x1="408" x2="408" y1="224" y2="308"></line><rect fill="#eff6ff" height="16" rx="3" width="46" x="414" y="254"></rect><text fill="#1d4ed8" font-size="9" font-weight="600" text-anchor="middle" x="437" y="265">柱面深度</text><rect fill="#fff" filter="url(#shadow)" height="360" rx="10" stroke="#cbd5e1" stroke-width="1.5" width="328" x="508" y="72"></rect><text fill="#1e3a8a" font-size="13" font-weight="700" text-anchor="middle" x="672" y="100">CHS 地址结构</text><rect fill="#f1f5f9" height="32" rx="5" stroke="#e2e8f0" stroke-width="1" width="292" x="526" y="112"></rect><rect fill="url(#cylGrad)" height="32" rx="5" width="132" x="526" y="112"></rect><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="592" y="133">C (10 bits)</text><rect fill="url(#headGrad)" height="32" width="58" x="658" y="112"></rect><text fill="#fff" font-size="11" font-weight="700" text-anchor="middle" x="687" y="133">H (2 b)</text><rect fill="url(#secGrad)" height="32" rx="5" width="102" x="716" y="112"></rect><text fill="#fff" font-size="12" font-weight="700" text-anchor="middle" x="767" y="133">S (5 bits)</text><text fill="#94a3b8" font-size="10" text-anchor="middle" x="672" y="160">示例：1000 柱面 × 4 盘面 × 32 扇区/磁道，共 17 bits</text><line stroke="#e2e8f0" stroke-width="1" x1="526" x2="818" y1="170" y2="170"></line><rect fill="#3b82f6" height="42" rx="3" width="10" x="526" y="182"></rect><text fill="#1d4ed8" font-size="13" font-weight="700" x="546" y="199">C — 柱面号</text><text fill="#64748b" font-size="10" x="546" y="215">目标磁道在哪一组柱面</text><text fill="#2563eb" font-size="11" font-weight="600" text-anchor="end" x="814" y="202">⌈log₂(柱面数)⌉ bits</text><rect fill="#a855f7" height="42" rx="3" width="10" x="526" y="236"></rect><text fill="#6d28d9" font-size="13" font-weight="700" x="546" y="253">H — 磁头号</text><text fill="#64748b" font-size="10" x="546" y="269">目标扇区在哪个盘面</text><text fill="#7c3aed" font-size="11" font-weight="600" text-anchor="end" x="814" y="256">⌈log₂(盘面数)⌉ bits</text><rect fill="#16a34a" height="42" rx="3" width="10" x="526" y="290"></rect><text fill="#15803d" font-size="13" font-weight="700" x="546" y="307">S — 扇区号</text><text fill="#64748b" font-size="10" x="546" y="323">目标扇区在磁道中的位置</text><text fill="#16a34a" font-size="11" font-weight="600" text-anchor="end" x="814" y="310">⌈log₂(扇区数)⌉ bits</text><line stroke="#e2e8f0" stroke-width="1" x1="526" x2="818" y1="344" y2="344"></line><text fill="#94a3b8" font-size="11" x="546" y="363">示例定位：</text><rect fill="#dbeafe" height="20" rx="4" stroke="#3b82f6" stroke-width="1" width="38" x="543" y="371"></rect><text fill="#1d4ed8" font-size="10" font-weight="700" text-anchor="middle" x="562" y="385">C=500</text><rect fill="#ede9fe" height="20" rx="4" stroke="#a855f7" stroke-width="1" width="32" x="587" y="371"></rect><text fill="#6d28d9" font-size="10" font-weight="700" text-anchor="middle" x="603" y="385">H=2</text><rect fill="#dcfce7" height="20" rx="4" stroke="#16a34a" stroke-width="1" width="32" x="625" y="371"></rect><text fill="#15803d" font-size="10" font-weight="700" text-anchor="middle" x="641" y="385">S=15</text><text fill="#64748b" font-size="10" x="665" y="385">→ 精确定位到目标扇区</text><rect fill="#f8fafc" height="20" rx="4" stroke="#e2e8f0" stroke-width="1" width="292" x="526" y="402"></rect><text fill="#334155" font-size="11" font-weight="600" text-anchor="middle" x="672" y="416">地址总位数 = C位 + H位 + S位</text></svg>