s)" x1="370" x2="370" y1="282" y2="290"></line></g><g fill="#333" font-size="14" font-weight="700"><text text-anchor="end" x="100" y="100">M0</text><text text-anchor="end" x="100" y="170">M1</text><text text-anchor="end" x="100" y="240">M2</text><text text-anchor="end" x="100" y="310">M3</text></g><rect fill="url(#b0)" height="35" rx="5" stroke="#b56b1f" stroke-width="1.2" width="320" x="130" y="80"></rect><text fill="#5a3810" font-size="12" font-weight="600" text-anchor="middle" x="290" y="103">M0 忙 (访问地址 0)</text><rect fill="url(#b0)" height="35" rx="5" stroke="#b56b1f" stroke-width="1.2" width="320" x="450" y="80"></rect><text fill="#5a3810" font-size="12" font-weight="600" text-anchor="middle" x="610" y="103">M0 忙 (访问地址 4)</text><rect fill="url(#b1)" height="35" rx="5" stroke="#2c6fb8" stroke-width="1.2" width="320" x="210" y="150"></rect><text fill="#123a5c" font-size="12" font-weight="600" text-anchor="middle" x="370" y="173">M1 忙 (访问地址 1)</text><rect fill="url(#b1)" height="35" rx="5" stroke="#2c6fb8" stroke-width="1.2" width="240" x="530" y="150"></rect><text fill="#123a5c" font-size="12" font-weight="600" text-anchor="middle" x="650" y="173">M1 忙 (地址 5) ...</text><rect fill="url(#b2)" height="35" rx="5" stroke="#4a8c33" stroke-width="1.2" width="320" x="290" y="220"></rect><text fill="#22461a" font-size="12" font-weight="600" text-anchor="middle" x="450" y="243">M2 忙 (访问地址 2)</text><rect fill="url(#b2)" height="35" rx="5" stroke="#4a8c33" stroke-width="1.2" width="160" x="610" y="220"></rect><text fill="#22461a" font-size="12" font-weight="600" text-anchor="middle" x="690" y="243">M2 (地址 6) ...</text><rect fill="url(#b3)" height="35" rx="5" stroke="#8f4a75" stroke-width="1.2" width="320" x="370" y="290"></rect><text fill="#4a1f3b" font-size="12" font-weight="600" text-anchor="middle" x="530" y="313">M3 忙 (访问地址 3)</text><rect fill="url(#b3)" height="35" rx="5" stroke="#8f4a75" stroke-width="1.2" width="80" x="690" y="290"></rect><text fill="#4a1f3b" font-size="11" font-weight="600" text-anchor="middle" x="730" y="313">M3 ...</text><line marker-end="url(#ah)" stroke="#333" stroke-width="1.6" x1="110" x2="790" y1="350" y2="350"></line><text fill="#333" font-size="12" x="795" y="354">t</text><g fill="#333" font-size="11" stroke="#333" stroke-width="1"><line x1="130" x2="130" y1="346" y2="354"></line><text text-anchor="middle" x="130" y="368">0</text><line x1="210" x2="210" y1="346" y2="354"></line><text text-anchor="middle" x="210" y="368">T/4</text><line x1="290" x2="290" y1="346" y2="354"></line><text text-anchor="middle" x="290" y="368">2T/4</text><line x1="370" x2="370" y1="346" y2="354"></line><text text-anchor="middle" x="370" y="368">3T/4</text><line x1="450" x2="450" y1="346" y2="354"></line><text text-anchor="middle" x="450" y="368">T</text><line x1="530" x2="530" y1="346" y2="354"></line><text text-anchor="middle" x="530" y="368">5T/4</text><line x1="610" x2="610" y1="346" y2="354"></line><text text-anchor="middle" x="610" y="368">6T/4</text><line x1="690" x2="690" y1="346" y2="354"></line><text text-anchor="middle" x="690" y="368">7T/4</text><line x1="770" x2="770" y1="346" y2="354"></line><text text-anchor="middle" x="770" y="368">2T</text></g><g fill="none" stroke="#c0392b" stroke-width="1.4"><line x1="130" x2="130" y1="385" y2="400"></line><line x1="210" x2="210" y1="385" y2="400"></line><line marker-end="url(#ah)" marker-start="url(#ah)" x1="130" x2="210" y1="393" y2="393"></line></g><rect fill="#fdecea" height="24" rx="4" stroke="#c0392b" stroke-width="1.2" width="60" x="140" y="402"></rect><text fill="#7a1e1e" font-size="12" font-weight="700" text-anchor="middle" x="170" y="419">T / n</text><g fill="none" stroke="#2f8f4d" stroke-width="1.4"><line x1="130" x2="130" y1="435" y2="450"></line><line x1="450" x2="450" y1="435" y2="450"></line><line marker-end="url(#ah)" marker-start="url(#ah)" x1="130" x2="450" y1="443" y2="443"></line></g><rect fill="#e8f5ee" height="16" rx="4" stroke="#2f8f4d" stroke-width="1.2" width="60" x="260" y="452"></rect><text fill="#1f5a30" font-size="11" font-weight="700" text-anchor="middle" x="290" y="464">存储周期 T</text><g fill="#333" font-size="11" transform="translate(500,395)"><text fill="#111" font-weight="700" x="0" y="0">n = 4 体低位交叉存储器</text><text x="0" y="18">• 单体仍需完整周期 T 才能再次接受访问</text><text x="0" y="36">• 相邻地址被分散到不同存储体，M0~M3 可交错并行</text><text x="0" y="54">• CPU 每 T/n 就能收到一次数据 → 带宽提升约 n 倍</text></g></svg>