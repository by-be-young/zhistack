<svg xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 880 460"><defs><lineargradient id="gCore" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#4f7cff"></stop><stop offset="100%" stop-color="#2f52c9"></stop></lineargradient><lineargradient id="gPerf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff8a5b"></stop><stop offset="100%" stop-color="#e5643a"></stop></lineargradient><lineargradient id="gCap" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3fbf87"></stop><stop offset="100%" stop-color="#2a9e6c"></stop></lineargradient><filter height="130%" id="sh" width="120%" x="-10%" y="-10%"><fedropshadow dx="0" dy="2" flood-color="#000" flood-opacity=".12" stddeviation="2"></fedropshadow></filter></defs><g filter="url(#sh)"><rect fill="url(#gCore)" height="70" rx="10" width="200" x="340" y="30"></rect><text fill="#fff" font-size="18" font-weight="700" text-anchor="middle" x="440" y="60">多模块存储器</text><text fill="#e6ecff" font-size="12" text-anchor="middle" x="440" y="82">多个结构相同的存储模块 → 主存系统</text></g><g opacity=".95" transform="translate(650,30)"><g fill="#c9d3ee" stroke="#5a6ea3" stroke-width="1"><rect height="18" rx="2" width="30" x="0" y="0"></rect><rect height="18" rx="2" width="30" x="36" y="0"></rect><rect height="18" rx="2" width="30" x="72" y="0"></rect><rect height="18" rx="2" width="30" x="108" y="0"></rect><rect height="18" rx="2" width="30" x="0" y="24"></rect><rect height="18" rx="2" width="30" x="36" y="24"></rect><rect height="18" rx="2" width="30" x="72" y="24"></rect><rect height="18" rx="2" width="30" x="108" y="24"></rect></g><text fill="#5a6ea3" font-size="11" text-anchor="middle" x="69" y="60">若干存储模块</text></g><text fill="#4a5872" font-size="13" text-anchor="middle" x="440" y="130">按设计目标分为两类</text><path d="M440 1e2v45L220 175m220-30 220 30" fill="none" stroke="#9aa6c3" stroke-width="1.6"></path><g filter="url(#sh)"><rect fill="url(#gPerf)" height="52" rx="8" width="280" x="80" y="175"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="220" y="200">提升访问性能（带宽 / 吞吐率）</text><text fill="#fff2e8" font-size="11" text-anchor="middle" x="220" y="217">扩大一次访问的数据量或并行处理请求</text></g><g filter="url(#sh)"><rect fill="url(#gCap)" height="52" rx="8" width="280" x="520" y="175"></rect><text fill="#fff" font-size="15" font-weight="700" text-anchor="middle" x="660" y="200">扩大主存容量（字长 / 字数）</text><text fill="#e6f8ee" font-size="11" text-anchor="middle" x="660" y="217">连接多个芯片，突破单芯片规格限制</text></g><path d="M220 227v23l-90 15m90-15 90 15" fill="none" opacity=".7" stroke="#e5643a" stroke-width="1.4"></path><g><rect fill="#fff" height="46" rx="6" stroke="#e5643a" stroke-width="1.4" width="200" x="30" y="265"></rect><text fill="#2b2f3a" font-size="13" font-weight="600" text-anchor="middle" x="130" y="284">单体多字存储器</text><text fill="#5c6474" font-size="11" text-anchor="middle" x="130" y="301">一个地址存放 n 个连续字</text></g><g><rect fill="#fff" height="46" rx="6" stroke="#e5643a" stroke-width="1.4" width="200" x="250" y="265"></rect><text fill="#2b2f3a" font-size="13" font-weight="600" text-anchor="middle" x="350" y="284">多体交叉存储器</text><text fill="#5c6474" font-size="11" text-anchor="middle" x="350" y="301">多个存储体并行 / 交替工作</text></g><path d="M350 311v19l-70 15m70-15 70 15" fill="none" opacity=".55" stroke="#e5643a" stroke-width="1.2"></path><g><rect fill="#fff5ef" height="36" rx="6" stroke="#e5643a" stroke-width="1" width="160" x="200" y="345"></rect><text fill="#5c3b23" font-size="12" text-anchor="middle" x="280" y="368">高位交叉编址（串行）</text></g><g><rect fill="#fff5ef" height="36" rx="6" stroke="#e5643a" stroke-width="1" width="160" x="370" y="345"></rect><text fill="#5c3b23" font-size="12" text-anchor="middle" x="450" y="368">低位交叉编址（并行）</text></g><path d="M660 227v23L560 265m1e2-15v15m0-15 1e2 15" fill="none" opacity=".7" stroke="#2a9e6c" stroke-width="1.4"></path><g><rect fill="#fff" height="46" rx="6" stroke="#2a9e6c" stroke-width="1.4" width="180" x="470" y="265"></rect><text fill="#2b2f3a" font-size="13" font-weight="600" text-anchor="middle" x="560" y="284">位扩展</text><text fill="#5c6474" font-size="11" text-anchor="middle" x="560" y="301">扩展字长（低位编址）</text></g><g><rect fill="#fff" height="46" rx="6" stroke="#2a9e6c" stroke-width="1.4" width="180" x="670" y="265"></rect><text fill="#2b2f3a" font-size="13" font-weight="600" text-anchor="middle" x="760" y="284">字扩展</text><text fill="#5c6474" font-size="11" text-anchor="middle" x="760" y="301">扩展字数（高位编址）</text></g><g><rect fill="#fff" height="46" rx="6" stroke="#2a9e6c" stroke-width="1.4" width="180" x="570" y="325"></rect><text fill="#2b2f3a" font-size="13" font-weight="600" text-anchor="middle" x="660" y="344">字位扩展</text><text fill="#5c6474" font-size="11" text-anchor="middle" x="660" y="361">同时扩展字长与字数</text></g><path d="M560 311v14l10 15m190-29v14l-10 15" fill="none" opacity=".55" stroke="#2a9e6c" stroke-width="1.2"></path><g><rect fill="#f4f6fb" height="40" rx="8" stroke="#c7cee0" stroke-width="1" width="760" x="60" y="405"></rect><circle cx="90" cy="425" fill="url(#gPerf)" r="6"></circle><text fill="#3d4359" font-size="12" x="105" y="430">左侧：不增加容量，靠并行 / 宽数据通路提升访存效率</text><circle cx="470" cy="425" fill="url(#gCap)" r="6"></circle><text fill="#3d4359" font-size="12" x="485" y="430">右侧：不改变访存速度，靠拼接芯片扩大总容量或字长</text></g></svg>