<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13" viewBox="0 0 780 380"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker></defs><rect fill="#eef4ff" height="70" rx="6" stroke="#3b6fb0" stroke-width="1.5" width="90" x="30" y="170"></rect><text fill="#1f3f70" font-weight="bold" text-anchor="middle" x="75" y="200">CPU</text><text fill="#1f3f70" font-size="11" text-anchor="middle" x="75" y="220">发出一个地址</text><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="120" x2="260" y1="190" y2="190"></line><text fill="#333" font-size="11" text-anchor="middle" x="190" y="182">地址总线</text><line marker-end="url(#arrow)" stroke="#c94a4a" stroke-width="3" x1="260" x2="120" y1="220" y2="220"></line><text fill="#c94a4a" font-size="11" text-anchor="middle" x="190" y="240">数据总线宽度 = n×m 位</text><rect fill="#fff" height="330" rx="8" stroke="#333" stroke-width="1.5" width="360" x="260" y="40"></rect><text fill="#333" font-weight="bold" text-anchor="middle" x="440" y="60">单体多字存储器（每行 n 个字）</text><rect fill="#f0f0f0" height="26" stroke="#999" width="60" x="275" y="75"></rect><text font-weight="bold" text-anchor="middle" x="305" y="93">地址</text><rect fill="#f0f0f0" height="26" stroke="#999" width="270" x="335" y="75"></rect><text font-weight="bold" text-anchor="middle" x="470" y="93">存储字（每字 m 位，共 n=4 字）</text><rect fill="#fff" height="34" stroke="#999" width="60" x="275" y="101"></rect><text text-anchor="middle" x="305" y="123">0</text><rect fill="#fde9c9" height="34" stroke="#999" width="67" x="335" y="101"></rect><text text-anchor="middle" x="368" y="123">Word0</text><rect fill="#fde9c9" height="34" stroke="#999" width="68" x="402" y="101"></rect><text text-anchor="middle" x="436" y="123">Word1</text><rect fill="#fde9c9" height="34" stroke="#999" width="67" x="470" y="101"></rect><text text-anchor="middle" x="503" y="123">Word2</text><rect fill="#fde9c9" height="34" stroke="#999" width="68" x="537" y="101"></rect><text text-anchor="middle" x="571" y="123">Word3</text><rect fill="#fff" height="34" stroke="#999" width="60" x="275" y="135"></rect><text text-anchor="middle" x="305" y="157">1</text><rect fill="#e0edf7" height="34" stroke="#999" width="67" x="335" y="135"></rect><text text-anchor="middle" x="368" y="157">Word4</text><rect fill="#e0edf7" height="34" stroke="#999" width="68" x="402" y="135"></rect><text text-anchor="middle" x="436" y="157">Word5</text><rect fill="#e0edf7" height="34" stroke="#999" width="67" x="470" y="135"></rect><text text-anchor="middle" x="503" y="157">Word6</text><rect fill="#e0edf7" height="34" stroke="#999" width="68" x="537" y="135"></rect><text text-anchor="middle" x="571" y="157">Word7</text><rect fill="#fff" height="34" stroke="#999" width="60" x="275" y="169"></rect><text text-anchor="middle" x="305" y="191">2</text><rect fill="#dcebd7" height="34" stroke="#999" width="67" x="335" y="169"></rect><text text-anchor="middle" x="368" y="191">Word8</text><rect fill="#dcebd7" height="34" stroke="#999" width="68" x="402" y="169"></rect><text text-anchor="middle" x="436" y="191">Word9</text><rect fill="#dcebd7" height="34" stroke="#999" width="67" x="470" y="169"></rect><text text-anchor="middle" x="503" y="191">Word10</text><rect fill="#dcebd7" height="34" stroke="#999" width="68" x="537" y="169"></rect><text text-anchor="middle" x="571" y="191">Word11</text><rect fill="#fff" height="34" stroke="#999" width="60" x="275" y="203"></rect><text text-anchor="middle" x="305" y="225">3</text><rect fill="#f7f7f7" height="34" stroke="#999" width="270" x="335" y="203"></rect><text fill="#666" text-anchor="middle" x="470" y="225">…</text><rect fill="none" height="38" stroke="#c94a4a" stroke-dasharray="5,3" stroke-width="2" width="274" x="333" y="99"></rect><text fill="#c94a4a" font-size="11" x="630" y="115">一次访问</text><text fill="#c94a4a" font-size="11" x="630" y="130">返回 n 个字</text><line stroke="#666" stroke-dasharray="4,3" x1="335" x2="605" y1="260" y2="260"></line><text fill="#333" font-weight="bold" x="275" y="285">特点</text><text fill="#333" x="275" y="305">• 每个地址存放 n 个连续存储字（图中 n=4）</text><text fill="#333" x="275" y="322">• 数据总线加宽为 n×m 位，一次取回 n 个字</text><text fill="#333" x="275" y="339">• 理论带宽提升到原来的 n 倍</text><text fill="#c94a4a" x="275" y="356">• 仅对顺序访问有效；随机/非连续访问无并行收益</text><rect fill="#fafafa" height="80" rx="6" stroke="#bbb" width="200" x="30" y="60"></rect><text fill="#555" font-weight="bold" text-anchor="middle" x="130" y="80">普通存储器</text><text fill="#555" font-size="11" text-anchor="middle" x="130" y="102">一个地址 → 一个字（m 位）</text><text fill="#555" font-size="11" text-anchor="middle" x="130" y="122">数据总线宽度 = m 位</text><rect fill="#fff5f5" height="90" rx="6" stroke="#c94a4a" width="200" x="30" y="280"></rect><text fill="#c94a4a" font-weight="bold" text-anchor="middle" x="130" y="300">单体多字存储器</text><text fill="#8a3535" font-size="11" text-anchor="middle" x="130" y="322">一个地址 → n 个字</text><text fill="#8a3535" font-size="11" text-anchor="middle" x="130" y="340">数据总线宽度 = n×m 位</text><text fill="#8a3535" font-size="11" text-anchor="middle" x="130" y="358">带宽 ≈ ×n（仅顺序）</text></svg>