<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 780 320"><defs><lineargradient id="busyGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5b8b8"></stop><stop offset="100%" stop-color="#e88a8a"></stop></lineargradient><lineargradient id="idleGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#bde5c8"></stop><stop offset="100%" stop-color="#8fd3a4"></stop></lineargradient><marker id="arrHead" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker><marker id="arrHeadRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c0392b"></path></marker><marker id="arrHeadBlue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2c6fb8"></path></marker></defs><g transform="translate(20,120)"><rect fill="#f0f4fa" height="80" rx="6" stroke="#4a6fa5" stroke-width="1.8" width="70" x="0" y="0"></rect><line stroke="#4a6fa5" stroke-width="1" x1="0" x2="70" y1="20" y2="20"></line><line stroke="#4a6fa5" stroke-width="1" x1="0" x2="70" y1="40" y2="40"></line><line stroke="#4a6fa5" stroke-width="1" x1="0" x2="70" y1="60" y2="60"></line><text fill="#4a6fa5" font-size="11" font-weight="600" text-anchor="middle" x="35" y="14">Memory</text><text fill="#6a7a8a" font-size="10" text-anchor="middle" x="35" y="34">bank</text><text fill="#6a7a8a" font-size="10" text-anchor="middle" x="35" y="54">M0</text><text fill="#6a7a8a" font-size="10" text-anchor="middle" x="35" y="74">...</text></g><line marker-end="url(#arrHead)" stroke="#333" stroke-width="1.6" x1="110" x2="740" y1="180" y2="180"></line><text fill="#333" font-size="12" x="745" y="184">t</text><g stroke="#333" stroke-width="1"><line x1="140" x2="140" y1="176" y2="184"></line><line x1="540" x2="540" y1="176" y2="184"></line></g><text fill="#333" font-size="12" text-anchor="middle" x="140" y="205">0 ns</text><text fill="#333" font-size="12" text-anchor="middle" x="540" y="205">40 ns</text><rect fill="url(#busyGrad)" height="40" rx="4" stroke="#c0392b" stroke-width="1.2" width="400" x="140" y="130"></rect><text fill="#7a1e1e" font-size="14" font-weight="600" text-anchor="middle" x="340" y="155">忙碌 (Busy)</text><text fill="#7a1e1e" font-size="11" text-anchor="middle" x="340" y="122">该存储体正在执行当前访问，无法响应新的请求</text><rect fill="url(#idleGrad)" height="40" rx="4" stroke="#2f8f4d" stroke-width="1.2" width="180" x="540" y="130"></rect><text fill="#1f5a30" font-size="14" font-weight="600" text-anchor="middle" x="630" y="155">可再次访问</text><text fill="#1f5a30" font-size="11" text-anchor="middle" x="630" y="122">完成后重新就绪</text><line marker-end="url(#arrHeadBlue)" stroke="#2c6fb8" stroke-width="1.8" x1="140" x2="140" y1="80" y2="128"></line><text fill="#2c6fb8" font-size="12" font-weight="600" text-anchor="middle" x="140" y="70">第 1 次访问开始</text><line marker-end="url(#arrHeadRed)" stroke="#c0392b" stroke-width="1.8" x1="540" x2="540" y1="80" y2="128"></line><text fill="#c0392b" font-size="12" font-weight="600" text-anchor="middle" x="540" y="70">最早可发起第 2 次访问</text><g fill="none" stroke="#333" stroke-width="1.4"><line x1="140" x2="140" y1="240" y2="260"></line><line x1="540" x2="540" y1="240" y2="260"></line><line marker-end="url(#arrHead)" marker-start="url(#arrHead)" x1="140" x2="540" y1="250" y2="250"></line></g><rect fill="#fff8e1" height="26" rx="4" stroke="#c9a233" stroke-width="1.2" width="80" x="300" y="262"></rect><text fill="#7a5b00" font-size="13" font-weight="700" text-anchor="middle" x="340" y="280">存储周期 T</text><text fill="#555" font-size="11" text-anchor="middle" x="340" y="308">从开始一次访问到能再次接受访问所需的最短时间</text><line stroke="#4a6fa5" stroke-dasharray="4 3" stroke-width="1.2" x1="90" x2="130" y1="160" y2="160"></line></svg>