<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 860 500"><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker><lineargradient id="gTop" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe0b2"></stop><stop offset="1" stop-color="#ffcc80"></stop></lineargradient><lineargradient id="gDrv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#42a5f5"></stop><stop offset="1" stop-color="#1565c0"></stop></lineargradient><lineargradient id="gHw" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"></stop><stop offset="1" stop-color="#81c784"></stop></lineargradient></defs><text class="h1" text-anchor="middle" x="430" y="28">设备驱动程序</text><text class="sub" text-anchor="middle" x="430" y="48">承上启下：把设备独立性软件的通用命令 → 翻译为特定硬件能理解的指令</text><rect fill="url(#gTop)" height="46" rx="8" stroke="#fb8c00" width="740" x="60" y="70"></rect><text class="lay-t" text-anchor="middle" x="430" y="98">设备独立性软件（通用 I/O 命令：read / write / ioctl…）</text><rect fill="#e3f2fd" height="260" rx="10" stroke="#1565c0" stroke-width="1.5" width="740" x="60" y="140"></rect><rect fill="url(#gDrv)" height="34" rx="10" width="740" x="60" y="140"></rect><text class="lay-w" text-anchor="middle" x="430" y="163">设备驱动程序（内核态，针对具体硬件）</text><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="220" x="80" y="188"></rect><text class="card-t" x="92" y="208">① 命令翻译</text><text class="card-d" x="92" y="226">通用 I/O 请求 → 设备特定指令</text><text class="card-d" x="92" y="242">写控制/命令寄存器</text><text class="card-d" x="92" y="258">如：扇区读写、控制字符</text></g><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="220" x="315" y="188"></rect><text class="card-t" x="327" y="208">② 设备初始化与配置</text><text class="card-d" x="327" y="226">复位、加载固件</text><text class="card-d" x="327" y="242">分配 I/O 端口、DMA 通道</text><text class="card-d" x="327" y="258">注册中断向量</text></g><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="230" x="550" y="188"></rect><text class="card-t" x="562" y="208">③ 数据传输</text><text class="card-d" x="562" y="226">程序查询 / 中断 / DMA</text><text class="card-d" x="562" y="242">在设备寄存器与内存间搬运</text><text class="card-d" x="562" y="258">配合上层缓冲区</text></g><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="220" x="80" y="292"></rect><text class="card-t" x="92" y="312">④ 中断响应与后处理</text><text class="card-d" x="92" y="330">配合中断处理程序</text><text class="card-d" x="92" y="346">读状态寄存器判断结果</text><text class="card-d" x="92" y="362">唤醒等待进程</text></g><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="220" x="315" y="292"></rect><text class="card-t" x="327" y="312">⑤ 错误检测与恢复</text><text class="card-d" x="327" y="330">超时、校验失败、重试</text><text class="card-d" x="327" y="346">向上报告不可恢复错误</text><text class="card-d" x="327" y="362">屏蔽底层硬件异常</text></g><g><rect fill="#fff" height="90" rx="6" stroke="#90caf9" width="230" x="550" y="292"></rect><text class="card-t" x="562" y="312">⑥ 提供统一接口</text><text class="card-d" x="562" y="330">向上暴露标准入口</text><text class="card-d" x="562" y="346">open / read / write / close</text><text class="card-d" x="562" y="362">便于内核统一调度</text></g><rect fill="url(#gHw)" height="60" rx="8" stroke="#2e7d32" width="740" x="60" y="424"></rect><text class="lay-t" text-anchor="middle" x="430" y="448">硬件（设备控制器 · 寄存器 · 端口 · DMA）</text><text class="card-d" text-anchor="middle" x="430" y="468">硬盘 / 网卡 / 键盘 / 打印机 …</text><line marker-end="url(#a)" marker-start="url(#a)" stroke="#455a64" stroke-width="1.6" x1="430" x2="430" y1="118" y2="138"></line><line marker-end="url(#a)" marker-start="url(#a)" stroke="#455a64" stroke-width="1.6" x1="430" x2="430" y1="402" y2="422"></line><text class="side" x="440" y="132">↑ 向上：统一 API</text><text class="side" x="440" y="418">↓ 向下：操控硬件寄存器 / 端口</text><text class="tag" x="60" y="65">运行态：内核态</text><text class="tag" x="200" y="65">提供方：通常由设备制造商提供</text></svg>