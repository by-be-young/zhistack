<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Menlo', monospace" viewBox="0 0 860 440"><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker><lineargradient id="gApp" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8e1"></stop><stop offset="1" stop-color="#ffe082"></stop></lineargradient><lineargradient id="gLib" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3f2fd"></stop><stop offset="1" stop-color="#90caf9"></stop></lineargradient><lineargradient id="gSys" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"></stop><stop offset="1" stop-color="#81c784"></stop></lineargradient></defs><text class="h1" text-anchor="middle" x="430" y="26">用户层 I/O 软件</text><text class="sub" text-anchor="middle" x="430" y="46">把"简单的库调用"翻译成"复杂的系统调用"，向下陷入内核</text><rect fill="url(#gApp)" height="70" rx="8" stroke="#f9a825" width="780" x="40" y="70"></rect><text class="lay" x="52" y="90">应用程序</text><text class="code" x="60" y="112">printf("hello %d", n);</text><text class="code" x="260" y="112">fgets(buf, 128, stdin);</text><text class="code" x="490" y="112">fwrite(&amp;s, sizeof s, 1, fp);</text><text class="code-d" x="60" y="130">// 想的是"输出一段话"，不关心设备</text><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="430" x2="430" y1="140" y2="168"></line><text class="zh" x="440" y="158">调用库函数</text><rect fill="url(#gLib)" height="150" rx="10" stroke="#1565c0" stroke-width="1.4" width="780" x="40" y="170"></rect><text class="lay" x="52" y="190">用户层 I/O 软件（库 / 运行时）</text><text class="tag" x="200" y="190">运行在用户态</text><g><rect fill="#fff" height="100" rx="6" stroke="#64b5f6" width="185" x="55" y="205"></rect><text class="zh" x="65" y="222">① 格式化 / 解析</text><text class="code" x="65" y="242">printf</text><text class="code" x="65" y="258">scanf</text><text class="code" x="65" y="274">sprintf</text><text class="code" x="65" y="290">atoi / strtol</text></g><g><rect fill="#fff" height="100" rx="6" stroke="#64b5f6" width="185" x="250" y="205"></rect><text class="zh" x="260" y="222">② 用户级缓冲</text><text class="code" x="260" y="242">fopen / fclose</text><text class="code" x="260" y="258">fread / fwrite</text><text class="code" x="260" y="274">fflush</text><text class="code" x="260" y="290">setvbuf</text></g><g><rect fill="#fff" height="100" rx="6" stroke="#64b5f6" width="185" x="445" y="205"></rect><text class="zh" x="455" y="222">③ 交互 / 终端</text><text class="code" x="455" y="242">readline</text><text class="code" x="455" y="258">getchar / getch</text><text class="code" x="455" y="274">isatty</text><text class="code" x="455" y="290">ncurses</text></g><g><rect fill="#fff" height="100" rx="6" stroke="#64b5f6" width="165" x="640" y="205"></rect><text class="zh" x="650" y="222">④ 假脱机 SPOOLing</text><text class="code" x="650" y="242">lp / lpr</text><text class="code" x="650" y="258">at / batch</text><text class="code-d" x="650" y="274">// 独占设备</text><text class="code-d" x="650" y="290">// 变共享</text></g><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="430" x2="430" y1="320" y2="350"></line><text class="zh" x="440" y="340">陷入内核（trap / syscall）</text><line stroke="#c62828" stroke-dasharray="5 4" stroke-width="1.4" x1="40" x2="820" y1="352" y2="352"></line><text class="tag" text-anchor="end" x="820" y="348">─── 用户态 / 内核态分界 ───</text><rect fill="url(#gSys)" height="66" rx="8" stroke="#2e7d32" width="780" x="40" y="360"></rect><text class="lay" x="52" y="380">系统调用接口（POSIX）</text><text class="code" x="60" y="402">open</text><text class="code" x="130" y="402">read</text><text class="code" x="200" y="402">write</text><text class="code" x="275" y="402">close</text><text class="code" x="350" y="402">lseek</text><text class="code" x="420" y="402">ioctl</text><text class="code" x="490" y="402">dup / dup2</text><text class="code" x="595" y="402">pipe</text><text class="code" x="655" y="402">mmap</text><text class="code" x="725" y="402">select / poll</text><text class="code-d" x="60" y="420">// 数量少、原语级、直接进入设备独立性软件</text></svg>