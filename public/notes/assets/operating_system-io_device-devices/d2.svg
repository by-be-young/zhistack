<svg xmlns="http://www.w3.org/2000/svg" font-family="Microsoft Yahei, sans-serif" font-size="13" viewBox="0 0 960 590"><defs><marker id="arr3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#333"></path></marker><marker id="arrRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c62828"></path></marker><marker id="arrBlue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#1565c0"></path></marker><marker id="arrGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2e7d32"></path></marker></defs><text class="sv-title" text-anchor="middle" x="480" y="24">I/O 控制方式对比（CPU 参与度 / 数据流）</text><text font-weight="bold" text-anchor="middle" x="100" y="60">方式</text><text font-weight="bold" text-anchor="middle" x="380" y="60">数据流</text><text font-weight="bold" text-anchor="middle" x="770" y="60">CPU 参与度（时间轴）</text><line stroke="#666" x1="20" x2="940" y1="70" y2="70"></line><rect class="sv-row" height="150" rx="6" width="920" x="20" y="80"></rect><text font-weight="bold" text-anchor="middle" x="100" y="115">程序查询</text><text class="sv-small" text-anchor="middle" x="100" y="135">(Polling)</text><text class="sv-small" text-anchor="middle" x="100" y="153">同步、忙等</text><rect class="sv-cpu" height="36" rx="4" width="60" x="210" y="130"></rect><text text-anchor="middle" x="240" y="153">CPU</text><rect class="sv-dev" height="36" rx="4" width="60" x="350" y="130"></rect><text text-anchor="middle" x="380" y="153">设备</text><rect class="sv-mem" height="36" rx="4" width="60" x="490" y="130"></rect><text text-anchor="middle" x="520" y="153">内存</text><path d="M270 142h80" fill="none" marker-end="url(#arr3)" stroke="#333" stroke-width="1.5"></path><text class="sv-small" text-anchor="middle" x="310" y="135">轮询/读状态</text><path d="M350 158H270" fill="none" marker-end="url(#arr3)" stroke="#333" stroke-width="1.5"></path><text class="sv-small" text-anchor="middle" x="310" y="182">数据→CPU 寄存器</text><path d="M410 142h80" fill="none" stroke="#1565c0" stroke-dasharray="4 3" stroke-width="1.5"></path><path d="M270 2e2q110 15 220-35" fill="none" marker-end="url(#arrBlue)" stroke="#1565c0" stroke-width="1.5"></path><text class="sv-small" fill="#1565c0" text-anchor="middle" x="380" y="218">CPU 再写入内存（每字节都经 CPU）</text><rect class="sv-cpu" height="22" width="320" x="600" y="120"></rect><line stroke="#333" x1="600" x2="920" y1="142" y2="142"></line><line stroke="#333" x1="600" x2="600" y1="142" y2="148"></line><line stroke="#333" x1="920" x2="920" y1="142" y2="148"></line><text class="sv-small" text-anchor="middle" x="760" y="135">CPU 全程忙：检查 → 传送 → 检查 → …</text><text class="sv-small" text-anchor="middle" x="760" y="160">时间 →</text><text class="sv-small" text-anchor="middle" x="760" y="200">几乎 100% CPU 占用，效率最低</text><rect class="sv-row" height="150" rx="6" width="920" x="20" y="240"></rect><text font-weight="bold" text-anchor="middle" x="100" y="275">程序中断</text><text class="sv-small" text-anchor="middle" x="100" y="295">(Interrupt)</text><text class="sv-small" text-anchor="middle" x="100" y="313">异步、需中断响应</text><rect class="sv-cpu" height="36" rx="4" width="60" x="210" y="290"></rect><text text-anchor="middle" x="240" y="313">CPU</text><rect class="sv-dev" height="36" rx="4" width="60" x="350" y="290"></rect><text text-anchor="middle" x="380" y="313">设备</text><rect class="sv-mem" height="36" rx="4" width="60" x="490" y="290"></rect><text text-anchor="middle" x="520" y="313">内存</text><path d="M270 302h80" fill="none" marker-end="url(#arr3)" stroke="#333" stroke-width="1.5"></path><text class="sv-small" text-anchor="middle" x="310" y="295">启动 I/O</text><path d="M350 318H270" fill="none" marker-end="url(#arrRed)" stroke="#c62828" stroke-width="1.5"></path><text class="sv-small" fill="#c62828" text-anchor="middle" x="310" y="342">完成 → 中断 + 数据</text><path d="M270 360q110 18 220-20" fill="none" marker-end="url(#arrBlue)" stroke="#1565c0" stroke-width="1.5"></path><text class="sv-small" fill="#1565c0" text-anchor="middle" x="380" y="378">中断服务程序搬运（仍经 CPU）</text><rect class="sv-cpu" height="22" width="25" x="600" y="290"></rect><rect class="sv-idle" height="22" width="190" x="625" y="290"></rect><rect class="sv-cpu" height="22" width="55" x="815" y="290"></rect><rect class="sv-idle" height="22" width="50" x="870" y="290"></rect><line stroke="#333" x1="600" x2="920" y1="312" y2="312"></line><line stroke="#333" x1="600" x2="600" y1="312" y2="318"></line><line stroke="#333" x1="920" x2="920" y1="312" y2="318"></line><text class="sv-small" text-anchor="middle" x="760" y="328">时间 →</text><text class="sv-small" text-anchor="middle" x="612" y="345">启动</text><text class="sv-small" text-anchor="middle" x="720" y="345">设备工作（CPU 空闲）</text><text class="sv-small" text-anchor="middle" x="842" y="345">ISR 搬数据</text><text class="sv-small" text-anchor="middle" x="760" y="378">CPU 仅在中断时介入；按字节/帧产生中断</text><rect class="sv-row" height="180" rx="6" width="920" x="20" y="400"></rect><text font-weight="bold" text-anchor="middle" x="100" y="435">DMA</text><text class="sv-small" text-anchor="middle" x="100" y="455">(直接存储器访问)</text><text class="sv-small" text-anchor="middle" x="100" y="473">大块数据、低 CPU</text><rect class="sv-cpu" height="36" rx="4" width="60" x="210" y="430"></rect><text text-anchor="middle" x="240" y="453">CPU</text><rect class="sv-dmac" height="36" rx="4" width="60" x="210" y="510"></rect><text text-anchor="middle" x="240" y="533">DMAC</text><rect class="sv-dev" height="36" rx="4" width="60" x="380" y="430"></rect><text text-anchor="middle" x="410" y="453">设备</text><rect class="sv-mem" height="36" rx="4" width="60" x="380" y="510"></rect><text text-anchor="middle" x="410" y="533">内存</text><path d="M240 466v44" fill="none" marker-end="url(#arr3)" stroke="#333" stroke-width="1.5"></path><text class="sv-small" x="248" y="492">启动命令</text><path d="M270 520l110-72" fill="none" marker-end="url(#arr3)" stroke="#ad1457" stroke-dasharray="4 3" stroke-width="1.2"></path><text class="sv-small" fill="#ad1457" text-anchor="middle" x="340" y="492">控制</text><path d="M270 528H380" fill="none" marker-end="url(#arr3)" stroke="#ad1457" stroke-dasharray="4 3" stroke-width="1.2"></path><text class="sv-small" fill="#ad1457" text-anchor="middle" x="325" y="522">控制</text><path d="M410 466v44" fill="none" marker-end="url(#arrGreen)" stroke="#2e7d32" stroke-width="2.5"></path><text class="sv-small" fill="#2e7d32" x="455" y="492">设备 ↔ 内存 直传</text><path d="M225 510V466" fill="none" marker-end="url(#arrRed)" stroke="#c62828" stroke-width="1.2"></path><text class="sv-small" fill="#c62828" x="150" y="492">块结束中断</text><rect class="sv-cpu" height="22" width="18" x="600" y="430"></rect><rect class="sv-idle" height="22" width="284" x="618" y="430"></rect><rect class="sv-cpu" height="22" width="18" x="902" y="430"></rect><line stroke="#333" x1="600" x2="920" y1="452" y2="452"></line><line stroke="#333" x1="600" x2="600" y1="452" y2="458"></line><line stroke="#333" x1="920" x2="920" y1="452" y2="458"></line><text class="sv-small" text-anchor="middle" x="760" y="468">时间 →</text><text class="sv-small" text-anchor="middle" x="609" y="490">启动</text><text class="sv-small" text-anchor="middle" x="760" y="490">DMAC 独立传输（CPU 空闲）</text><text class="sv-small" text-anchor="middle" x="900" y="490">结束中断</text><text class="sv-small" text-anchor="middle" x="760" y="525">CPU 仅头尾介入；中段由 DMAC 独立完成</text><text class="sv-small" text-anchor="middle" x="760" y="548">CPU 参与度最低；适合大批量、高速 I/O（磁盘、网卡）</text></svg>