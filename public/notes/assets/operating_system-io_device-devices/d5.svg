<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 820 520"><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#546e7a"></path></marker><lineargradient id="gCore" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#42a5f5"></stop><stop offset="1" stop-color="#1e88e5"></stop></lineargradient><lineargradient id="gTop" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe0b2"></stop><stop offset="1" stop-color="#ffcc80"></stop></lineargradient><lineargradient id="gBot" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"></stop><stop offset="1" stop-color="#a5d6a7"></stop></lineargradient></defs><text class="h1" text-anchor="middle" x="410" y="28">设备独立性软件</text><text class="lbl-sm" text-anchor="middle" x="410" y="48">位于用户层与设备驱动之间，屏蔽硬件差异，向上提供统一接口</text><rect fill="url(#gTop)" height="46" rx="8" stroke="#fb8c00" stroke-width="1.2" width="700" x="60" y="70"></rect><text class="card-title" text-anchor="middle" x="410" y="98">用户层 I/O 软件（库函数 / 系统调用：read、write、printf…）</text><rect fill="#e3f2fd" height="220" rx="10" stroke="#1e88e5" stroke-width="1.5" width="700" x="60" y="140"></rect><rect fill="url(#gCore)" height="34" rx="10" width="700" x="60" y="140"></rect><text class="core-title" text-anchor="middle" x="410" y="163">设备独立性软件（核心功能）</text><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="80" y="188"></rect><text class="card-title" x="92" y="208">① 统一命名与接口</text><text class="lbl-sm" x="92" y="228">将不同设备抽象为文件 / 逻辑名</text><text class="lbl-sm" x="92" y="245">上层无需关心具体硬件类型</text></g><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="305" y="188"></rect><text class="card-title" x="317" y="208">② 缓冲管理</text><text class="lbl-sm" x="317" y="228">单缓冲 / 双缓冲 / 缓冲池</text><text class="lbl-sm" x="317" y="245">缓解 CPU 与设备速度差异</text></g><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="530" y="188"></rect><text class="card-title" x="542" y="208">③ 设备分配与回收</text><text class="lbl-sm" x="542" y="228">独占 / 共享 / 虚拟设备管理</text><text class="lbl-sm" x="542" y="245">避免多进程并发访问冲突</text></g><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="80" y="272"></rect><text class="card-title" x="92" y="292">④ 差错处理</text><text class="lbl-sm" x="92" y="312">校验、重试等通用错误处理</text><text class="lbl-sm" x="92" y="329">屏蔽底层硬件异常</text></g><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="305" y="272"></rect><text class="card-title" x="317" y="292">⑤ 逻辑–物理映射</text><text class="lbl-sm" x="317" y="312">逻辑设备名 → 物理设备</text><text class="lbl-sm" x="317" y="329">依赖逻辑设备表（LUT）</text></g><g><rect fill="#fff" height="72" rx="6" stroke="#90caf9" width="210" x="530" y="272"></rect><text class="card-title" x="542" y="292">⑥ 独立于设备的块大小</text><text class="lbl-sm" x="542" y="312">向上提供统一逻辑块视图</text><text class="lbl-sm" x="542" y="329">隐藏扇区/物理块大小差异</text></g><rect fill="url(#gBot)" height="46" rx="8" stroke="#43a047" stroke-width="1.2" width="700" x="60" y="384"></rect><text class="card-title" text-anchor="middle" x="410" y="412">设备驱动程序（针对具体硬件的指令翻译）</text><line marker-end="url(#arrow)" marker-start="url(#arrow)" stroke="#546e7a" stroke-width="1.6" x1="410" x2="410" y1="118" y2="138"></line><line marker-end="url(#arrow)" marker-start="url(#arrow)" stroke="#546e7a" stroke-width="1.6" x1="410" x2="410" y1="362" y2="382"></line><text class="lbl-sm" x="60" y="132">↑ 向上：统一 API</text><text class="lbl-sm" text-anchor="end" x="670" y="378">↓ 向下：调用驱动</text><rect fill="#fff8e1" height="48" rx="8" stroke="#ffb300" width="700" x="60" y="452"></rect><text class="card-title" x="76" y="472">核心作用</text><text class="lbl-sm" x="76" y="490">屏蔽硬件差异 · 提高模块化与可移植性 · 让上层程序以“文件式”统一方式访问各类 I/O 设备</text></svg>