<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 860 420"><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker><marker id="ar" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c62828"></path></marker><lineargradient id="gStep" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"></stop><stop offset="1" stop-color="#e3f2fd"></stop></lineargradient><lineargradient id="gDev" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffe0b2"></stop><stop offset="1" stop-color="#ffb74d"></stop></lineargradient><lineargradient id="gCPU" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"></stop><stop offset="1" stop-color="#81c784"></stop></lineargradient></defs><text class="h1" text-anchor="middle" x="430" y="28">中断处理程序大致流程</text><text class="sub" text-anchor="middle" x="430" y="48">硬件触发 → 保存现场 → 快速处理 → 恢复现场 → 回到原任务</text><rect fill="#fff3e0" height="70" rx="6" stroke="#fb8c00" stroke-dasharray="4 3" width="800" x="30" y="70"></rect><text class="lane" x="42" y="86">设备 / 硬件</text><rect fill="#e8f5e9" height="180" rx="6" stroke="#43a047" stroke-dasharray="4 3" width="800" x="30" y="150"></rect><text class="lane" x="42" y="166">CPU / 中断处理程序（内核态，高优先级、代码精简）</text><rect fill="#eceff1" height="60" rx="6" stroke="#607d8b" stroke-dasharray="4 3" width="800" x="30" y="340"></rect><text class="lane" x="42" y="358">用户/上层软件</text><rect fill="url(#gDev)" height="40" rx="8" stroke="#e65100" width="170" x="60" y="90"></rect><text class="step-t" text-anchor="middle" x="145" y="107">① 设备事件发生</text><text class="step-d" text-anchor="middle" x="145" y="123">数据到达 / 完成 / 出错</text><path d="M145 132v48" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.8"></path><text class="tag" x="152" y="148">中断信号</text><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="170" x="60" y="185"></rect><text class="step-t" text-anchor="middle" x="145" y="205">② 响应中断</text><text class="step-d" text-anchor="middle" x="145" y="222">暂停当前任务</text><text class="step-d" text-anchor="middle" x="145" y="237">切换到内核态</text></g><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="170" x="248" y="185"></rect><text class="step-t" text-anchor="middle" x="333" y="205">③ 保存现场</text><text class="step-d" text-anchor="middle" x="333" y="222">PC、寄存器、状态字</text><text class="step-d" text-anchor="middle" x="333" y="237">压栈保存</text></g><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="180" x="436" y="185"></rect><text class="step-t" text-anchor="middle" x="526" y="205">④ 识别中断源 / 分发</text><text class="step-d" text-anchor="middle" x="526" y="222">查中断向量表</text><text class="step-d" text-anchor="middle" x="526" y="237">跳转到对应处理例程</text></g><g><rect fill="url(#gCPU)" height="60" rx="8" stroke="#2e7d32" width="170" x="634" y="185"></rect><text class="step-t" text-anchor="middle" x="719" y="205">⑤ 执行中断服务</text><text class="step-d" text-anchor="middle" x="719" y="222">读写设备寄存器</text><text class="step-d" text-anchor="middle" x="719" y="237">搬运数据、置状态</text></g><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="180" x="436" y="260"></rect><text class="step-t" text-anchor="middle" x="526" y="280">⑥ 唤醒/通知上层</text><text class="step-d" text-anchor="middle" x="526" y="297">唤醒等待进程</text><text class="step-d" text-anchor="middle" x="526" y="312">通知驱动/协议栈</text></g><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="170" x="248" y="260"></rect><text class="step-t" text-anchor="middle" x="333" y="280">⑦ 恢复现场</text><text class="step-d" text-anchor="middle" x="333" y="297">从栈中弹出寄存器</text><text class="step-d" text-anchor="middle" x="333" y="312">还原 PC / 状态字</text></g><g><rect fill="url(#gStep)" height="60" rx="8" stroke="#1e88e5" width="170" x="60" y="260"></rect><text class="step-t" text-anchor="middle" x="145" y="280">⑧ 中断返回</text><text class="step-d" text-anchor="middle" x="145" y="297">iret：回用户态</text><text class="step-d" text-anchor="middle" x="145" y="312">继续原任务</text></g><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="230" x2="248" y1="215" y2="215"></line><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="418" x2="436" y1="215" y2="215"></line><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="616" x2="634" y1="215" y2="215"></line><path d="M719 245v45H616" fill="none" marker-end="url(#a)" stroke="#455a64" stroke-width="1.6"></path><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="436" x2="418" y1="290" y2="290"></line><line marker-end="url(#a)" stroke="#455a64" stroke-width="1.6" x1="248" x2="230" y1="290" y2="290"></line><path d="M145 320v40" marker-end="url(#a)" stroke="#455a64" stroke-width="1.6"></path><rect fill="#fff" height="30" rx="6" stroke="#607d8b" width="170" x="60" y="360"></rect><text class="step-d" text-anchor="middle" x="145" y="380">原用户任务继续执行</text><rect fill="#fffde7" height="40" rx="6" stroke="#fbc02d" width="560" x="260" y="352"></rect><text class="step-t" x="272" y="370">要点</text><text class="step-d" x="272" y="386">运行在内核态 · 极高优先级 · 代码尽量精简 · 关中断保护关键区 · 完成后开中断并返回</text></svg>