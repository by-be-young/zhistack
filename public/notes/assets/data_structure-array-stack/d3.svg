<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" viewBox="0 0 820 335"><defs><marker id="ar" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#c62828"></path></marker></defs><text font-size="14" font-weight="700" text-anchor="middle" x="410" y="22">顺序栈 top 指针状态变化（约定 top=-1 表示空栈）</text><g transform="translate(40,55)"><text class="title" x="80" y="0">① 空栈 (top=-1)</text><g transform="translate(20,20)"><rect class="cell" height="32" width="32" x="0" y="0"></rect><rect class="cell" height="32" width="32" x="32" y="0"></rect><rect class="cell" height="32" width="32" x="64" y="0"></rect><rect class="cell" height="32" width="32" x="96" y="0"></rect><rect class="cell" height="32" width="32" x="128" y="0"></rect><text class="lbl" text-anchor="middle" x="16" y="48">0</text><text class="lbl" text-anchor="middle" x="48" y="48">1</text><text class="lbl" text-anchor="middle" x="80" y="48">2</text><text class="lbl" text-anchor="middle" x="112" y="48">3</text><text class="lbl" text-anchor="middle" x="144" y="48">4</text></g><text class="ptr" text-anchor="end" x="20" y="105">top → -1</text><path d="M30 1e2.0 80" fill="none" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.5"></path><text class="note" x="100" y="135">isEmpty: top == -1</text></g><g transform="translate(240,55)"><text class="title" x="80" y="0">② push(5) (top=0)</text><g transform="translate(20,20)"><rect class="used" height="32" width="32" x="0" y="0"></rect><text text-anchor="middle" x="16" y="16">5</text><rect class="cell" height="32" width="32" x="32" y="0"></rect><rect class="cell" height="32" width="32" x="64" y="0"></rect><rect class="cell" height="32" width="32" x="96" y="0"></rect><rect class="cell" height="32" width="32" x="128" y="0"></rect><text class="lbl" text-anchor="middle" x="16" y="48">0</text><text class="lbl" text-anchor="middle" x="48" y="48">1</text><text class="lbl" text-anchor="middle" x="80" y="48">2</text><text class="lbl" text-anchor="middle" x="112" y="48">3</text><text class="lbl" text-anchor="middle" x="144" y="48">4</text></g><path d="M36 85V55" fill="none" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.5"></path><text class="ptr" text-anchor="middle" x="36" y="100">top=0</text><text class="note" x="100" y="135">先 ++top，再写入 a[top]</text></g><g transform="translate(440,55)"><text class="title" x="80" y="0">③ push(7) (top=1)</text><g transform="translate(20,20)"><rect class="used" height="32" width="32" x="0" y="0"></rect><text text-anchor="middle" x="16" y="16">5</text><rect class="used" height="32" width="32" x="32" y="0"></rect><text text-anchor="middle" x="48" y="16">7</text><rect class="cell" height="32" width="32" x="64" y="0"></rect><rect class="cell" height="32" width="32" x="96" y="0"></rect><rect class="cell" height="32" width="32" x="128" y="0"></rect><text class="lbl" text-anchor="middle" x="16" y="48">0</text><text class="lbl" text-anchor="middle" x="48" y="48">1</text><text class="lbl" text-anchor="middle" x="80" y="48">2</text><text class="lbl" text-anchor="middle" x="112" y="48">3</text><text class="lbl" text-anchor="middle" x="144" y="48">4</text></g><path d="M68 85V55" fill="none" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.5"></path><text class="ptr" text-anchor="middle" x="68" y="100">top=1</text><text class="note" x="100" y="135">栈顶始终指向最新元素</text></g><g transform="translate(640,55)"><text class="title" x="80" y="0">④ pop()→7 (top=0)</text><g transform="translate(20,20)"><rect class="used" height="32" width="32" x="0" y="0"></rect><text text-anchor="middle" x="16" y="16">5</text><rect class="cell" height="32" stroke-dasharray="3 3" width="32" x="32" y="0"></rect><text fill="#aaa" text-anchor="middle" x="48" y="16">7</text><rect class="cell" height="32" width="32" x="64" y="0"></rect><rect class="cell" height="32" width="32" x="96" y="0"></rect><rect class="cell" height="32" width="32" x="128" y="0"></rect><text class="lbl" text-anchor="middle" x="16" y="48">0</text><text class="lbl" text-anchor="middle" x="48" y="48">1</text><text class="lbl" text-anchor="middle" x="80" y="48">2</text><text class="lbl" text-anchor="middle" x="112" y="48">3</text><text class="lbl" text-anchor="middle" x="144" y="48">4</text></g><path d="M36 85V55" fill="none" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.5"></path><text class="ptr" text-anchor="middle" x="36" y="100">top=0</text><text class="note" x="100" y="135">先取 a[top]，再 top--</text></g><g transform="translate(240,210)"><text class="title" x="80" y="0">⑤ 栈满 (top=MAX_SIZE-1=4)</text><g transform="translate(20,20)"><rect class="used" height="32" width="32" x="0" y="0"></rect><text text-anchor="middle" x="16" y="16">5</text><rect class="used" height="32" width="32" x="32" y="0"></rect><text text-anchor="middle" x="48" y="16">7</text><rect class="used" height="32" width="32" x="64" y="0"></rect><text text-anchor="middle" x="80" y="16">3</text><rect class="used" height="32" width="32" x="96" y="0"></rect><text text-anchor="middle" x="112" y="16">9</text><rect class="used" height="32" width="32" x="128" y="0"></rect><text text-anchor="middle" x="144" y="16">2</text></g><path d="M164 75V55" fill="none" marker-end="url(#ar)" stroke="#c62828" stroke-width="1.5"></path><text class="ptr" text-anchor="middle" x="164" y="90">top=4</text><text class="note" x="100" y="115">isFull: top == MAX_SIZE-1</text></g><g transform="translate(460,225)"><rect fill="#fffde7" height="96" stroke="#f9a825" width="340" x="0" y="0"></rect><text font-weight="600" x="10" y="18">边界规则</text><text font-size="11" x="10" y="36">• push：if top==MAX_SIZE-1 → 满；否则 a[++top]=x</text><text font-size="11" x="10" y="52">• pop ：if top==-1 → 空；否则 x=a[top--]</text><text font-size="11" x="10" y="68">• 注意 ++top / top-- 的副作用顺序，</text><text font-size="11" x="10" y="84">　决定 top 指向 “顶端元素” 还是 “顶端后一格”</text></g></svg>