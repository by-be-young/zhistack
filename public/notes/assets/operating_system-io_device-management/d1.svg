<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 760 380"><defs><lineargradient id="bgGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fdfdff"></stop><stop offset="100%" stop-color="#f3f5fb"></stop></lineargradient><lineargradient id="producerGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff8a65"></stop><stop offset="100%" stop-color="#ef5350"></stop></lineargradient><lineargradient id="consumerGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4fc3f7"></stop><stop offset="100%" stop-color="#1e88e5"></stop></lineargradient><lineargradient id="bufferGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fffde7"></stop><stop offset="100%" stop-color="#fff59d"></stop></lineargradient><lineargradient id="cellFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#a5d6a7"></stop><stop offset="100%" stop-color="#66bb6a"></stop></lineargradient><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker><filter height="140%" id="soft" width="140%" x="-20%" y="-20%"><fegaussianblur in="SourceAlpha" stddeviation="2"></fegaussianblur><feoffset dx="0" dy="2" result="off"></feoffset><fecomponenttransfer><fefunca slope=".18" type="linear"></fefunca></fecomponenttransfer><femerge><femergenode></femergenode><femergenode in="SourceGraphic"></femergenode></femerge></filter></defs><rect fill="url(#bgGrad)" height="380" width="760"></rect><text fill="#263238" font-size="20" font-weight="600" text-anchor="middle" x="380" y="38">缓冲区：解耦快慢两端，平滑数据流</text><g filter="url(#soft)"><rect fill="url(#producerGrad)" height="100" rx="14" width="140" x="40" y="140"></rect></g><text fill="#fff" font-size="16" font-weight="600" text-anchor="middle" x="110" y="180">生产者</text><text fill="#fff" font-size="12" opacity=".95" text-anchor="middle" x="110" y="202">CPU / 进程</text><text fill="#fff" font-size="11" opacity=".85" text-anchor="middle" x="110" y="220">速度快 · 突发</text><g filter="url(#soft)"><rect fill="url(#bufferGrad)" height="160" rx="16" stroke="#fbc02d" stroke-width="1.5" width="280" x="240" y="110"></rect></g><text fill="#5d4037" font-size="14" font-weight="600" text-anchor="middle" x="380" y="138">缓冲区 (内存中)</text><g><rect fill="url(#cellFill)" height="48" rx="6" width="40" x="262" y="158"></rect><rect fill="url(#cellFill)" height="48" rx="6" width="40" x="308" y="158"></rect><rect fill="url(#cellFill)" height="48" rx="6" width="40" x="354" y="158"></rect><rect fill="#e0e0e0" height="48" rx="6" stroke="#bdbdbd" stroke-dasharray="3 3" width="40" x="400" y="158"></rect><rect fill="#e0e0e0" height="48" rx="6" stroke="#bdbdbd" stroke-dasharray="3 3" width="40" x="446" y="158"></rect></g><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="282" y="188">D1</text><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="328" y="188">D2</text><text fill="#fff" font-size="13" font-weight="600" text-anchor="middle" x="374" y="188">D3</text><text fill="#9e9e9e" font-size="13" text-anchor="middle" x="420" y="188">空</text><text fill="#9e9e9e" font-size="13" text-anchor="middle" x="466" y="188">空</text><text fill="#6d4c41" font-size="11" text-anchor="middle" x="380" y="234">先进先出 · 临时存储</text><text fill="#6d4c41" font-size="11" text-anchor="middle" x="380" y="252">写入端 → 读取端</text><g filter="url(#soft)"><rect fill="url(#consumerGrad)" height="100" rx="14" width="140" x="580" y="140"></rect></g><text fill="#fff" font-size="16" font-weight="600" text-anchor="middle" x="650" y="180">消费者</text><text fill="#fff" font-size="12" opacity=".95" text-anchor="middle" x="650" y="202">I/O 设备</text><text fill="#fff" font-size="11" opacity=".85" text-anchor="middle" x="650" y="220">速度慢 · 平稳</text><path d="M182 190h53" fill="none" marker-end="url(#arrow)" stroke="#455a64" stroke-width="2.2"></path><path d="M525 190h53" fill="none" marker-end="url(#arrow)" stroke="#455a64" stroke-width="2.2"></path><text fill="#37474f" font-size="11" text-anchor="middle" x="208" y="180">写入</text><text fill="#37474f" font-size="11" text-anchor="middle" x="551" y="180">读取</text><g fill="#37474f" font-size="12"><circle cx="120" cy="310" fill="#66bb6a" r="6"></circle><text x="135" y="314">CPU 无需等待慢设备</text><circle cx="320" cy="310" fill="#66bb6a" r="6"></circle><text x="335" y="314">削峰填谷，匹配速度差</text><circle cx="540" cy="310" fill="#66bb6a" r="6"></circle><text x="555" y="314">减少 I/O 中断频率</text></g><text fill="#90a4ae" font-size="11" text-anchor="middle" x="380" y="358">一块预留在内存中的临时存放区，让 I/O 与计算并行推进</text></svg>