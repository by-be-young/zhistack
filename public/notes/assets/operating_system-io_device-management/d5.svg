="515" y="233">USB bus2</text><rect fill="#fffde7" height="50" stroke="#ffe082" width="270" x="275" y="253"></rect><text font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle" x="335" y="283">/dev/tty1</text><text text-anchor="middle" x="430" y="283">char · console</text><text font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle" x="515" y="283">VT 0x3F8</text></g><text fill="#6d4c41" font-size="11" text-anchor="middle" x="410" y="325">查表：逻辑名 → 驱动 + 物理位置</text><g filter="url(#soft4)"><rect fill="url(#devFill)" height="60" rx="12" width="160" x="640" y="110"></rect><rect fill="url(#devFill)" height="60" rx="12" width="160" x="640" y="190"></rect><rect fill="url(#devFill)" height="60" rx="12" width="160" x="640" y="270"></rect></g><g fill="#fff" font-size="13" text-anchor="middle"><text font-weight="600" x="720" y="138">SSD</text><text font-size="11" opacity=".95" x="720" y="158">SATA 总线</text><text font-weight="600" x="720" y="218">打印机</text><text font-size="11" opacity=".95" x="720" y="238">USB 接口</text><text font-weight="600" x="720" y="298">控制台</text><text font-size="11" opacity=".95" x="720" y="318">VT 终端</text></g><path d="M182 140l76 38" fill="none" marker-end="url(#arr4)" stroke="#5e35b1" stroke-width="1.8"></path><path d="M182 220l76 8" fill="none" marker-end="url(#arr4)" stroke="#5e35b1" stroke-width="1.8"></path><path d="M182 3e2l76-22" fill="none" marker-end="url(#arr4)" stroke="#5e35b1" stroke-width="1.8"></path><path d="M562 178l76-38" fill="none" marker-end="url(#arr4)" stroke="#00897b" stroke-width="1.8"></path><path d="M562 228l76-8" fill="none" marker-end="url(#arr4)" stroke="#00897b" stroke-width="1.8"></path><path d="M562 278l76 22" fill="none" marker-end="url(#arr4)" stroke="#00897b" stroke-width="1.8"></path><g fill="#37474f" font-size="12"><circle cx="110" cy="392" fill="#66bb6a" r="5"></circle><text x="124" y="396">屏蔽硬件细节</text><circle cx="290" cy="392" fill="#66bb6a" r="5"></circle><text x="3