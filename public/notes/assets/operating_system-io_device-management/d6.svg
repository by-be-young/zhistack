<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Menlo', monospace" viewBox="0 0 900 560"><defs><marker id="arr" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#455a64"></path></marker><marker id="arrBlue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#1565c0"></path></marker><marker id="arrGreen" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10z" fill="#2e7d32"></path></marker><lineargradient id="gUser" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8e1"></stop><stop offset="1" stop-color="#ffe082"></stop></lineargradient><lineargradient id="gSpool" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e3f2fd"></stop><stop offset="1" stop-color="#90caf9"></stop></lineargradient><lineargradient id="gDev" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8e6c9"></stop><stop offset="1" stop-color="#81c784"></stop></lineargradient><lineargradient id="gApp" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f3e5f5"></stop><stop offset="1" stop-color="#ce93d8"></stop></lineargradient></defs><text class="h1" text-anchor="middle" x="450" y="26">SPOOLing 技术 — 概念与典型应用</text><text class="sub" text-anchor="middle" x="450" y="46">Simultaneous Peripheral Operations On-Line · 用磁盘做中间缓冲，把独占设备"改造"成共享设备</text><text class="lay" x="30" y="80">一、核心概念</text><line stroke="#cfd8dc" stroke-width="1" x1="30" x2="870" y1="86" y2="86"></line><rect fill="url(#gUser)" height="180" rx="8" stroke="#f9a825" width="150" x="30" y="105"></rect><text class="lay" text-anchor="middle" x="105" y="125">多个用户 / 进程</text><g><circle cx="65" cy="155" fill="#fff" r="14" stroke="#f57f17"></circle><text class="zh" text-anchor="middle" x="65" y="159">P1</text><circle cx="105" cy="155" fill="#fff" r="14" stroke="#f57f17"></circle><text class="zh" text-anchor="middle" x="105" y="159">P2</text><circle cx="145" cy="155" fill="#fff" r="14" stroke="#f57f17"></circle><text class="zh" text-anchor="middle" x="145" y="159">P3</text></g><text class="zh-s" text-anchor="middle" x="105" y="200">提交 I/O 请求后</text><text class="zh-s" text-anchor="middle" x="105" y="216">立即返回，继续</text><text class="zh-s" text-anchor="middle" x="105" y="232">执行自己的任务</text><text class="tag" text-anchor="middle" x="105" y="262">感觉像独享设备</text><line marker-end="url(#arrBlue)" stroke="#1565c0" stroke-width="1.8" x1="180" x2="235" y1="160" y2="160"></line><text class="lab" text-anchor="middle" x="207" y="152">写入</text><rect fill="url(#gSpool)" height="285" rx="10" stroke="#1565c0" stroke-width="1.6" width="360" x="235" y="105"></rect><text class="lay" text-anchor="middle" x="415" y="126">SPOOLing 子系统（假脱机）</text><text class="tag" text-anchor="middle" x="415" y="144">运行在主机 / CPU，用软件模拟"外围控制机"</text><rect fill="#fff" height="90" rx="6" stroke="#1565c0" width="150" x="255" y="160"></rect><text class="k" text-anchor="middle" x="330" y="180">输入井（磁盘）</text><text class="zh-s" text-anchor="middle" x="330" y="200">模拟脱机时的输入带</text><g fill="#263238" font-family="Menlo,monospace" font-size="10"><rect fill="#e8f5e9" height="14" stroke="#81c784" width="120" x="270" y="210"></rect><text x="278" y="221">job#1 data...</text><rect fill="#e8f5e9" height="14" stroke="#81c784" width="120" x="270" y="228"></rect><text x="278" y="239">job#2 data...</text></g><rect fill="#fff" height="90" rx="6" stroke="#1565c0" width="150" x="425" y="160"></rect><text class="k" text-anchor="middle" x="500" y="180">输出井（磁盘）</text><text class="zh-s" text-anchor="middle" x="500" y="200">模拟脱机时的输出带</text><g fill="#263238" font-family="Menlo,monospace" font-size="10"><rect fill="#fff3e0" height="14" stroke="#ffb74d" width="120" x="440" y="210"></rect><text x="448" y="221">print job A</text><rect fill="#fff3e0" height="14" stroke="#ffb74d" width="120" x="440" y="228"></rect><text x="448" y="239">print job B</text></g><rect fill="#fff" height="55" rx="6" stroke="#1565c0" stroke-dasharray="4 3" width="150" x="255" y="265"></rect><text class="k" text-anchor="middle" x="330" y="284">输入缓冲区</text><text class="zh-s" text-anchor="middle" x="330" y="302">内存缓冲，衔接磁盘</text><text class="zh-s" text-anchor="middle" x="330" y="315">与低速外设</text><rect fill="#fff" height="55" rx="6" stroke="#1565c0" stroke-dasharray="4 3" width="150" x="425" y="265"></rect><text class="k" text-anchor="middle" x="500" y="284">输出缓冲区</text><text class="zh-s" text-anchor="middle" x="500" y="302">内存缓冲，衔接磁盘</text><text class="zh-s" text-anchor="middle" x="500" y="315">与低速外设</text><rect fill="#e8eaf6" height="45" rx="6" stroke="#3949ab" width="150" x="255" y="335"></rect><text class="k" text-anchor="middle" x="330" y="353">输入进程 SPi</text><text class="zh-s" text-anchor="middle" x="330" y="371">把外设数据 → 输入井</text><rect fill="#e8eaf6" height="45" rx="6" stroke="#3949ab" width="150" x="425" y="335"></rect><text class="k" text-anchor="middle" x="500" y="353">输出进程 SPo</text><text class="zh-s" text-anchor="middle" x="500" y="371">把输出井 → 外设</text><line marker-end="url(#arrGreen)" stroke="#2e7d32" stroke-width="1.8" x1="595" x2="655" y1="245" y2="245"></line><text class="labG" text-anchor="middle" x="625" y="237">按队列</text><text class="labG" text-anchor="middle" x="625" y="260">串行送出</text><rect fill="url(#gDev)" height="285" rx="8" stroke="#2e7d32" width="215" x="655" y="105"></rect><text class="lay" text-anchor="middle" x="762" y="126">低速独占外设</text><text class="zh-s" text-anchor="middle" x="762" y="144">物理上一次只能一个进程占用</text><g transform="translate(690,160)"><rect fill="#fff" height="30" rx="3" stroke="#2e7d32" width="60" x="0" y="14"></rect><rect fill="#fff" height="18" stroke="#2e7d32" width="44" x="8" y="0"></rect><rect fill="#f1f8e9" height="18" stroke="#2e7d32" width="44" x="8" y="30"></rect><circle cx="50" cy="24" fill="#c62828" r="2"></circle><text class="zh" text-anchor="middle" x="30" y="66">打印机</text></g><g transform="translate(780,160)"><rect fill="#fff" height="40" rx="4" stroke="#2e7d32" width="70" x="0" y="6"></rect><circle cx="18" cy="26" fill="#f1f8e9" r="8" stroke="#2e7d32"></circle><circle cx="52" cy="26" fill="#f1f8e9" r="8" stroke="#2e7d32"></circle><text class="zh" text-anchor="middle" x="35" y="66">磁带机</text></g><g transform="translate(690,240)"><rect fill="#fff" height="36" rx="3" stroke="#2e7d32" width="60" x="0" y="0"></rect><rect fill="#f1f8e9" height="20" stroke="#2e7d32" width="48" x="6" y="8"></rect><text class="zh" text-anchor="middle" x="30" y="50">读卡机</text></g><g transform="translate(780,240)"><rect fill="#fff" height="36" rx="3" stroke="#2e7d32" width="70" x="0" y="0"></rect><line stroke="#2e7d32" x1="10" x2="60" y1="18" y2="18"></line><line stroke="#c62828" x1="35" x2="35" y1="6" y2="30"></line><text class="zh" text-anchor="middle" x="35" y="50">绘图仪</text></g><text class="tag" text-anchor="middle" x="762" y="330">"独占"→ 逻辑上"共享"</text><text class="zh-s" text-anchor="middle" x="762" y="352">用户看到的是磁盘上的"虚拟外设"</text><text class="zh-s" text-anchor="middle" x="762" y="370">实际由 SPo/SPi 代为访问物理设备</text><rect fill="#fffde7" height="90" rx="6" stroke="#f9a825" width="150" x="30" y="300"></rect><text class="k" text-anchor="middle" x="105" y="320">三大特点</text><text class="zh-s" x="40" y="340">① 提高 I/O 速度</text><text class="zh-s" x="40" y="358">② 独占设备 → 共享</text><text class="zh-s" x="40" y="376">③ 实现虚拟设备</text><text class="lay" x="30" y="425">二、典型应用</text><line stroke="#cfd8dc" stroke-width="1" x1="30" x2="870" y1="431" y2="431"></line><g><rect fill="url(#gApp)" height="100" rx="8" stroke="#8e24aa" width="200" x="30" y="445"></rect><text class="app-t" text-anchor="middle" x="130" y="466">① 打印服务</text><text class="zh-s" x="40" y="486">多用户提交 → 打印队列</text><text class="zh-s" x="40" y="504">lpd / CUPS 守护进程</text><text class="zh-s" x="40" y="522">按序送往打印机</text><text class="zh-s" x="40" y="540">用户提交即返回</text></g><g><rect fill="url(#gApp)" height="100" rx="8" stroke="#8e24aa" width="200" x="240" y="445"></rect><text class="app-t" text-anchor="middle" x="340" y="466">② 批处理作业</text><text class="zh-s" x="250" y="486">早期读卡机脱机方式</text><text class="zh-s" x="250" y="504">作业先入 输入井</text><text class="zh-s" x="250" y="522">CPU 按序调度执行</text><text class="zh-s" x="250" y="540">结果暂存 输出井</text></g><g><rect fill="url(#gApp)" height="100" rx="8" stroke="#8e24aa" width="200" x="450" y="445"></rect><text class="app-t" text-anchor="middle" x="550" y="466">③ 邮件 / 消息队列</text><text class="zh-s" x="460" y="486">SMTP 邮件先落盘</text><text class="zh-s" x="460" y="504">MTA 后台异步投递</text><text class="zh-s" x="460" y="522">发件方无需等待送达</text><text class="zh-s" x="460" y="540">典型的"离线并发"</text></g><g><rect fill="url(#gApp)" height="100" rx="8" stroke="#8e24aa" width="210" x="660" y="445"></rect><text class="app-t" text-anchor="middle" x="765" y="466">④ 网络下载 / 缓存</text><text class="zh-s" x="670" y="486">数据先落磁盘缓存</text><text class="zh-s" x="670" y="504">再由后台程序处理</text><text class="zh-s" x="670" y="522">解耦"到达"与"消费"</text><text class="zh-s" x="670" y="540">同为 SPOOLing 思想</text></g></svg>