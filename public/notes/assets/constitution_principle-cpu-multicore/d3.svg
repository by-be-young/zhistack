</rect><text fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle" x="465" y="312">t<tspan baseline-shift="-25%" font-size="12">3</tspan></text><text fill="#334155" text-anchor="middle" x="465" y="336">a<tspan baseline-shift="-25%" font-size="12">21</tspan>+ b<tspan baseline-shift="-25%" font-size="12">21</tspan></text><text fill="#9a3412" text-anchor="middle" x="465" y="354">= c<tspan baseline-shift="-25%" font-size="12">21</tspan></text><rect fill="#eff6ff" height="70" rx="8" stroke="#3b82f6" stroke-width="1.6" width="150" x="570" y="290"></rect><text fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle" x="645" y="312">t<tspan baseline-shift="-25%" font-size="12">4</tspan></text><text fill="#334155" text-anchor="middle" x="645" y="336">a<tspan baseline-shift="-25%" font-size="12">22</tspan>+ b<tspan baseline-shift="-25%" font-size="12">22</tspan></text><text fill="#9a3412" text-anchor="middle" x="645" y="354">= c<tspan baseline-shift="-25%" font-size="12">22</tspan></text></g><g fill="none" marker-end="url(#s_arrow)" stroke="#94a3b8" stroke-width="1.6"><path d="M180 325h28"></path><path d="M360 325h28"></path><path d="M540 325h28"></path></g><text fill="#64748b" font-size="12" font-style="italic" text-anchor="middle" x="380" y="392">时间从左到右推进：任一时刻只处理一个数据，共需 4 步</text></svg>