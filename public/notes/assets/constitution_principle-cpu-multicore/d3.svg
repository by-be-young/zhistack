<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 760 400"><defs><marker id="s_arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#64748b"></path></marker><marker id="s_arrowBlue" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#2563eb"></path></marker><marker id="s_arrowOrange" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#ea580c"></path></marker></defs><rect fill="#dbeafe" height="46" rx="8" stroke="#2563eb" stroke-width="2" width="180" x="290" y="20"></rect><text fill="#1e3a8a" font-size="14" font-weight="700" text-anchor="middle" x="380" y="42">单指令流</text><text fill="#1e40af" font-size="13" text-anchor="middle" x="380" y="60">指令: ADD</text><line marker-end="url(#s_arrowBlue)" stroke="#2563eb" stroke-width="1.6" x1="380" x2="380" y1="66" y2="116"></line><rect fill="#f1f5f9" height="70" rx="8" stroke="#94a3b8" stroke-width="1.6" width="150" x="30" y="120"></rect><text fill="#334155" font-size="13" font-weight="700" text-anchor="middle" x="105" y="144">单数据流</text><text fill="#475569" font-size="12" text-anchor="middle" x="105" y="164">每次读入一对</text><text fill="#475569" font-size="12" text-anchor="middle" x="105" y="180">元素 (a<tspan baseline-shift="-25%" font-size="11">i</tspan>, b<tspan baseline-shift="-25%" font-size="11">i</tspan>)</text><line marker-end="url(#s_arrow)" stroke="#64748b" stroke-width="1.6" x1="180" x2="312" y1="155" y2="155"></line><rect fill="#d1fae5" height="90" rx="10" stroke="#059669" stroke-width="2" width="130" x="315" y="118"></rect><text fill="#065f46" font-size="14" font-weight="700" text-anchor="middle" x="380" y="146">单个处理单元</text><text fill="#047857" font-size="13" text-anchor="middle" x="380" y="166">PU</text><text fill="#047857" font-size="20" font-weight="700" text-anchor="middle" x="380" y="194">+</t