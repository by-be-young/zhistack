<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" viewBox="0 0 840 300"><defs><marker id="f_blue" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#2563eb"></path></marker><marker id="f_orange" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#ea580c"></path></marker><marker id="f_green" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path d="M0 0 6 3 0 6z" fill="#059669"></path></marker></defs><text fill="#1e3a8a" font-size="15" font-weight="700" x="20" y="52">指令流（Instruction Stream）</text><g font-size="12"><rect fill="#dbeafe" height="44" rx="6" stroke="#2563eb" stroke-width="1.6" width="110" x="20" y="66"></rect><text fill="#1e40af" text-anchor="middle" x="75" y="93">ADD R1,R2</text><rect fill="#dbeafe" height="44" rx="6" stroke="#2563eb" stroke-width="1.6" width="110" x="140" y="66"></rect><text fill="#1e40af" text-anchor="middle" x="195" y="93">LOAD R3,X</text><rect fill="#dbeafe" height="44" rx="6" stroke="#2563eb" stroke-width="1.6" width="110" x="260" y="66"></rect><text fill="#1e40af" text-anchor="middle" x="315" y="93">SUB R2,R1</text><rect fill="#dbeafe" height="44" rx="6" stroke="#2563eb" stroke-width="1.6" width="110" x="380" y="66"></rect><text fill="#1e40af" text-anchor="middle" x="435" y="93">MUL R1,R4</text></g><g fill="none" marker-end="url(#f_blue)" stroke="#2563eb" stroke-width="1.6"><path d="M130 88h8"></path><path d="M250 88h8"></path><path d="M370 88h8"></path><path d="M490 88l66 32"></path></g><text fill="#2563eb" font-size="11" font-style="italic" text-anchor="middle" x="255" y="128">按顺序逐条取指 → 规定「做什么操作」</text><rect fill="#ecfdf5" height="210" rx="10" stroke="#059669" stroke-width="2" width="215" x="540" y="66"></rect><text fill="#065f46" font-size="14" font-weight="700" text-anchor="middle" x="647" y="60">处理单元 (PU)</text><rect fill="#d1fae5" height="72" rx="8" stroke="#059669" stroke-width="1.4" width="180" x="558" y="90"></rect><text fill="#065f46" font-size="13" font-weight="700" text-anchor="middle" x="648" y="122">控制器</text><text fill="#047857" font-size="12" text-anchor="middle" x="648" y="142">译码指令</text><rect fill="#d1fae5" height="72" rx="8" stroke="#059669" stroke-width="1.4" width="180" x="558" y="182"></rect><text fill="#065f46" font-size="13" font-weight="700" text-anchor="middle" x="648" y="214">运算器 (ALU)</text><text fill="#047857" font-size="12" text-anchor="middle" x="648" y="234">对数据执行运算</text><line marker-end="url(#f_green)" stroke="#059669" stroke-width="1.6" x1="648" x2="648" y1="162" y2="180"></line><text fill="#059669" font-size="10" text-anchor="middle" x="700" y="176">控制</text><text fill="#9a3412" font-size="15" font-weight="700" x="20" y="212">数据流（Data Stream）</text><g font-size="13"><rect fill="#ffedd5" height="42" rx="6" stroke="#ea580c" stroke-width="1.6" width="60" x="20" y="224"></rect><text fill="#9a3412" text-anchor="middle" x="50" y="251">5</text><rect fill="#ffedd5" height="42" rx="6" stroke="#ea580c" stroke-width="1.6" width="60" x="110" y="224"></rect><text fill="#9a3412" text-anchor="middle" x="140" y="251">3</text><rect fill="#ffedd5" height="42" rx="6" stroke="#ea580c" stroke-width="1.6" width="60" x="200" y="224"></rect><text fill="#9a3412" text-anchor="middle" x="230" y="251">8</text><rect fill="#ffedd5" height="42" rx="6" stroke="#ea580c" stroke-width="1.6" width="60" x="290" y="224"></rect><text fill="#9a3412" text-anchor="middle" x="320" y="251">2</text><rect fill="#fff7ed" height="42" rx="6" stroke="#ea580c" stroke-dasharray="4 3" stroke-width="1.4" width="60" x="380" y="224"></rect><text fill="#c2410c" text-anchor="middle" x="410" y="251">…</text></g><g fill="none" marker-end="url(#f_orange)" stroke="#ea580c" stroke-width="1.6"><path d="M80 245h28"></path><path d="M170 245h28"></path><path d="M260 245h28"></path><path d="M350 245h28"></path><path d="M440 245l116-21"></path></g><text fill="#ea580c" font-size="11" font-style="italic" text-anchor="middle" x="250" y="288">被读取 / 处理 / 写回的一串数据 → 操作「作用的对象」</text><line marker-end="url(#f_green)" stroke="#059669" stroke-width="1.8" x1="755" x2="795" y1="218" y2="218"></line><text fill="#065f46" font-size="12" font-weight="700" text-anchor="middle" x="812" y="222">结果</text><line stroke="#cbd5e1" stroke-width="1.2" x1="20" x2="820" y1="308" y2="308"></line><text fill="#334155" font-size="12.5" x="20" y="330"><tspan fill="#1e40af" font-weight="700">指令</tspan>规定「做什么操作」，<tspan fill="#9a3412" font-weight="700">数据</tspan>是该操作「作用的对象」；二者成流地送入处理单元。</text></svg>