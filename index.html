<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F3EE" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="知栈" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="知栈 · 考研知识库平台：公共课与 408 的书库、知识点检索、题库、错题、抽卡集章与薄弱点推荐" />
    <title>知栈 · 考研知识库</title>
    <style>
      /* 首屏装载提示：脚本尚未执行时也能看到"正在加载"，而不是一片空白 */
      #boot {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #F4F3EE; color: #15181C;
        font-family: "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        transition: opacity 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      html[data-theme='dark'] #boot { background: #0B0D10; color: #E8EDE9; }
      #boot .boot-brand { font-size: 20px; letter-spacing: 0.18em; }
      #boot .boot-track { width: 152px; height: 2px; border-radius: 2px; background: rgba(20, 22, 26, 0.1); overflow: hidden; }
      html[data-theme='dark'] #boot .boot-track { background: rgba(232, 237, 233, 0.12); }
      #boot .boot-track i { display: block; width: 40%; height: 100%; background: #2E9C74; animation: bootSweep 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
      html[data-theme='dark'] #boot .boot-track i { background: #9FE8C7; }
      #boot .boot-tip { margin: 0; font-size: 11px; letter-spacing: 0.08em; opacity: 0.55; }
      @keyframes bootSweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { #boot .boot-track i { animation: none; width: 100%; opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-brand">知栈</div>
      <div class="boot-track"><i></i></div>
      <p class="boot-tip">正在装载知识库…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
